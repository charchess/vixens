---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - apps/core-prod-root.yaml
  # Disabled by owner: apps/crowdsec.yaml
  - apps/vpa.yaml
  - apps/kyverno.yaml
  # Disabled by owner: apps/nexterm.yaml
  # UMI development overlays must never be deployed to production.
  # Official TrueNAS CSI controller and provider-neutral StorageClasses.
  # Existing bound PVs keep their immutable CSI identities.
  - apps/synelia-prod-csi.yaml
  - apps/keda.yaml
  - apps/keda-http-addon.yaml
  # Disabled by owner: apps/nightscout.yaml
  # Disabled by owner: apps/mealie.yaml
  # Disabled by owner: apps/birdnet-go.yaml
  - apps/victoria-metrics.yaml
  - apps/grafana.yaml
  # Disabled by owner: apps/homepage.yaml
  # Disabled by owner: apps/linkwarden.yaml
  # Disabled by owner: apps/gluetun.yaml
  # Disabled by owner: apps/sabnzbd.yaml
  # Disabled by owner: apps/qbittorrent.yaml
  # Disabled by owner: apps/amule.yaml
  # Disabled by owner: apps/radarr.yaml
  # Disabled by owner: apps/docspell.yaml
  # Disabled by owner: apps/firefly-iii.yaml
  # Disabled by owner: apps/firefly-iii-importer.yaml
  # Disabled by owner: apps/n8n.yaml
  # Disabled by owner: apps/lidarr.yaml
  # Disabled by owner: apps/booklore.yaml
  # Disabled by owner: apps/sonarr.yaml
  # Disabled by owner: apps/prowlarr.yaml
  # Disabled by owner: apps/whisparr.yaml
  # Disabled by owner: apps/mylar.yaml
  # Disabled by owner: apps/jellyseerr.yaml
  # Disabled by owner: apps/jellyfin.yaml
  # Disabled by owner: apps/hydrus-client.yaml
  # Disabled by owner: apps/vaultwarden.yaml
  # Disabled by owner: apps/sakapuss.yaml

  - apps/cloudnative-pg-crds.yaml
  - apps/cloudnative-pg.yaml
  - apps/plugin-barman-cloud.yaml
  # Disabled by owner: apps/changedetection.yaml
  # Disabled by owner: apps/netbird.yaml
  # Disabled by owner: apps/netvisor.yaml
  # Disabled by owner: apps/nocodb.yaml
  # Disabled by owner: apps/netbox.yaml
  # Disabled by owner: apps/fluent-bit-syslog.yaml
  # Disabled by owner: apps/stirling-pdf.yaml
  # Disabled by owner: apps/it-tools.yaml
  - apps/external-dns-gandi.yaml
  - apps/external-dns-unifi.yaml
  # Disabled by owner: apps/mariadb-shared.yaml
  # Disabled by owner: apps/mongodb-shared.yaml
  # Disabled by owner: apps/penpot.yaml
  # Disabled by owner: apps/vikunja.yaml
  # Disabled by owner: apps/bookshelf.yaml

patches:
  # Operational domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(shared-namespaces|external-secrets|openbao-secrets)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(cilium-lb|traefik|traefik-middlewares|metrics-server)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(priority-classes|cert-manager|cert-manager-secrets)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(cert-manager-webhook-gandi|cert-manager-config)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(snapshot-controller|local-path-provisioner)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(truenas-csi-secrets|truenas-csi-iscsi|truenas-csi-nfs)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  # Operational domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(vpa|goldilocks|reloader)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(prometheus-operator-crds|kyverno|policy-reporter)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(descheduler|headlamp|traefik-dashboard|whoami|keda)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(keda-http-addon|mail-gateway|mosquitto|victoria-metrics)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(grafana|grafana-ingress|hubble-ui)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(cloudnative-pg-crds|cloudnative-pg|plugin-barman-cloud)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(redis-shared|postgresql-shared|adguard-home|authentik|loki)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(fluent-bit|snmp-exporter|renovate|external-dns-gandi)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(external-dns-gandi-secrets|external-dns-unifi)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(external-dns-unifi-secrets|trivy|maturity-controller)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  # Operational domain: fabric
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(txo-fabric)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: fabric
  # Operational domain: personal
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(mail|homeassistant|pyload|actual-budget|music-assistant)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: personal
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(contacts|radar|trilium)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: personal
