---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - apps/shared-namespaces.yaml
  - apps/external-secrets.yaml
  - apps/openbao-secrets.yaml
  - apps/velero-secrets.yaml
  - apps/velero.yaml
  - apps/cilium-lb.yaml
  # Disabled by owner: apps/crowdsec.yaml
  - apps/traefik.yaml
  - apps/traefik-middlewares.yaml
  - apps/metrics-server.yaml
  - apps/priority-classes.yaml
  - apps/vpa.yaml
  - apps/goldilocks.yaml
  - apps/reloader.yaml
  - apps/prometheus-operator-crds.yaml
  - apps/kyverno.yaml
  - apps/policy-reporter.yaml
  - apps/descheduler.yaml
  - apps/headlamp.yaml
  # Disabled by owner: apps/nexterm.yaml
  - apps/traefik-dashboard.yaml
  - apps/argocd.yaml
  - apps/txo-fabric.yaml
  - apps/whoami.yaml
  - apps/cert-manager.yaml
  - apps/cert-manager-secrets.yaml
  - apps/cert-manager-webhook-gandi.yaml
  - apps/cert-manager-config.yaml
  - apps/snapshot-controller.yaml
  # UMI development overlays must never be deployed to production.
  # Disabled by owner: apps/truenas-csi-secrets-umi.yaml
  # Disabled by owner: apps/truenas-csi-iscsi-umi.yaml
  # Disabled by owner: apps/truenas-csi-nfs-umi.yaml
  - apps/local-path-provisioner.yaml
  - apps/keda.yaml
  - apps/keda-http-addon.yaml
  - apps/nfs-storage.yaml
  - apps/truenas-csi-secrets.yaml
  - apps/truenas-csi-iscsi.yaml
  - apps/truenas-csi-nfs.yaml
  - apps/mail-gateway.yaml
  - apps/mail.yaml
  - apps/homeassistant.yaml
  # Disabled by owner: apps/nightscout.yaml
  - apps/mosquitto.yaml
  # Disabled by owner: apps/mealie.yaml
  # Disabled by owner: apps/birdnet-go.yaml
  - apps/victoria-metrics.yaml
  - apps/grafana.yaml
  - apps/grafana-ingress.yaml
  - apps/hubble-ui.yaml
  # Disabled by owner: apps/homepage.yaml
  # Disabled by owner: apps/linkwarden.yaml
  # Disabled by owner: apps/gluetun.yaml
  # Disabled by owner: apps/sabnzbd.yaml
  - apps/pyload.yaml
  # Disabled by owner: apps/qbittorrent.yaml
  # Disabled by owner: apps/amule.yaml
  - apps/media-shared-secrets.yaml
  # Disabled by owner: apps/radarr.yaml
  # Disabled by owner: apps/docspell.yaml
  # Disabled by owner: apps/firefly-iii.yaml
  - apps/actual-budget.yaml
  # Disabled by owner: apps/firefly-iii-importer.yaml
  # Disabled by owner: apps/n8n.yaml
  # Disabled by owner: apps/lidarr.yaml
  # Disabled by owner: apps/booklore.yaml
  # Disabled by owner: apps/sonarr.yaml
  # Disabled by owner: apps/prowlarr.yaml
  # Disabled by owner: apps/whisparr.yaml
  # Disabled by owner: apps/mylar.yaml
  # Disabled by owner: apps/jellyseerr.yaml
  # Disabled by owner: apps/jellyfin.yaml
  # Disabled by owner: apps/hydrus-client.yaml
  - apps/music-assistant.yaml
  # Disabled by owner: apps/vaultwarden.yaml
  # Disabled by owner: apps/sakapuss.yaml

  - apps/cloudnative-pg-crds.yaml
  - apps/cloudnative-pg.yaml
  - apps/plugin-barman-cloud.yaml
  - apps/redis-shared.yaml
  - apps/postgresql-shared.yaml
  # Disabled by owner: apps/changedetection.yaml
  - apps/adguard-home.yaml
  - apps/coredns.yaml
  # Disabled by owner: apps/netbird.yaml
  # Disabled by owner: apps/netvisor.yaml
  # Disabled by owner: apps/nocodb.yaml
  - apps/authentik.yaml
  # Disabled by owner: apps/netbox.yaml
  - apps/loki.yaml
  - apps/fluent-bit.yaml
  # Disabled by owner: apps/fluent-bit-syslog.yaml
  - apps/snmp-exporter.yaml
  - apps/renovate.yaml
  # Disabled by owner: apps/stirling-pdf.yaml
  # Disabled by owner: apps/it-tools.yaml
  - apps/contacts.yaml
  - apps/external-dns-gandi.yaml
  - apps/external-dns-gandi-secrets.yaml
  - apps/external-dns-unifi.yaml
  - apps/external-dns-unifi-secrets.yaml
  # Disabled by owner: apps/mariadb-shared.yaml
  # Disabled by owner: apps/mongodb-shared.yaml
  # Disabled by owner: apps/penpot.yaml
  # Disabled by owner: apps/vikunja.yaml
  - apps/trivy.yaml
  - apps/radar.yaml
  - apps/trilium.yaml
  - apps/maturity-controller.yaml
  # Disabled by owner: apps/bookshelf.yaml

patches:
  # Operational domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(shared-namespaces|external-secrets|openbao-secrets)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(cilium-lb|traefik|traefik-middlewares|metrics-server)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(priority-classes|argocd|cert-manager|cert-manager-secrets)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(cert-manager-webhook-gandi|cert-manager-config)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(snapshot-controller|local-path-provisioner|nfs-storage)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(truenas-csi-secrets|truenas-csi-iscsi|truenas-csi-nfs)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(coredns)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: core
  # Operational domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(velero-secrets|velero|vpa|goldilocks|reloader)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(prometheus-operator-crds|kyverno|policy-reporter)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(descheduler|headlamp|traefik-dashboard|whoami|keda)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(keda-http-addon|mail-gateway|mosquitto|victoria-metrics)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(grafana|grafana-ingress|hubble-ui|media-shared-secrets)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(cloudnative-pg-crds|cloudnative-pg|plugin-barman-cloud)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(redis-shared|postgresql-shared|adguard-home|authentik|loki)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(fluent-bit|snmp-exporter|renovate|external-dns-gandi)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(external-dns-gandi-secrets|external-dns-unifi)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(external-dns-unifi-secrets|trivy|maturity-controller)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: infra
  # Operational domain: fabric
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(txo-fabric)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: fabric
  # Operational domain: personal
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(mail|homeassistant|pyload|actual-budget|music-assistant)$'
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: domain-classification
        labels:
          vixens.io/domain: personal
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: '^(contacts|radar|trilium)$'
