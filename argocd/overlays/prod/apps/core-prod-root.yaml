---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-prod-root
  namespace: argocd
  labels:
    vixens.io/component: domain-root
    vixens.io/domain: core
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: prod-stable
    path: argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
