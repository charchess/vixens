---
# #4205: Official production Synelia CSI. It is intentionally parallel to
# retired-csi; it must not adopt or mutate legacy PVs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synelia-prod-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    vixens.io/domain: core
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
      chart: truenas-csi
      targetRevision: 1.4.0
      helm:
        releaseName: synelia-prod-csi
        valueFiles:
          - $values/apps/01-storage/synelia-csi/prod/values.yaml
    - repoURL: https://github.com/charchess/vixens.git
      targetRevision: prod-stable
      ref: values
    - repoURL: https://github.com/charchess/vixens.git
      targetRevision: prod-stable
      path: apps/01-storage/synelia-csi/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: synelia-prod-csi
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
