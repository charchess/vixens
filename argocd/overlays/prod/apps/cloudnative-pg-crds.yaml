---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2" # Apply before the operator (wave 3)
spec:
  project: default
  source:
    # Pin the exact upstream release commit so CRDs are immutable and upgraded
    # independently before the Helm-managed operator.
    repoURL: https://github.com/cloudnative-pg/cloudnative-pg.git
    targetRevision: 2a35abb4628f209d149825ef3c38011e0701ff2f
    path: config/crd/bases
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Critical for large CRDs
