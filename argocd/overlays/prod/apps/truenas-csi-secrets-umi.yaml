---
# UMI OpenBao/ExternalSecrets wiring for TrueNAS CSI driver configs.
# The actual secret payloads live in OpenBao, not Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truenas-csi-secrets-umi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens.git
    targetRevision: prod-stable
    path: apps/01-storage/truenas-csi/openbao/overlays/umi
  destination:
    server: https://kubernetes.default.svc
    namespace: truenas-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
