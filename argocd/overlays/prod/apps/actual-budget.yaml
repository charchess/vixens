apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actual-budget
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "9"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source: {repoURL: https://github.com/charchess/vixens.git, targetRevision: prod-stable, path: apps/60-services/actual-budget/overlays/prod}
  destination: {server: https://kubernetes.default.svc, namespace: finance}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
