---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truenas-csi-iscsi-umi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://democratic-csi.github.io/charts
      chart: democratic-csi
      targetRevision: 0.15.1
      helm:
        releaseName: truenas-csi-iscsi
        valueFiles:
          - $values/apps/01-storage/truenas-csi/values/iscsi-umi.yaml
    - repoURL: https://github.com/charchess/vixens.git
      targetRevision: feat/hermes-staging
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: truenas-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
