---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hindsight-storage-migration-umi
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    vixens.io/domain: infra
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens.git
    targetRevision: main
    path: apps/60-services/hindsight/storage-migration/umi
  destination:
    server: https://kubernetes.default.svc
    namespace: hindsight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
