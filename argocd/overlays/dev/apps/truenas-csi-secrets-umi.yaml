---
# UMI bootstrap for TrueNAS CSI namespace and secret landing zone.
# The actual driver-config Secrets are created out-of-band from secure files;
# no TrueNAS credential is stored in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truenas-csi-secrets-umi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens.git
    targetRevision: feat/hermes-staging
    path: apps/01-storage/truenas-csi/bootstrap/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: truenas-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
