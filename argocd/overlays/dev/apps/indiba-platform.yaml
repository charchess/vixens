---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: indiba-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens.git
    targetRevision: main
    path: apps/60-services/indiba-platform/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: indiba-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
