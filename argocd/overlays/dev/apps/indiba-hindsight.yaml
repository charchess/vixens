---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: indiba-hindsight
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/vectorize-io/charts
      chart: hindsight
      targetRevision: 0.10.0
      helm:
        valueFiles:
          - $values/apps/60-services/indiba-platform/values/hindsight-dev.yaml
    - repoURL: https://github.com/charchess/vixens.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-indiba
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
