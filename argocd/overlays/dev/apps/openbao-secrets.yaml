---
# Development OpenBao/External Secrets store wiring.
# The ArgoCD Application resource name keeps the historical `-umi` suffix
# temporarily to avoid a delete/recreate migration during repository cleanup.
# UMI uses a dedicated bootstrap Secret:
# `external-secrets/openbao-token-umi` (key `token`) must be delivered
# out of band BEFORE activating the dev store. Never reuse a prod/admin token.
# Urgent UMI recovery temporarily retains the existing HTTP Infra endpoint
# by explicit owner decision (#4185). The bearer token is therefore not
# protected against interception on its network path. HTTPS migration is
# tracked separately by #4188; it is not part of this dev-only token ref change.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-secrets-umi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/part-of: vixens
    app.kubernetes.io/component: secrets-management
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens.git
    targetRevision: main
    path: apps/00-infra/openbao/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
