---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-umi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens.git
    targetRevision: main
    path: apps/60-services/hermes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: services
  # Incident #4185: hold the existing Hermes workload while the verified
  # Synelia recovery PVC is staged. A later reviewed, manual cutover must not
  # race the temporary data-copy Pod or silently prune retained legacy state.
  # Restore automation only after physical startup and rollback validation.
  syncPolicy:
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
