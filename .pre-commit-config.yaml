---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        exclude: |
          (?x)^(
            .*/charts/.*|
            .*/crds/.*|
            .*/templates/.*|
            apps/00-infra/argocd/base/argocd-crds\.yaml|
            apps/00-infra/argocd/base/argocd-install\.yaml
          )$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, yamllint-config.yml]
        exclude: |
          (?x)^(
            .*/charts/.*|
            .*/crds/.*|
            .*/templates/.*|
            apps/00-infra/argocd/base/argocd-crds\.yaml|
            apps/00-infra/argocd/base/argocd-install\.yaml|
            apps/.*/manifests\.yaml|
            apps/.*/servicemonitors\.yaml|
            apps/.*/upstream\.yaml|
            apps/.*/poolers\.yaml
          )$

  - repo: local
    hooks:
      - id: validate-helm-values
        name: Validate ArgoCD inline Helm values
        language: python
        entry: python3 scripts/validation/validate-helm-values.py
        files: ^argocd/
        types: [yaml]
        additional_dependencies: [pyyaml]
      - id: validate-repository
        name: Validate Vixens repository contract
        language: python
        entry: python3 scripts/validation/validate-repository.py
        pass_filenames: false
        always_run: true
