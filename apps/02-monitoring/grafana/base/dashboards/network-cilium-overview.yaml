    {"annotations":{"list":[]},"description":"Cilium/Hubble network observability: metric history from VictoriaMetrics plus retained failed-flow drill-down from Loki; Hubble UI remains the live flow view.","editable":true,"fiscalYearStartMonth":0,"graphTooltip":1,"links":[{"title":"Hubble UI — live flow drill-down","type":"link","url":"https://hubble.truxonline.com/","targetBlank":true}],"panels":[{"id":1,"type":"stat","title":"Flows / s","gridPos":{"x":0,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum(rate(hubble_flows_processed_total{protocol=~\"$protocol\",verdict=~\"$verdict\"}[$__rate_interval])) or vector(0)","instant":true,"refId":"A"}],"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"ops","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null}]}}},"description":"Total Hubble-observed flows per second for the selected protocol/verdict filters."},{"id":2,"type":"stat","title":"Drops / s","gridPos":{"x":4,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum(rate(hubble_drop_total{protocol=~\"$protocol\",reason=~\"$drop_reason\"}[$__rate_interval])) or vector(0)","instant":true,"refId":"A"}],"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"ops","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":0.1},{"color":"red","value":1}]}}},"description":"Dropped flows per second. Use the drop-reason panel for the cause."},{"id":3,"type":"stat","title":"Drop ratio","gridPos":{"x":8,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"100 * (sum(rate(hubble_drop_total{protocol=~\"$protocol\",reason=~\"$drop_reason\"}[$__rate_interval])) / clamp_min(sum(rate(hubble_flows_processed_total{protocol=~\"$protocol\",verdict=~\"$verdict\"}[$__rate_interval])), 0.001)) or vector(0)","instant":true,"refId":"A"}],"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}}},"description":"Drop rate divided by processed-flow rate. Thresholds are visibility hints, not SLOs."},{"id":4,"type":"stat","title":"Policy denied / 5m","gridPos":{"x":12,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum(increase(hubble_drop_total{reason=\"POLICY_DENIED\"}[5m])) or vector(0)","instant":true,"refId":"A"}],"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":20}]}}},"description":"Flows explicitly denied by Cilium policy during the last five minutes."},{"id":5,"type":"stat","title":"DNS failures / 5m","gridPos":{"x":16,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum(increase(hubble_dns_responses_total{rcode!~\"No Error|NoError|NOERROR|0\"}[5m])) or vector(0)","instant":true,"refId":"A"}],"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":20}]}}},"description":"Observed DNS responses whose rcode is not a success value."},{"id":6,"type":"stat","title":"Hubble lost events / 1h","gridPos":{"x":20,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum(increase(hubble_lost_events_total[1h])) or vector(0)","instant":true,"refId":"A"}],"options":{"colorMode":"background","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},"description":"Lost Hubble events mean observability is incomplete; investigate whenever non-zero."},{"id":10,"type":"timeseries","title":"Flows by verdict","gridPos":{"x":0,"y":4,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum by (verdict) (rate(hubble_flows_processed_total{protocol=~\"$protocol\",verdict=~\"$verdict\"}[$__rate_interval]))","legendFormat":"{{verdict}}","refId":"A"}],"options":{"tooltip":{"mode":"multi","sort":"desc"},"legend":{"displayMode":"table","placement":"bottom","showLegend":true,"calcs":["lastNotNull","mean","max"]}},"fieldConfig":{"defaults":{"unit":"ops","custom":{"fillOpacity":8,"lineWidth":2}}},"description":"Trend of processed flows grouped by Hubble verdict."},{"id":11,"type":"timeseries","title":"Drops by reason","gridPos":{"x":12,"y":4,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum by (reason) (rate(hubble_drop_total{protocol=~\"$protocol\",reason=~\"$drop_reason\"}[$__rate_interval]))","legendFormat":"{{reason}}","refId":"A"}],"options":{"tooltip":{"mode":"multi","sort":"desc"},"legend":{"displayMode":"table","placement":"bottom","showLegend":true,"calcs":["lastNotNull","mean","max"]}},"fieldConfig":{"defaults":{"unit":"ops","custom":{"fillOpacity":8,"lineWidth":2}}},"description":"Primary view for policy denials and datapath/network drops."},{"id":12,"type":"timeseries","title":"DNS responses by rcode","gridPos":{"x":0,"y":12,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum by (rcode) (rate(hubble_dns_responses_total{rcode=~\"$rcode\"}[$__rate_interval]))","legendFormat":"{{rcode}}","refId":"A"}],"options":{"tooltip":{"mode":"multi","sort":"desc"},"legend":{"displayMode":"table","placement":"bottom","showLegend":true,"calcs":["lastNotNull","mean","max"]}},"fieldConfig":{"defaults":{"unit":"ops","custom":{"fillOpacity":8,"lineWidth":2}}},"description":"DNS response rates by response code. NXDOMAIN can be normal; watch changes and SERVFAIL-like errors."},{"id":13,"type":"timeseries","title":"TCP flags","gridPos":{"x":12,"y":12,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum by (flag) (rate(hubble_tcp_flags_total[$__rate_interval]))","legendFormat":"{{flag}}","refId":"A"}],"options":{"tooltip":{"mode":"multi","sort":"desc"},"legend":{"displayMode":"table","placement":"bottom","showLegend":true,"calcs":["lastNotNull","mean","max"]}},"fieldConfig":{"defaults":{"unit":"ops","custom":{"fillOpacity":8,"lineWidth":2}}},"description":"TCP flag activity; RST spikes are useful when diagnosing failed or interrupted connections."},{"id":14,"type":"bargauge","title":"Top drop reasons over selected range","gridPos":{"x":0,"y":20,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum by (reason) (increase(hubble_drop_total{protocol=~\"$protocol\",reason=~\"$drop_reason\"}[$__range]))","legendFormat":"{{reason}}","instant":true,"refId":"A"}],"options":{"displayMode":"gradient","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showUnfilled":true},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":100}]}}},"description":"Cumulative drop reasons across the current dashboard time range."},{"id":15,"type":"timeseries","title":"Flow mix by protocol / type","gridPos":{"x":12,"y":20,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"sum by (protocol, type) (rate(hubble_flows_processed_total{protocol=~\"$protocol\",verdict=~\"$verdict\"}[$__rate_interval]))","legendFormat":"{{protocol}} / {{type}}","refId":"A"}],"options":{"tooltip":{"mode":"multi","sort":"desc"},"legend":{"displayMode":"table","placement":"bottom","showLegend":true,"calcs":["lastNotNull","mean","max"]}},"fieldConfig":{"defaults":{"unit":"ops","custom":{"fillOpacity":8,"lineWidth":2}}},"description":"Traffic shape without enabling high-cardinality port-distribution metrics."},{"id":16,"type":"text","title":"Network observability workflow","gridPos":{"x":0,"y":28,"w":24,"h":7},"options":{"mode":"markdown","content":"### How to use this dashboard\n\n**VictoriaMetrics is the metric history/alerting view.** Start with Policy denied, DNS failures, lost events and the drop-reason trend.\n\n**Loki is the retained failed-flow drill-down.** The panel below reads the `hubble-flow` stream and parses the JSON emitted by Hubble. Loki keeps only low-cardinality stream labels (`job` + `node`); pod/IP/port details remain in the JSON payload.\n\n**Hubble UI is the live drill-down tool.** Open [Hubble UI](https://hubble.truxonline.com/) when you need current individual flows, identities or a service map.\n\nThis dashboard intentionally relies only on low-cardinality Hubble metrics (`flow`, `drop`, `dns`, `tcp`). `hubble_port_distribution_total` is filtered by VMAgent in Vixens to avoid unnecessary cardinality.\n\nIf metric panels are empty, verify the `hubble-metrics` scrape. If the Loki panel is empty, verify `{job=\"hubble-flow\"}` in Explore before changing any NetworkPolicy.\n"}},{"id":17,"type":"logs","title":"Failed flow drill-down (Loki)","gridPos":{"x":0,"y":35,"w":24,"h":12},"datasource":{"type":"loki","uid":"${loki_datasource}"},"targets":[{"expr":"{job=\"hubble-flow\"} | json | __error__=\"\" | flow_drop_reason_desc!=\"\"","queryType":"range","refId":"A"}],"options":{"dedupStrategy":"none","enableLogDetails":true,"prettifyLogMessage":false,"showCommonLabels":false,"showLabels":false,"showTime":true,"sortOrder":"Descending","wrapLogMessage":true},"description":"Raw Hubble DROPPED/ERROR flow records retained in Loki. Expand a row for source/destination namespace, pod, IP, L4 and drop-reason fields; use Explore for ad-hoc LogQL filtering."}],"refresh":"30s","schemaVersion":39,"tags":["network","cilium","hubble","security","observability","loki"],"templating":{"list":[{"name":"datasource","label":"Prometheus","type":"datasource","query":"prometheus","current":{},"hide":0,"includeAll":false,"multi":false,"options":[],"refresh":1},{"name":"loki_datasource","label":"Loki","type":"datasource","query":"loki","current":{},"hide":0,"includeAll":false,"multi":false,"options":[],"refresh":1},{"name":"protocol","label":"Protocol","type":"query","datasource":{"type":"prometheus","uid":"${datasource}"},"definition":"label_values(hubble_flows_processed_total, protocol)","query":{"query":"label_values(hubble_flows_processed_total, protocol)","refId":"StandardVariableQuery"},"current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[],"refresh":1,"sort":1},{"name":"verdict","label":"Verdict","type":"query","datasource":{"type":"prometheus","uid":"${datasource}"},"definition":"label_values(hubble_flows_processed_total, verdict)","query":{"query":"label_values(hubble_flows_processed_total, verdict)","refId":"StandardVariableQuery"},"current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[],"refresh":1,"sort":1},{"name":"drop_reason","label":"Drop reason","type":"query","datasource":{"type":"prometheus","uid":"${datasource}"},"definition":"label_values(hubble_drop_total, reason)","query":{"query":"label_values(hubble_drop_total, reason)","refId":"StandardVariableQuery"},"current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[],"refresh":1,"sort":1},{"name":"rcode","label":"DNS rcode","type":"query","datasource":{"type":"prometheus","uid":"${datasource}"},"definition":"label_values(hubble_dns_responses_total, rcode)","query":{"query":"label_values(hubble_dns_responses_total, rcode)","refId":"StandardVariableQuery"},"current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[],"refresh":1,"sort":1}]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"Network & Cilium Overview","uid":"network-cilium-overview","version":2}
