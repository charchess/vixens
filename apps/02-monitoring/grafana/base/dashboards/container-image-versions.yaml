,"textMode":"auto"},"description":"Green < 6h, yellow after the expected 6h cadence, red after 8h. Uses a 7d range so the stat stays visible during an outage."},{"id":7,"title":"Running containers","type":"table","description":"Live pod/container inventory from kube-state-metrics. The digest is the image actually running, even when the declared tag is mutable.","gridPos":{"h":14,"w":24,"x":0,"y":4},"datasource":{"type":"prometheus","uid":"${datasource}"},"targets":[{"expr":"kube_pod_container_info{namespace=~\"$namespace\"} * on(namespace,pod,container) group_left() (kube_pod_container_status_running{namespace=~\"$namespace\"} == 1)","format":"table","instant":true,"refId":"A"}],"options":{"showHeader":true,"cellHeight":"sm"},"fieldConfig":{"defaults":{"custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[]},"transformations":[{"id":"organize","options":{"excludeByName":{"Time":true,"Value":true,"__name__":true,"container_id":true,"uid":true},"indexByName":{"namespace":0,"pod":1,"container":2,"image":3,"image_spec":4,"image_id":5},"renameByName":{"namespace":"Namespace","pod":"Pod","container":"Container","image":"Declared image","image_spec":"Image spec","image_id":"Running image / digest"}}}]},{"id":8,"title":"Renovate image versions","type":"table","gridPos":{"h":18,"w":24,"x":0,"y":18},"datasource":{"type":"prometheus","uid":"${datasource}"},"description":"Newest Renovate row per Docker dependency. GitOps state is file-level main vs prod-stable. Target age is the upstream target release age.","targets":[{"expr":"topk by (repository, manager, package_file, dep_name) (1, max_over_time(vixens_renovate_image_version_info{app=~\"$app\"}[8h])) and on (repository, manager, package_file, dep_name, status, update_type, gitops_file_state, target_age_bucket) max_over_time(vixens_renovate_image_version_info{status=~\"$version_state\",app=~\"$app\",update_type=~\"$update_type\",gitops_file_state=~\"$gitops_state\",target_age_bucket=~\"$target_age\"}[8h])","format":"table","instant":true,"refId":"A"}],"options":{"showHeader":true,"cellHeight":"sm"},"fieldConfig":{"defaults":{"custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byName","options":"Status"},"properties":[{"id":"mappings","value":[{"type":"value","options":{"current":{"text":"YES","color":"green","index":0},"outdated":{"text":"NO","color":"red","index":1},"skipped":{"text":"UNKNOWN","color":"yellow","index":2}}}]}]},{"matcher":{"id":"byName","options":"GitOps state"},"properties":[{"id":"mappings","value":[{"type":"value","options":{"main_differs_from_prod":{"text":"PENDING PROD","color":"orange","index":0},"main_matches_prod":{"text":"IN PROD-STABLE","color":"green","index":1},"unknown":{"text":"UNKNOWN","color":"yellow","index":2}}}]}]},{"matcher":{"id":"byName","options":"Target age"},"properties":[{"id":"mappings","value":[{"type":"value","options":{"none":{"text":"—","index":0},"lt7d":{"text":"< 7d","color":"green","index":1},"7to30d":{"text":"7–30d","color":"yellow","index":2},"30to90d":{"text":"30–90d","color":"orange","index":3},"gt90d":{"text":"> 90d","color":"red","index":4}}}]}]},{"matcher":{"id":"byName","options":"GitOps file"},"properties":[{"id":"links","value":[{"title":"Open in GitHub","url":"https://github.com/charchess/vixens/blob/main/${__value.raw}"}]}]}]},"transformations":[{"id":"organize","options":{"excludeByName":{"Time":true,"Value":true,"__name__":true,"repository":true,"current_value":true,"target_value":true,"current_age_bucket":true},"indexByName":{"status":0,"gitops_file_state":1,"target_age_bucket":2,"app":3,"dep_name":4,"current_version":5,"target_version":6,"update_type":7,"package_file":8,"manager":9,"current_digest":10,"target_digest":11},"renameByName":{"status":"Status","gitops_file_state":"GitOps state","target_age_bucket":"Target age","app":"App","dep_name":"Image / dependency","current_version":"Current","target_version":"Renovate target","update_type":"Update type","package_file":"GitOps file","manager":"Manager","current_digest":"Current digest","target_digest":"Target digest"}}}]},{"id":9,"title":"Reading the dashboard","type":"text","gridPos":{"h":8,"w":24,"x":0,"y":36},"options":{"mode":"markdown","content":"### How to read the Renovate / GitOps state\n\n- **Status = NO**: Renovate currently proposes an update. **YES**: no update candidate. **UNKNOWN**: Renovate skipped or could not resolve the version.\n- **PENDING PROD**: this dependency's **GitOps file differs between `main` and `prod-stable`**. This is deliberately a file-level signal: a file may contain several dependencies, so it is a strong hint rather than proof that this exact dependency is awaiting promotion.\n- **IN PROD-STABLE**: that GitOps file is identical between `main` and `prod-stable`.\n- **Target age** is the age of the upstream release selected by Renovate, not the time since Renovate first detected it.\n- Use **Version à jour**, **GitOps state**, **Target age**, **Update type** and **App** together to answer questions such as “show old updates still waiting for production”.\n"}}],"refresh":"5m","schemaVersion":39,"tags":["kubernetes","versions","renovate","containers","gitops"],"templating":{"list":[{"name":"datasource","label":"Prometheus","type":"datasource","query":"prometheus","current":{},"hide":0,"includeAll":false,"multi":false,"options":[],"refresh":1},{"name":"version_state","label":"Version à jour","type":"custom","query":"Yes : current,No : outdated,Unknown : skipped","current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":false,"options":[]},{"name":"gitops_state","label":"GitOps state","type":"custom","query":"Pending prod : main_differs_from_prod,In prod-stable : main_matches_prod,Unknown : unknown","current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":false,"options":[]},{"name":"target_age","label":"Target age","type":"custom","query":"No target : none,< 7d : lt7d,7-30d : 7to30d,30-90d : 30to90d,> 90d : gt90d","current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[]},{"name":"update_type","label":"Update type","type":"custom","query":"major,minor,patch,digest,pin,bump,replacement,none","current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[]},{"name":"app","label":"App (Renovate)","type":"query","datasource":{"type":"prometheus","uid":"${datasource}"},"definition":"label_values(vixens_renovate_image_version_info, app)","query":{"query":"label_values(vixens_renovate_image_version_info, app)","refId":"StandardVariableQuery"},"current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[],"refresh":1,"sort":1},{"name":"namespace","label":"Namespace (running containers)","type":"query","datasource":{"type":"prometheus","uid":"${datasource}"},"definition":"label_values(kube_pod_container_info, namespace)","query":{"query":"label_values(kube_pod_container_info, namespace)","refId":"StandardVariableQuery"},"current":{"selected":true,"text":"All","value":"$__all"},"includeAll":true,"allValue":".*","multi":true,"options":[],"refresh":1,"sort":1}]},"time":{"from":"now-8h","to":"now"},"timezone":"browser","title":"Container & Image Versions","uid":"container-image-versions","version":3}
