---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-canonical-target-bind
  namespace: monitoring
  annotations: {argocd.argoproj.io/sync-wave: "8"}
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: powder}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: bind
          image: busybox:1.38.0
          command: ["/bin/sh", "-ec"]
          args: ["test -d /data; echo canonical Loki target mounted"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: target, mountPath: /data}]
      volumes:
        - name: target
          persistentVolumeClaim: {claimName: loki-storage-canonical-target}
