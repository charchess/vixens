---
# Progressive production reactivation — monitoring phase 4.
# VictoriaMetrics core, Grafana, node-exporter and kube-state-metrics are validated.
# Enable alert evaluation and notification delivery while logs remain off.
victoria-metrics-operator:
  enabled: true
vmsingle:
  enabled: true
vmagent:
  enabled: true
vmalert:
  enabled: true
alertmanager:
  enabled: true
  spec:
    # Base sets an explicit configSecret, which makes the chart ignore alertmanager.config.
    # Clear it in prod so the chart generates and uses its managed config Secret.
    configSecret: ""
    secrets:
      - alertmanager-secrets
  config:
    # Keep Discord useful during progressive reactivation: only critical alerts notify.
    # Group all critical alerts into one digest to avoid a burst of webhook calls.
    route:
      group_by:
        - severity
      group_wait: 2m
      group_interval: 15m
      repeat_interval: 12h
      receiver: blackhole
      routes:
        - match:
            severity: critical
          receiver: discord-notifications
    receivers:
      - name: blackhole
      - name: discord-notifications
        discord_configs:
          - webhook_url_file: /etc/vm/secrets/alertmanager-secrets/DISCORD_WEBHOOK_URL
            send_resolved: true
            title: 'Vixens · {{ .Status }} · {{ .CommonLabels.severity }}'
            message: '{{ len .Alerts }} alerte(s) dans ce groupe. Consulte Alertmanager/Grafana pour le détail.'
prometheus-node-exporter:
  enabled: true
kube-state-metrics:
  enabled: true
