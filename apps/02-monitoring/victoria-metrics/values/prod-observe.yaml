---
# Progressive production reactivation — monitoring phase 3.
# VictoriaMetrics core + kube-state-metrics + Grafana are validated.
# Re-enable host metrics through node-exporter while keeping alerting and logs off.
victoria-metrics-operator:
  enabled: true
vmsingle:
  enabled: true
vmagent:
  enabled: true
vmalert:
  enabled: false
alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: true
kube-state-metrics:
  enabled: true
