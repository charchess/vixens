---
# Progressive production reactivation — monitoring phase 4.
# VictoriaMetrics core, Grafana, node-exporter and kube-state-metrics are validated.
# Enable alert evaluation and notification delivery while logs remain off.
victoria-metrics-operator:
  enabled: true
vmsingle:
  enabled: true
vmagent:
  enabled: true
vmalert:
  enabled: true
alertmanager:
  enabled: true
  spec:
    secrets:
      - alertmanager-secrets
  config:
    receivers:
      - name: discord-notifications
        slack_configs:
          - api_url_file: /etc/vm/secrets/alertmanager-secrets/DISCORD_WEBHOOK_URL
            channel: '#alerts'
            send_resolved: true
prometheus-node-exporter:
  enabled: true
kube-state-metrics:
  enabled: true
