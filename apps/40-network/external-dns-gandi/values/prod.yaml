---
# ExternalDNS Gandi Configuration (Public)
provider: webhook
domainFilters:
  - truxonline.com
image:
  registry: registry.k8s.io
  repository: external-dns/external-dns
  # v0.23.0 removed the in-tree Gandi provider; it runs as the webhook client.
  # The legacy Gandi implementation is isolated in the localhost bridge below.
  tag: v0.23.0
extraEnvVars: []
# Arguments
extraArgs:
  annotation-filter: external-dns.alpha.kubernetes.io/public=true
  # Existing production Ingresses use alpha target/hostname annotations;
  # keep their CNAME semantics while the controller uses the webhook provider.
  annotation-prefix: external-dns.alpha.kubernetes.io/
  webhook-provider-url: http://localhost:8888
sidecars:
  # The upstream Gandi provider was removed from ExternalDNS v0.23.0. Keep
  # the current controller on v0.23.0 and isolate the compatible v0.21.0
  # provider behind the upstream-supported localhost webhook interface.
  - name: gandi-webhook-bridge
    # Gandi was removed from recent ExternalDNS controllers. The bridge must
    # therefore retain a Gandi-capable ExternalDNS binary while serving the
    # standard webhook API to the current controller.
    image: registry.k8s.io/external-dns/external-dns:v0.23.0
    imagePullPolicy: IfNotPresent
    args:
      - --webhook-server
      - --provider=gandi
      # v0.21 validates --source before entering webhook-server mode; the
      # source is ignored after startup, but ingress is a valid value.
      - --source=ingress
      - --domain-filter=truxonline.com
      - --metrics-address=:7978
      - --log-level=info
    env:
      - name: GANDI_PAT
        valueFrom:
          secretKeyRef:
            name: external-dns-gandi-secret
            key: GANDI_API_KEY
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true
# Ownership
txtOwnerId: prod-gandi-public
# Scope
policy: sync
sources:
  - ingress
priorityClassName: vixens-high
podLabels:
  vixens.io/sizing.external-dns: G-small
podAnnotations:
  vixens.io/fast-start: "true"
  vixens.io/service-binding: "false"
  vixens.io/noingressneeded: "true"
  vixens.io/no-long-connections: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "7979"
  prometheus.io/path: "/metrics"

commonAnnotations:  # Deployment metadata annotations (Gold maturity: sync-wave + goldilocks)
  argocd.argoproj.io/sync-wave: "5"
  goldilocks.fairwinds.com/enabled: "true"
  vpa.kubernetes.io/updateMode: "Off"
revisionHistoryLimit: 3
resources:
  requests:
    cpu: "10m"
    memory: "64Mi"
  limits:
    cpu: "50m"
    memory: "128Mi"
