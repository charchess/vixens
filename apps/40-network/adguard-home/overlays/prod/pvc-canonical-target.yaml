---
# #4213: production replacement target only. The historical adguard-data claim
# remains the live source and is deliberately not renamed, rebound, or deleted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-data-canonical-target
  annotations:
    # Keep this WFFC PVC in the exact wave of its first consumer Job. An earlier
    # wave deadlocks Argo because a Pending WFFC claim is not Healthy yet.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-rwo-retain
  resources:
    requests:
      storage: 5Gi
