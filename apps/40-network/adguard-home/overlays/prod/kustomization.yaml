---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- adguard-litestream-credentials.yaml
- ../../base
- ingress.yaml
components:
- ../../../../_shared/components/sync-wave/wave-5
- ../../../../_shared/components/goldilocks/enabled
- ../../../../_shared/components/base
- ../../../../_shared/components/nometrics
- ../../../../_shared/components/poddisruptionbudget/0
- ../../../../_shared/components/revision-history-limit
- ../../../../_shared/components/dataangel
patches:
- path: patch-openbao-env.yaml
- patch: "- op: add\n  path: /spec/template/metadata/annotations/goldilocks.fairwinds.com~1enabled\n\
    \  value: \"true\"\n- op: add\n  path: /spec/template/metadata/annotations/autoscaling.k8s.io~1vpa\n\
    \  value: \"auto\"\n"
  target:
    kind: Deployment
    name: adguard-home
- path: resources-patch.yaml
- path: dataangel.yaml
