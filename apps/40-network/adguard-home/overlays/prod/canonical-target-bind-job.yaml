---
# #4213: binds and mounts only the replacement RWO volume once, then exits.
# It writes no application data. A completed Job is the gate for NAS-side copy
# once its VolumeAttachment has disappeared.
apiVersion: batch/v1
kind: Job
metadata:
  name: adguard-data-canonical-target-bind
  labels:
    app: adguard-home
    vixens.io/storage-migration: adguard-canonical-target
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: adguard-home
        vixens.io/storage-migration: adguard-canonical-target
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bind
          image: busybox:1.38.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -d /data
              test -w /data
              test -z "$(find /data -mindepth 1 -maxdepth 1 -print -quit)"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: target
              mountPath: /data
      volumes:
        - name: target
          persistentVolumeClaim:
            claimName: adguard-data-canonical-target
