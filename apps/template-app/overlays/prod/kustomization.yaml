---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ingress.yaml
patches:
- target:
    kind: ExternalSecret
    name: template-app-secrets-sync
  patch: "- op: replace\n  path: /spec/dataFrom/0/extract/key\n  value: vixens/prod/apps/template-app\n"
commonLabels:
  environment: prod
