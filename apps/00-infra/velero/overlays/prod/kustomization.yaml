---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Velero is Helm-managed (multi-source). Patches target Helm-rendered Deployments via ArgoCD SSA.
resources:
  - cilium-networkpolicy.yaml

patches:
  - patch: |-
      - op: add
        path: /spec/template/metadata/annotations/vixens.io~1no-long-connections
        value: "true"
    target:
      kind: Deployment
      name: velero
  # #4050: retain the Helm release and recovery records, but stop the server.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: velero

