---
# OpenBao is hosted on the TrueNAS storage interface. ESO is the sole
# cluster-wide secret reconciler; keep this egress narrowly pinned to the
# verified current endpoint and TCP/8200.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-secrets-openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      io.kubernetes.pod.namespace: external-secrets
  egress:
    - toCIDR:
        - 192.168.111.69/32
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
