---
# Kubernetes control-plane components run in the host network. Allow only
# their callback traffic to the External Secrets admission endpoint.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-secrets-webhook-control-plane
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
      io.kubernetes.pod.namespace: external-secrets
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
