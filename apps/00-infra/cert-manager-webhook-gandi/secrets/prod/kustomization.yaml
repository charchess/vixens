---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  # The webhook Application owns its CiliumNetworkPolicy. This source owns only
  # the ExternalSecret contract and must not claim the same resource.
  - gandi-external-secret.yaml
patches:
  - path: gandi-external-secret-patch.yaml
