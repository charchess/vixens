---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gandi-credentials-sync
  namespace: cert-manager
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-umi
    kind: ClusterSecretStore
  target:
    name: gandi-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          vixens.io/secret-source: openbao
  dataFrom:
  - extract:
      key: vixens/prod/apps/00-infra/cert-manager-webhook-gandi
