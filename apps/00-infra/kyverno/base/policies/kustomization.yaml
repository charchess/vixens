---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - add-cp-toleration.yaml
  - add-ttl-jobs.yaml
  - check-alerting.yaml
  - check-authentik-sso.yaml
  - check-backup.yaml
  - check-config-syncer-relevance.yaml
  - check-cp-toleration.yaml
  - check-explicit-resources.yaml
  - check-graceful-shutdown.yaml
  - check-homepage-annotations.yaml
  - check-image-digest.yaml
  - check-image-tag.yaml
  - check-infisical-secrets.yaml
  - check-ingress-tls.yaml
  - check-managed-by-label.yaml
  - check-metrics.yaml
  - check-networkpolicy.yaml
  - check-pdb.yaml
  - check-restore-init.yaml
  - check-security-context.yaml
  - check-service-binding.yaml
  - check-servicemonitor.yaml
  - check-sidecar-relevance.yaml
  - check-sizing-mode.yaml
  - check-stability.yaml
  - check-startup-probe.yaml
  - check-sync-wave.yaml
  - check-topology-spread.yaml
  - check-trivy-cve.yaml
  - check-velero-schedule.yaml
  - check-vpa-recommendations.yaml
  - check-vulnerability-scan.yaml
  - cleanup-policies.yaml
  - mutate-app-name-label.yaml
  # mutate-cainjector-probes.yaml removed — empty rules, already handled by policy-exception-cainjector.yaml
  - mutate-pod-annotations.yaml
  - mutate-priority-class.yaml
  - mutate-revision-history-limit.yaml
  - mutate-security-context.yaml
  - mutate-sidecar-probes.yaml
  - mutate-termination-message-policy.yaml
  - policy-exception-argocd.yaml
  - policy-exception-cainjector.yaml
  - policy-exception-csi-probes.yaml
  - policy-exception-mixed-sizing.yaml
  - policy-exception-nometrics.yaml
  - rbac-priorityclasses.yaml
  - rbac-secrets.yaml
  - rbac-servicemonitors.yaml
  - require-goldilocks.yaml
  - require-litestream-monitoring.yaml
  - require-namespace-pod-security.yaml
  - require-priority-class.yaml
  - require-probes.yaml
  - require-resource-limits.yaml
  - require-resource-requests.yaml
  - require-revision-history-limit.yaml
  - require-storage-strategy.yaml
  - sizing-audit.yaml
  - sizing-v2-mutate.yaml
  - sizing-vpa-generate.yaml
  - cilium-networkpolicy.yaml

# Pod specs are largely immutable after creation. Admission mutations that alter
# Pod spec must therefore run on CREATE only; otherwise metadata-only updates
# (for example removing a stuck finalizer) can be rejected when Kyverno tries
# to re-apply sizing, tolerations, priority, securityContext or probes.
patches:
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: sizing-v2-mutate
    patch: |-
      - op: add
        path: /spec/rules/0/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/1/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/2/match/any/0/resources/operations
        value: [CREATE]

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: add-cp-toleration
    patch: |-
      - op: add
        path: /spec/rules/0/match/any/0/resources/operations
        value: [CREATE]

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: mutate-priority-class
    patch: |-
      - op: add
        path: /spec/rules/0/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/1/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/2/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/3/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/6/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/8/match/any/0/resources/operations
        value: [CREATE]

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: mutate-security-context
    patch: |-
      - op: add
        path: /spec/rules/0/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/1/match/any/0/resources/operations
        value: [CREATE]

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: mutate-sidecar-probes
    patch: |-
      - op: add
        path: /spec/rules/0/match/any/0/resources/operations
        value: [CREATE]

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: mutate-termination-message-policy
    patch: |-
      - op: add
        path: /spec/rules/0/match/any/0/resources/operations
        value: [CREATE]
      - op: add
        path: /spec/rules/1/match/any/0/resources/operations
        value: [CREATE]
