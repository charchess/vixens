---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-external-secrets
  annotations:
    policies.kyverno.io/title: Require External Secrets for Secrets
    policies.kyverno.io/category: Maturity (Silver)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Audit if pods using envFrom secrets consume Kubernetes
      Secrets materialized by External Secrets Operator/OpenBao.
spec:
  validationFailureAction: Audit
  background: false
  rules:
  - name: check-secret-source
    match:
      any:
      - resources:
          kinds:
          - Pod
    preconditions:
      any:
      - key: '{{ request.object.spec.containers[].envFrom[] || `[]` | [?secretRef]
          | length(@) }}'
        operator: GreaterThan
        value: 0
    validate:
      message: Secrets should be managed via External Secrets Operator/OpenBao for
        maturity Level 2 (Silver). Ensure the target Secret carries vixens.io/secret-source=openbao
        or app.kubernetes.io/managed-by=external-secrets.
      foreach:
      - list: request.object.spec.containers[].envFrom[] || `[]` | [?secretRef]
        context:
        - name: secret_data
          apiCall:
            urlPath: /api/v1/namespaces/{{request.namespace}}/secrets/{{element.secretRef.name}}
            jmesPath: metadata.annotations."vixens.io/secret-source" == 'openbao'
              || metadata.labels."app.kubernetes.io/managed-by" == 'external-secrets'
              || metadata.annotations."reconcile.external-secrets.io/data-hash" ||
              'false'
        deny:
          conditions:
            all:
            - key: '{{ secret_data }}'
              operator: Equals
              value: 'false'
