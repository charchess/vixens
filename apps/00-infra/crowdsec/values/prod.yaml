---
lapi:
  # The production capacity policy hibernates CrowdSec.  Traefik has no
  # global CrowdSec dependency, so the LAPI can remain stopped safely.
  replicas: 0
  persistentVolume:
    config:
      # Existing production PVC is Bound to Synology.  StorageClass is immutable;
      # migrate via a parallel TrueNAS PVC instead of patching this claim in place.
      storageClassName: truenas-iscsi-retain
  env:
    - name: BOUNCER_KEY_traefik
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: CROWDSEC_BOUNCER_KEY
    - name: ENROLL_KEY
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: ENROLL_KEY
    - name: ENROLL_INSTANCE_NAME
      value: "vixens-k8s-prod"
    - name: ENROLL_TAGS
      value: "k8s linux homelab prod"
    - name: CROWDSEC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: CROWDSEC_DB_PASSWORD

agent:
  # Do not leave the chart's DaemonSet running while CrowdSec is hibernated.
  enabled: false
