---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://nas.truxonline.com:8200
      # KV v2 engine mount. Patch if the actual OpenBao mount differs.
      path: kv
      version: v2
      auth:
        tokenSecretRef:
          namespace: external-secrets
          name: openbao-token
          key: token
