---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    vixens.io/sizing: B-large
spec:
  template:
    metadata:
      labels:
        vixens.io/sizing: B-large
        vixens.io/sizing.homeassistant: B-large
        vixens.io/sizing.litestream: SB-medium
        vixens.io/sizing.config-syncer: B-small
      annotations:
        # Home Assistant must retain B-large burst capacity (1 CPU / 2Gi) during Core startup and backup recovery.
        # VPA recommendations remain available but must not in-place shrink this single-replica hostNetwork workload.
        vixens.io/vpa.update-mode: "Off"
        vixens.io/vpa.max-memory: "4096Mi"
