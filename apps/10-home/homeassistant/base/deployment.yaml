---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app: homeassistant
    vixens.io/sizing: B-large
    vixens.io/backup-profile: "standard"
  annotations:
    secret.reloader.stakater.com/reload: homeassistant-config
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        vixens.io/sizing: B-large
        # Python wheels (NumPy/SciPy/Shapely) exceed unlabeled-init defaults.
        # Kyverno assigns V-small: 256Mi request / 1Gi limit.
        vixens.io/sizing.install-python-deps: V-small
        vixens.io/backup-profile: "standard"
      annotations:
        reloader.stakater.com/auto: "true"
        vixens.io/fast-start: "true"
        dataangel.io/metrics-port: "9090"
        dataangel.io/restore-timeout: "90m"
        dataangel.io/snapshot-interval: "24h"
        vixens.io/explicitly-allow-root: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: vixens-high
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-python-deps
          image: python:3.14.5-alpine
          securityContext:
            capabilities:
              add: [CHOWN]
            runAsUser: 0
          command:
            - sh
            - -c
          args:
            - |
              # Persistent runtime requirements for explicitly installed HACS integrations.
              # roomba_plus 4.1.7 declares roombapy-prime[map]==0.3.4.
              PACKAGES="hass-web-proxy-lib==0.0.8 roombapy-prime[map]==0.3.4 aiofiles>=23.1.0 numpy>=1.26.4 scipy>=1.10.1 shapely>=2.0.2"
              TARGET="/config/python_packages/py314"
              mkdir -p "$TARGET"
              INSTALLED=true
              for pkg in $PACKAGES; do
                NAME=$(echo "$pkg" | cut -d= -f1 | tr '-' '_')
                VER=$(echo "$pkg" | cut -d= -f3)
                if ls "$TARGET/"*"${NAME}"*".dist-info" 2>/dev/null | grep -q "$VER"; then
                  echo "$pkg already installed, skipping."
                else
                  echo "$pkg not found or wrong version, installing..."
                  INSTALLED=false
                fi
              done
              if [ "$INSTALLED" = "false" ]; then
                pip install --no-cache-dir --target="$TARGET" $PACKAGES
                chown -R 1000:1000 "$TARGET"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: config-init
          image: busybox:1.37.0
          securityContext:
            # The restored PVC can retain root-owned generated directories.
            # This bootstrap normalizes their ownership before Core runs as 1000.
            runAsUser: 0
            capabilities:
              add: [CHOWN]
          command:
            - sh
            - -c
          args:
            - |
              if [ ! -s /config/configuration.yaml ]; then
                echo "No configuration found, copying default..."
                cp /tmp/ha-config/configuration.yaml /config/configuration.yaml
                chown 1000:1000 /config/configuration.yaml
              fi
              echo "Normalizing trusted proxy ranges for UMI/K3s/Traefik access..."
              awk '
                /^[[:space:]]*trusted_proxies:/ {
                  print;
                  print "    - 10.0.0.0/8";
                  print "    - 192.168.0.0/16";
                  print "    - 172.16.0.0/12";
                  in_tp=1;
                  next;
                }
                in_tp && /^[[:space:]]*-[[:space:]]/ { next; }
                in_tp && /^[[:space:]]*server_port:/ { in_tp=0; print; next; }
                { print; }
              ' /config/configuration.yaml > /config/configuration.yaml.tmp
              mv /config/configuration.yaml.tmp /config/configuration.yaml
              chown 1000:1000 /config/configuration.yaml
              ensure_file() {
                path="$1"
                content="$2"
                if [ ! -e "/config/$path" ]; then
                  printf "%s\n" "$content" > "/config/$path"
                  chown 1000:1000 "/config/$path"
                fi
              }
              ensure_file groups.yaml "{}"
              ensure_file automations.yaml "[]"
              ensure_file scripts.yaml "{}"
              ensure_file scenes.yaml "[]"
              ensure_file templates.yaml "[]"
              ensure_file switches.yaml "[]"
              ensure_file sensors.yaml "[]"
              ensure_file utility_meters.yaml "{}"
              ensure_file mediaplayer.yaml "[]"
              if [ ! -d /config/python_scripts ]; then
                mkdir -p /config/python_scripts
                chown 1000:1000 /config/python_scripts
              fi
              # HA backup restore runs as UID/GID 1000 and must replace this
              # disposable runtime dependency tree atomically.
              mkdir -p /config/python_packages
              chown 1000:1000 /config/python_packages
              chmod 2775 /config/python_packages
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ha-config
              mountPath: /tmp/ha-config
              readOnly: true
      containers:
        - name: homeassistant
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          image: ghcr.io/home-assistant/home-assistant:2026.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 5683
              name: coiot
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Paris
            - name: PYTHONPATH
              value: /config/python_packages/py314:/usr/local/lib/python3.14/site-packages
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: ha-config
          secret:
            secretName: homeassistant-config
