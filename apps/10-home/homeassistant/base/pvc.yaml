---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  annotations:
    # PVC must exist before the Deployment (sync wave 6); otherwise ArgoCD aborts before provisioning it.
    argocd.argoproj.io/sync-wave: "5"
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-retain
  resources:
    requests:
      storage: 10Gi
