---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-redis-secret-sync
  namespace: auth
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-umi
    kind: ClusterSecretStore
  target:
    name: authentik-redis-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          vixens.io/secret-source: openbao
  dataFrom:
  - extract:
      key: vixens/dev/apps/04-databases/redis-shared
