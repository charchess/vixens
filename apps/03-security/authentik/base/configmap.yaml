---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-config
  namespace: auth
data:
  vixens-netbird.yaml: |
    version: 1
    metadata:
      name: netbird-v2-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: netbird-provider-v2
        identifiers:
          name: netbird-v2
        attrs:
          client_id: netbird
          client_type: confidential
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://netbird.dev.truxonline.com
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.dev.truxonline.com/
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.dev.truxonline.com/#callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.dev.truxonline.com/silent-auth
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.truxonline.com
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.truxonline.com/
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.truxonline.com/#callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.truxonline.com/#callback/
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://netbird.truxonline.com/silent-auth
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: netbird-app
        identifiers:
          slug: netbird
        attrs:
          name: Netbird
          provider: !KeyOf netbird-provider-v2
  vixens-hydrus.yaml: |
    version: 1
    metadata:
      name: hydrus-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: hydrus-provider-dev
        identifiers:
          name: hydrus-dev
        attrs:
          mode: forward_auth
          external_host: https://hydrus.dev.truxonline.com
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authorization-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: hydrus-app-dev
        identifiers:
          slug: hydrus-dev
        attrs:
          name: Hydrus (Dev)
          provider: !KeyOf hydrus-provider-dev

      - model: authentik_providers_proxy.proxyprovider
        id: hydrus-provider-prod
        identifiers:
          name: hydrus-prod
        attrs:
          mode: forward_auth
          external_host: https://hydrus.truxonline.com
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authorization-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: hydrus-app-prod
        identifiers:
          slug: hydrus-prod
        attrs:
          name: Hydrus (Prod)
          provider: !KeyOf hydrus-provider-prod
  vixens-txo-fabric-hairem.yaml: |
    version: 1
    metadata:
      name: txo-fabric-hairem-oidc
    entries:
      - model: authentik_core.group
        id: txo-fabric-hairem-client0-group
        identifiers:
          name: txo-fabric-hairem-client0

      - model: authentik_providers_oauth2.oauth2provider
        id: txo-fabric-hairem-provider
        identifiers:
          name: txo-fabric-hairem
        attrs:
          client_id: txo-fabric-hairem
          client_type: public
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: regex
              url: '^https://[a-z0-9-]+-hairem(?:-sandbox)?\.truxonline\.com/auth/callback$'
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: txo-fabric-hairem-app
        identifiers:
          slug: txo-fabric-hairem
        attrs:
          name: TXO Fabric hAIrem
          provider: !KeyOf txo-fabric-hairem-provider

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf txo-fabric-hairem-app
          order: 0
        attrs:
          group: !KeyOf txo-fabric-hairem-client0-group

      - model: authentik_providers_proxy.proxyprovider
        id: txo-fabric-hairem-hindsight-provider
        identifiers:
          name: txo-fabric-hairem-hindsight
        attrs:
          mode: forward_auth
          external_host: https://hindsight-hairem.truxonline.com
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authorization-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: txo-fabric-hairem-hindsight-app
        identifiers:
          slug: txo-fabric-hairem-hindsight
        attrs:
          name: TXO Fabric hAIrem Hindsight
          provider: !KeyOf txo-fabric-hairem-hindsight-provider

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf txo-fabric-hairem-hindsight-app
          order: 0
        attrs:
          group: !KeyOf txo-fabric-hairem-client0-group

      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, hydrus-dev]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, hydrus-prod]]
            - !KeyOf txo-fabric-hairem-hindsight-provider
  vixens-txo-fabric-indiba.yaml: |
    version: 1
    metadata:
      name: txo-fabric-indiba-oidc
    entries:
      - model: authentik_core.group
        id: txo-fabric-indiba-sales-group
        identifiers:
          name: txo-fabric-indiba-sales

      - model: authentik_providers_oauth2.oauth2provider
        id: txo-fabric-indiba-provider
        identifiers:
          name: txo-fabric-indiba
        attrs:
          client_id: txo-fabric-indiba
          client_type: public
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: regex
              url: '^https://[a-z0-9-]+-indiba\.truxonline\.com/auth/callback$'
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: txo-fabric-indiba-app
        identifiers:
          slug: txo-fabric-indiba
        attrs:
          name: TXO Fabric Indiba
          provider: !KeyOf txo-fabric-indiba-provider

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf txo-fabric-indiba-app
          order: 0
        attrs:
          group: !KeyOf txo-fabric-indiba-sales-group
