---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
spec:
  template:
    metadata:
      labels:
        vixens.io/sizing.authentik-server: V-2xlarge
        vixens.io/sizing.config-syncer: V-nano
      annotations:
        # authentik-server V-2xlarge(4Gi) + config-syncer V-nano(256Mi) = 4352Mi
        vixens.io/vpa.max-memory: "4352Mi"
    spec:
      priorityClassName: vixens-critical
