---
apiVersion: v1
kind: Service
metadata:
  name: trivy-service
  namespace: security
  labels:
    app.kubernetes.io/name: trivy-server
    app.kubernetes.io/instance: trivy-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trivy-server
    app.kubernetes.io/instance: trivy-server
  ports:
    - name: trivy-http
      protocol: TCP
      port: 4954
      targetPort: 4954
  sessionAffinity: ClientIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trivy-server
  namespace: security
  labels:
    app.kubernetes.io/name: trivy-server
    app.kubernetes.io/instance: trivy-server
spec:
  serviceName: trivy-service
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
      app.kubernetes.io/instance: trivy-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-server
        app.kubernetes.io/instance: trivy-server
        # 512Mi request / 1Gi limit, 50m / 500m CPU. Security scanning is
        # deliberately burstable and lower priority than user-facing services.
        vixens.io/sizing.trivy-server: B-medium
    spec:
      priorityClassName: vixens-low
      serviceAccountName: trivy-trivy-operator
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trivy-server
          image: mirror.gcr.io/aquasec/trivy:0.74.0
          imagePullPolicy: IfNotPresent
          args:
            - server
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: trivy-operator-trivy-config
            - secretRef:
                name: trivy-operator-trivy-config
          ports:
            - name: trivy-http
              containerPort: 4954
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: trivy-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: trivy-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp-data
              mountPath: /tmp
            - name: data
              mountPath: /home/scanner/.cache
      volumes:
        - name: tmp-data
          emptyDir: {}
        - name: data
          # The vulnerability DB is a cache, not durable application data.
          # Keeping it ephemeral avoids a PVC dependency; it is rebuilt after
          # a server restart.
          emptyDir: {}
---
# Scan jobs need the internal Trivy service in addition to their existing
# registry/world and kube-apiserver egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-scan-jobs-to-server
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: trivy-operator
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# The operator health-checks the built-in server before scheduling scans.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-to-server
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-server
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/managed-by: trivy-operator
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: trivy-operator
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
  egress:
    # DB updates and optional vulnerability enrichment endpoints.
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
