---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-config
  namespace: security
data:
  # Keep the Kubernetes job alive longer than the scanner's own timeout.
  OPERATOR_SCAN_JOB_TIMEOUT: "20m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-trivy-config
  namespace: security
data:
  # Keep the scanner version aligned with Trivy Operator 0.34.0 and leave
  # enough time for large images to finish analysis.
  trivy.tag: "0.74.0"
  trivy.timeout: "15m0s"

  # Standalone scan jobs run one Trivy process per workload container. Those
  # processes share the same emptyDir cache, and Trivy's filesystem cache uses
  # a BoltDB lock, so multi-container workloads can fail with
  # "cache may be in use by another process". Keep the vulnerability DB shared
  # read-only, but make the per-process scan cache in-memory to avoid the lock.
  trivy.configFile: |
    cache:
      backend: memory
