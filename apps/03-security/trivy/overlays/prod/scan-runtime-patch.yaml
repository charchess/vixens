---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-config
  namespace: security
data:
  # Keep the Kubernetes job alive longer than the scanner's own timeout.
  OPERATOR_SCAN_JOB_TIMEOUT: "20m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-trivy-config
  namespace: security
data:
  # Trivy Operator 0.34.0 ships with Trivy 0.74.0. The base manifest still
  # pins 0.66.0, which can contend on the vulnerability DB for multi-container
  # scan jobs. Give large images enough time to finish analysis as well.
  trivy.tag: "0.74.0"
  trivy.timeout: "15m0s"
