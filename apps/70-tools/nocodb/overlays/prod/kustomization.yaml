---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools
resources:
- ../../base
components:
- ../../../../_shared/components/sync-wave/wave-9
- ../../../../_shared/components/goldilocks/enabled
- ../../../../_shared/components/nometrics
- ../../../../_shared/components/dataangel
- ../../../../_shared/components/scheduling/avoid-i915
patches:
- path: patch-openbao-env.yaml
- path: dataangel.yaml
- target:
    kind: Ingress
    name: nocodb
  patch: "- op: replace\n  path: /metadata/annotations/cert-manager.io~1cluster-issuer\n\
    \  value: letsencrypt-prod\n- op: replace\n  path: /spec/rules/0/host\n  value:\
    \ nocodb.truxonline.com\n- op: replace\n  path: /spec/tls/0/hosts/0\n  value:\
    \ nocodb.truxonline.com"
- target:
    kind: Deployment
    name: nocodb
  patch: "- op: add\n  path: /spec/template/spec/containers/0/env/-\n  value:\n  \
    \  name: NC_PUBLIC_URL\n    value: \"https://nocodb.truxonline.com\""
