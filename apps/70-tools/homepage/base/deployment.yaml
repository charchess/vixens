---
# deployment.yaml - Homepage workload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    secret.reloader.stakater.com/reload: homepage-config-secret,homepage-secrets
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
        vixens.io/sizing.copy-initial-config: G-nano
        vixens.io/sizing.homepage: V-small
        vixens.io/backup-profile: "relaxed"
      annotations:
        vixens.io/service-binding: "false"
        vixens.io/no-long-connections: "true"
        # homepage V-small(640Mi); copy-initial-config is init container (excluded from VPA)
        vixens.io/vpa.max-memory: "640Mi"
        kubectl.kubernetes.io/restartedAt: "2026-03-11T22:25:00Z"
    spec:
      serviceAccountName: homepage
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Copy the config projected by External Secrets from the read-only
      # Secret into a writable emptyDir before Homepage starts.
      initContainers:
        - name: copy-initial-config
          image: busybox:1.38
          # Clear the writable destination, copy the projected config and set
          # ownership. Runs as root to handle files created by previous images.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - sh
            - -c
            - rm -rf /config/* && cp -L /initial-config/* /config/ && chown -R 1000:1000 /config/
          volumeMounts:
            - name: initial-config-vol
              mountPath: /initial-config
            - name: config-vol
              mountPath: /config
      priorityClassName: vixens-low
      containers:
        - name: homepage
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 1Gi
          image: ghcr.io/gethomepage/homepage:v2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.dev.truxonline.com
            - name: HOMEASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: HOMEASSISTANT_API_KEY
            - name: HOMEPAGE_VAR_SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: HOMEPAGE_VAR_SONARR_API_KEY
            - name: HOMEPAGE_VAR_RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: HOMEPAGE_VAR_RADARR_API_KEY
            - name: HOMEPAGE_VAR_LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: HOMEPAGE_VAR_LIDARR_API_KEY
            - name: HOMEPAGE_VAR_WHISPARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: HOMEPAGE_VAR_WHISPARR_API_KEY
            - name: HOMEPAGE_VAR_SABNZBD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: HOMEPAGE_VAR_SABNZBD_API_KEY
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config-vol
              mountPath: /app/config
      volumes:
        # Configuration projected by External Secrets Operator from OpenBao.
        - name: initial-config-vol
          secret:
            secretName: homepage-config-secret
        # Writable runtime copy populated by copy-initial-config.
        - name: config-vol
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
