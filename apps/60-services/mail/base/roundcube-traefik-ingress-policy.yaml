---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: roundcube-traefik-ingress
  namespace: mail
  labels:
    environment: prod
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: roundcube
      app.kubernetes.io/part-of: truxonline-mail
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mail
            k8s:app.kubernetes.io/name: mailserver
            k8s:app.kubernetes.io/part-of: truxonline-mail
      toPorts:
        - ports:
            - {port: "993", protocol: TCP}
            - {port: "587", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
