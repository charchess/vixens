---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gmail-import
  namespace: mail
  labels:
    app.kubernetes.io/name: gmail-import
    app.kubernetes.io/component: importer
    app.kubernetes.io/part-of: truxonline-mail
spec:
  # Keep the replacement inert until the controlled one-shot batch is verified.
  suspend: true
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gmail-import
            app.kubernetes.io/component: importer
            app.kubernetes.io/part-of: truxonline-mail
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gmail-import
              image: gilleslamiral/imapsync@sha256:161336e1a6db587bc42ea1126cfc9b6afa67ea92b408ea4c4454f7f771561aa4
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  user2="$(< /var/run/imapsync-target/IMAPSYNC_DOVECOT_USER)"
                  exec /usr/bin/imapsync \
                    --host1 imap.gmail.com --port1 993 --ssl1 \
                    --user1 charchess@gmail.com \
                    --passfile1 /var/run/gmail/GMAIL_IMAP_PASSWORD \
                    --host2 mailserver.mail.svc.cluster.local --port2 993 --ssl2 \
                    --user2 "$user2" \
                    --passfile2 /var/run/imapsync-target/IMAPSYNC_DOVECOT_PASSWORD \
                    --folder INBOX \
                    --maxmessages 5 \
                    --syncinternaldates \
                    --delete1 \
                    --nofoldersizes
              volumeMounts:
                - name: gmail-credentials
                  mountPath: /var/run/gmail
                  readOnly: true
                - name: imapsync-target-credentials
                  mountPath: /var/run/imapsync-target
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: gmail-credentials
              secret:
                secretName: mail-gmail-import
                defaultMode: 0440
            - name: imapsync-target-credentials
              secret:
                secretName: mail-imapsync-runtime
                defaultMode: 0440
