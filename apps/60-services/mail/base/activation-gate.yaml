---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-activation-gate
  namespace: mail
  labels:
    app.kubernetes.io/name: mail-platform
    app.kubernetes.io/part-of: truxonline-mail
data:
  status: blocked
  reason: >-
    GitOps foundation only. Do not activate SMTP/IMAP Services, workloads, or a Maildir PVC,
    or DNS/UDM cutover until the fuu inventory and explicit activation approval.
  required_gates: >-
    fuu audit; source secret migration; image/config review; parallel Maildir sync;
    explicit public-network cutover approval.
