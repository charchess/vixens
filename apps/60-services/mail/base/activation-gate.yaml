---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-activation-gate
  namespace: mail
  labels:
    app.kubernetes.io/name: mail-platform
    app.kubernetes.io/part-of: truxonline-mail
data:
  status: private-lan-validation
  reason: >-
    Private LAN validation only: Roundcube may be reachable over temporary TLS NodePort 30443
    exclusively from 192.168.199.0/24. No DNS/MX/NAT/public cutover is authorized.
  required_gates: >-
    fuu audit; source secret migration; image/config review; parallel Maildir sync;
    explicit public-network cutover approval.
