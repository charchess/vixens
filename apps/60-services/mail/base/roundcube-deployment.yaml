---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  namespace: mail
  annotations:
    vixens.io/activation-gate: webmail-traefik-cutover-authorized
spec:
  # One webmail replica is authorized for private functional validation.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: roundcube}
  template:
    metadata:
      annotations:
        # Roll out the mounted SMTP session configuration explicitly.
        vixens.io/smtp-submission: "mailserver-starttls-587-runtime-peer-name"
      labels: {app.kubernetes.io/name: roundcube, app.kubernetes.io/part-of: truxonline-mail}
    spec:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-roundcube-session-state
          image: roundcube/roundcubemail@sha256:592b09d61171bf0bddb65cb2f7820cab58762793b309f6513f4cdec7ac23838f
          command: [sh, -ec]
          args: ["install -d -o 33 -g 33 -m 2775 /var/roundcube/db /tmp/roundcube-temp; rm -f /var/roundcube/db/sqlite.db /var/roundcube/db/sqlite.db-shm /var/roundcube/db/sqlite.db-wal; install -o 33 -g 33 -m 0660 /dev/null /var/roundcube/db/sqlite.db"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: roundcube-state, mountPath: /var/roundcube}
            - {name: roundcube-temp, mountPath: /tmp/roundcube-temp}
      containers:
        - name: roundcube
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile: {type: RuntimeDefault}
          image: roundcube/roundcubemail@sha256:592b09d61171bf0bddb65cb2f7820cab58762793b309f6513f4cdec7ac23838f
          ports: [{name: http, containerPort: 80}]
          envFrom: [{secretRef: {name: mail-roundcube-runtime}}]
          volumeMounts:
            - name: roundcube-config
              mountPath: /var/www/html/config/config.inc.php
              subPath: ROUNDCUBE_CONFIG_INC_PHP
              readOnly: true
            - name: roundcube-config
              mountPath: /var/www/html/config/config.custom.inc.php
              subPath: ROUNDCUBE_CUSTOM_INC_PHP
              readOnly: true
            - {name: roundcube-state, mountPath: /var/roundcube}
            - {name: roundcube-temp, mountPath: /tmp/roundcube-temp}
      volumes:
        - {name: roundcube-config, secret: {secretName: mail-roundcube-config}}
        - {name: roundcube-state, emptyDir: {}}
        - {name: roundcube-temp, emptyDir: {}}
