---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mailserver
  namespace: mail
  annotations:
    vixens.io/activation-gate: private-validation-no-public-cutover
spec:
  # Stage D private validation follows the successful non-destructive rsync.
  # fuu remains authoritative until the separate public cutover gate.
  # Private validation only: no public TCP route, DNS/MX, NAT, or source cutover.
  replicas: 1
  serviceName: mailserver
  selector:
    matchLabels: {app.kubernetes.io/name: mailserver}
  template:
    metadata:
      annotations:
        # Runtime LDAP endpoint parity with the working fuu DMS source.
        # Explicit DOVECOT_URIS prevents the DMS template default from winning.
        vixens.io/ldap-endpoint-set: "dc1-dc2-explicit"
        # All mail users are under this bounded AD OU. Avoid root-DSE
        # partition referrals that make the Dovecot LDAP client hang.
        vixens.io/ldap-search-base: "users-infra"
        # DMS v16 runs Amavis as UID/GID 998; force an explicit rollout after
        # the user-patches hook corrects its runtime directories accordingly.
        vixens.io/amavis-runtime-dirs: "user-patches-v2-uid998"
        # DMS v16 / Dovecot 2.4 consumes the normalized LDAP userdb mapping
        # from OpenBao; env-backed Secret updates require a pod rollout.
        vixens.io/dovecot-ldap-mapping: "dovecot-2.4-v1"
      labels: {app.kubernetes.io/name: mailserver, app.kubernetes.io/part-of: truxonline-mail}
    spec:
      securityContext: {fsGroup: 5000, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        - name: materialize-dms-config
          image: ghcr.io/docker-mailserver/docker-mailserver@sha256:d0fe7668defe157aad57ea31b1707ad1e2fb57d7a91bdf17cbdf876549946c86
          command: [sh, -ec]
          args:
            - |
              cp /source/config/POSTFIX_ACCOUNTS_CF /work/postfix-accounts.cf
              cp /source/config/POSTFIX_VIRTUAL_CF /work/postfix-virtual.cf
              postmap /work/postfix-virtual.cf
              cp /source/config/POSTFIX_MAIN_CF /work/postfix-main.cf
              cp /source/config/SENDER_ACCESS_PCRE /work/sender_access.pcre
              cp /source/config/USER_PATCHES_SH /work/user-patches.sh
              mkdir -p /work/opendkim/keys/truxonline.com
              cp /source/config/OPENDKIM_KEYTABLE /work/opendkim/KeyTable
              cp /source/config/OPENDKIM_SIGNINGTABLE /work/opendkim/SigningTable
              cp /source/config/OPENDKIM_TRUSTEDHOSTS /work/opendkim/TrustedHosts
              cp /source/dkim/RSPAMD_DKIM_PRIVATE_KEY /work/opendkim/keys/truxonline.com/dkim.private
              chmod 0600 /work/opendkim/keys/truxonline.com/dkim.private
          volumeMounts:
            - {name: dms-config-source, mountPath: /source/config, readOnly: true}
            - {name: dkim-source, mountPath: /source/dkim, readOnly: true}
            - {name: dms-config-work, mountPath: /work}
      containers:
        - name: mailserver
          image: ghcr.io/docker-mailserver/docker-mailserver@sha256:d0fe7668defe157aad57ea31b1707ad1e2fb57d7a91bdf17cbdf876549946c86
          # Least privilege set required by upstream DMS on Kubernetes. This is
          # workload-local: no privileged mode or host namespace/mount access.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "MKNOD", "SETGID", "SETUID", "NET_BIND_SERVICE", "SYS_CHROOT", "KILL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - {name: smtp, containerPort: 25}
            - {name: smtps, containerPort: 465}
            - {name: submission, containerPort: 587}
            - {name: imaps, containerPort: 993}
            - {name: managesieve, containerPort: 4190}
          envFrom:
            - {secretRef: {name: mail-auth}}
            - {secretRef: {name: mail-dms-runtime}}
          volumeMounts:
            - {name: mail-data, mountPath: /var/mail}
            - {name: mail-state, mountPath: /var/mail-state}
            - {name: dms-config-work, mountPath: /tmp/docker-mailserver}
            - {name: mail-tls, mountPath: /etc/letsencrypt/live/mail.truxonline.com, readOnly: true}
      volumes:
        - {name: dms-config-work, emptyDir: {}}
        - {name: dms-config-source, secret: {secretName: mail-dms-config}}
        - {name: dkim-source, secret: {secretName: mail-dkim}}
        - name: mail-tls
          secret:
            secretName: mail-tls-prod
            optional: true
            items:
              - {key: tls.crt, path: fullchain.pem}
              - {key: tls.key, path: privkey.pem}
  volumeClaimTemplates:
    - metadata: {name: mail-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: truenas-iscsi-xfs-retain
        resources: {requests: {storage: 25Gi}}
    - metadata: {name: mail-state}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: truenas-iscsi-xfs-retain
        resources: {requests: {storage: 2Gi}}
