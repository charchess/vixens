---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-dms-config-sync
  namespace: mail
spec:
  refreshInterval: 60s
  secretStoreRef: {name: openbao, kind: ClusterSecretStore}
  target:
    name: mail-dms-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels: {app.kubernetes.io/managed-by: external-secrets}
        annotations: {vixens.io/secret-source: openbao}
  dataFrom: [{extract: {key: vixens/prod/apps/60-services/mail/dms-config}}]
