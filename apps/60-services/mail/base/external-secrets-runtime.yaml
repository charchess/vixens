---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-imapsync-dovecot-auth-sync
  namespace: mail
spec:
  refreshInterval: 60s
  secretStoreRef: {name: openbao, kind: ClusterSecretStore}
  target:
    name: mail-imapsync-dovecot-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels: {app.kubernetes.io/managed-by: external-secrets}
        annotations: {vixens.io/secret-source: openbao}
  data:
    - secretKey: IMAPSYNC_DOVECOT_USER
      remoteRef: {key: vixens/prod/apps/60-services/mail/imapsync-auth, property: IMAPSYNC_DOVECOT_USER}
    - secretKey: IMAPSYNC_DOVECOT_PASSWORD_HASH
      remoteRef: {key: vixens/prod/apps/60-services/mail/imapsync-auth, property: IMAPSYNC_DOVECOT_PASSWORD_HASH}
