---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: services

resources:
  - ../../base
  - pvc-synelia-migration-target.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: hairem-hub
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hairem-hub
        namespace: services
      spec:
        template:
          spec:
            volumes:
              - name: hairem-files
                persistentVolumeClaim:
                  claimName: hairem-files-synelia

commonLabels:
  environment: dev
