---
apiVersion: v1
kind: Service
metadata:
  name: hairem-hub
  namespace: services

spec:
  selector:
    app: hairem-hub

  ports:
    - name: wiki
      protocol: TCP
      port: 4567
      targetPort: 4567

    - name: gtdwiki
      protocol: TCP
      port: 4568
      targetPort: 4568

    - name: dashboard
      protocol: TCP
      port: 8080
      targetPort: 3000
