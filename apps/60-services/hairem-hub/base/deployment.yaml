---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hairem-hub
  namespace: services
  labels:
    app: hairem-hub

spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: hairem-hub

  template:
    metadata:
      labels:
        app: hairem-hub

    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      initContainers:

        # Initialise l'arborescence hAIrem et le dépôt Git du LLMWiki.
        - name: initialize-hairem-files
          image: gollumwiki/gollum:sha-01a3610

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          command:
            - /bin/sh
            - -ec

          args:
            - |
              mkdir -p \
                /data/persona/lisa \
                /data/shared \
                /data/public/llmwiki \
                /data/public/GTD \
                /data/private \
                /data/dashboard

              # LAB UMI :
              # permissions volontairement permissives.
              # En prod, NFS/ACL remplacera cette politique.
              chmod 0777 \
                /data \
                /data/persona \
                /data/persona/lisa \
                /data/shared \
                /data/public \
                /data/public/llmwiki \
                /data/public/GTD \
                /data/private \
                /data/dashboard

              # Workspace root exposed by Gollum on :4568.
              if [ ! -d /data/.git ]; then
                echo "Initialisation du dépôt workspace root..."
                cd /data
                git init -b main
                git config user.name "hAIrem Workspace"
                git config user.email "workspace@hairem.local"
                if [ ! -f Home.md ]; then
                  cat > Home.md <<WORKSPACE
              # hAIrem Workspace

              Racine partagée hAIrem.

              ## Zones

              - [[public]] — systèmes publiés/lisibles avec propriétaire clair.
              - [[shared]] — collaboration libre et brouillons partagés.
              - [[private]] — espaces privés par convention relationnelle.

              Lire [[PERMS]] avant toute écriture.
              WORKSPACE
                fi
                git add Home.md PERMS.md 2>/dev/null || git add Home.md
                git commit -m "Initialize hAIrem workspace root"
              fi

              chmod -R a+rwX /data/.git /data/Home.md 2>/dev/null || true

              # -------------------------------------------------------
              # LLMWiki / Gollum
              # -------------------------------------------------------
              if [ ! -d /data/public/llmwiki/.git ]; then
                echo "Initialisation du dépôt LLMWiki..."

                cd /data/public/llmwiki

                git init -b main
                git config user.name "hAIrem LLMWiki"
                git config user.email "llmwiki@hairem.local"

                cat > Home.md <<'WIKI'
              # hAIrem LLMWiki

              Base documentaire explicite du système hAIrem.

              ## Principes

              - Le LLMWiki contient des faits et de la documentation.
              - Il ne constitue pas une mémoire cognitive commune.
              - Les agentes le consultent explicitement lorsque nécessaire.
              - Les informations importantes doivent conserver leur provenance.

              ## Laboratoire

              Cette instance tourne actuellement sur le cluster UMI de développement.
              WIKI

                git add Home.md
                git commit -m "Initialize hAIrem LLMWiki"
              fi

              # Gollum tourne en UID 1000.
              chown -R 1000:1000 /data/public/llmwiki
              chmod -R a+rwX /data/public/llmwiki

              # -------------------------------------------------------
              # Workspace root / Gollum :4568
              # -------------------------------------------------------
              chmod -R a+rwX /data

              # -------------------------------------------------------
              # Dashboard hAIrem statique initial
              # -------------------------------------------------------
              if [ ! -f /data/dashboard/index.html ]; then
                cat > /data/dashboard/index.html <<'HTML'
              <!doctype html>
              <html lang="fr">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>hAIrem</title>
                <style>
                  body {
                    font-family: system-ui, sans-serif;
                    max-width: 900px;
                    margin: 4rem auto;
                    padding: 0 1.5rem;
                    line-height: 1.6;
                  }
                  code {
                    background: #eee;
                    padding: .15rem .35rem;
                    border-radius: .3rem;
                  }
                  .ok {
                    font-size: 1.2rem;
                  }
                </style>
              </head>
              <body>
                <h1>hAIrem</h1>

                <p class="ok">🦊 Infrastructure de laboratoire opérationnelle.</p>

                <h2>Services</h2>
                <ul>
                  <li>Hermes</li>
                  <li>Lisa — agente laboratoire</li>
                  <li>LLMWiki / Gollum — port 4567</li>
                  <li>GTDWiki / Gollum — port 4568</li>
                </ul>

                <p>
                  Ce fichier vit dans
                  <code>hairem-files/dashboard/index.html</code>.
                </p>
              </body>
              </html>
              HTML
              fi

              chmod -R a+rwX /data/dashboard

              echo
              echo "Arborescence hAIrem :"
              find /data -maxdepth 2 -mindepth 1 -type d | sort

          volumeMounts:
            - name: hairem-files
              mountPath: /data

      containers:

        # -------------------------------------------------------------
        # LLMWiki
        # -------------------------------------------------------------
        - name: gollum
          image: gollumwiki/gollum:sha-01a3610

          workingDir: /wiki

          ports:
            - name: wiki
              containerPort: 4567

          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: 4567
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: hairem-files
              mountPath: /wiki
              subPath: public/llmwiki

        # -------------------------------------------------------------
        # Workspace File Browser
        # -------------------------------------------------------------
        - name: filebrowser-workspace
          image: filebrowser/filebrowser:v2

          args:
            - --address
            - 0.0.0.0
            - --port
            - "4568"
            - --root
            - /srv
            - --database
            - /database/filebrowser.db
            - --noauth

          ports:
            - name: gtdwiki
              containerPort: 4568

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 4568
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: hairem-files
              mountPath: /srv
            - name: filebrowser-database
              mountPath: /database

        # -------------------------------------------------------------
        # Dashboard hAIrem SvelteKit
        # -------------------------------------------------------------
        - name: dashboard
          image: hairem-dashboard:dev
          imagePullPolicy: Never

          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: GTDWIKI_PATH
              value: /data/public/GTD
            - name: LLMWIKI_PATH
              value: /data/public/llmwiki

          ports:
            - name: dashboard
              containerPort: 3000

          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: hairem-files
              mountPath: /data
              readOnly: false

      volumes:
        - name: hairem-files
          persistentVolumeClaim:
            claimName: hairem-files-truenas
        - name: filebrowser-database
          emptyDir: {}
