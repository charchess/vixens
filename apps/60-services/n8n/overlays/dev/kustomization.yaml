---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
resources:
- ../../base
- ingress.yaml
components:
- ../../../../_shared/components/revision-history-limit
patches:
- target:
    kind: Deployment
    name: n8n
  patch: "- op: replace\n  path: /spec/replicas\n  value: 0\n"
