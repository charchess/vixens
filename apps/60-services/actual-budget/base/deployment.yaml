apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: actual-budget}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-budget
        vixens.io/sizing.actual-budget: V-small
        vixens.io/backup-profile: standard
    spec:
      priorityClassName: vixens-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: actual-budget
          image: actualbudget/actual-server:sha-5e39105
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5006}]
          env:
            - {name: ACTUAL_DATA_DIR, value: /data}
            - {name: ACTUAL_PORT, value: "5006"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          startupProbe: {httpGet: {path: /, port: http}, failureThreshold: 30, periodSeconds: 5}
      volumes: [{name: data, persistentVolumeClaim: {claimName: actual-budget-data}}]
