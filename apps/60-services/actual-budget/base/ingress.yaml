apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-budget
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Finance
    gethomepage.dev/name: Actual Budget
    gethomepage.dev/icon: actual-budget.svg
spec:
  ingressClassName: traefik
  rules:
    - host: actual.truxonline.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: actual-budget, port: {name: http}}}}]}
  tls: [{hosts: [actual.truxonline.com], secretName: actual-budget-tls}]
