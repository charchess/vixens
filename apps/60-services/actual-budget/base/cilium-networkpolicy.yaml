apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: actual-budget}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: actual-budget}}
  ingress:
    - fromEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: traefik}}]
      toPorts: [{ports: [{port: "5006", protocol: TCP}]}]
    - fromEntities: [remote-node]
      toPorts: [{ports: [{port: "5006", protocol: TCP}]}]
  egress:
    - toEntities: [kube-apiserver]
