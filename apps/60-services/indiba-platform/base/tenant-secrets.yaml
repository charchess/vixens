---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indiba-runtime-capability
  namespace: tenant-indiba
spec:
  data:
    - secretKey: gateway-token
      remoteRef:
        key: vixens/dev/apps/60-services/indiba/runtime
        property: gateway_token
  target:
    template:
      metadata:
        annotations:
          vixens.io/secret-source: openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-indiba-runtime
  namespace: tenant-indiba
spec:
  data:
    - secretKey: postgres-password
      remoteRef:
        key: vixens/dev/apps/60-services/indiba/postgresql/hindsight
        property: password
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef:
        key: vixens/dev/apps/60-services/indiba/runtime
        property: gateway_token
  target:
    template:
      metadata:
        annotations:
          vixens.io/secret-source: openbao
