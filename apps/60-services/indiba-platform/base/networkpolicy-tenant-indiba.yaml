---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-indiba
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tenant-indiba
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hindsight-api-ingress
  namespace: tenant-indiba
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      indiba.io/tenant-ref: TEN00001
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              indiba.io/component: hermes-runtime
      ports:
        - port: 8888
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-runtime-egress
  namespace: tenant-indiba
spec:
  podSelector:
    matchLabels:
      indiba.io/component: hermes-runtime
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hindsight
              indiba.io/tenant-ref: TEN00001
      ports:
        - port: 8888
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: indiba-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: llm-gateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hindsight-llm-egress
  namespace: tenant-indiba
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      indiba.io/tenant-ref: TEN00001
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: indiba-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: llm-gateway
      ports:
        - port: 8080
          protocol: TCP
