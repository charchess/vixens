---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: indiba-system
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: indiba-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/part-of: indiba-platform
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: ghcr.io/charchess/indiba-platform:mvp
          imagePullPolicy: Always
          env:
            - name: INDIBA_ROLE
              value: control-plane
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: indiba-control-plane-db
                  key: DATABASE_URL
            - name: OPENFGA_URL
              value: http://openfga.indiba-system.svc.cluster.local:8080
            - name: TENANT_REF
              value: TEN00001
            - name: TENANT_ID
              value: 018f0000-0000-7000-8000-000000000001
            - name: POC_ALLOW_ANY_AUTHENTICATED
              value: "true"
            - name: POC_AGENT_ALIAS
              value: Nadia Sud-Ouest
            - name: POC_AGENT_REF
              value: TEN00001-USR00001-TPL00001-INS001
            - name: POC_RUNTIME_NAME
              value: indiba-bertrand-nadia-sud-ouest
            - name: POC_BANK_REF
              value: MB-TEN00001-USR00001-TPL00001-INS001
            - name: POC_BANK_ID
              value: MB-TEN00001-USR00001-TPL00001-INS001
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-operator
  namespace: indiba-system
  labels:
    app.kubernetes.io/name: hermes-operator
    app.kubernetes.io/part-of: indiba-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-operator
        app.kubernetes.io/part-of: indiba-platform
    spec:
      serviceAccountName: hermes-operator
      containers:
        - name: operator
          image: ghcr.io/charchess/indiba-platform:mvp
          imagePullPolicy: Always
          env:
            - name: INDIBA_ROLE
              value: operator
            - name: PORT
              value: "8082"
            - name: TENANT_REF
              value: TEN00001
            - name: TENANT_ID
              value: 018f0000-0000-7000-8000-000000000001
            - name: HERMES_IMAGE
              value: nousresearch/hermes-agent:v2026.9.7
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: indiba-runtime-capability
                  key: gateway-token
          ports:
            - name: health
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext: *restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: indiba-system
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: indiba-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: indiba-platform
    spec:
      serviceAccountName: llm-gateway
      containers:
        - name: llm-gateway
          image: ghcr.io/charchess/indiba-platform:mvp
          imagePullPolicy: Always
          env:
            - name: INDIBA_ROLE
              value: llm-gateway
            - name: PORT
              value: "8080"
            - name: OPENROUTER_BASE_URL
              value: https://openrouter.ai/api/v1
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: indiba-runtime-capability
                  key: openrouter-api-key
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: indiba-runtime-capability
                  key: gateway-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext: *restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-gateway
  namespace: tenant-indiba
  labels:
    app.kubernetes.io/name: memory-gateway
    app.kubernetes.io/part-of: indiba-platform
    indiba.io/tenant-ref: TEN00001
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-gateway
        app.kubernetes.io/part-of: indiba-platform
        indiba.io/tenant-ref: TEN00001
    spec:
      automountServiceAccountToken: false
      containers:
        - name: memory-gateway
          image: ghcr.io/charchess/indiba-platform:mvp
          imagePullPolicy: Always
          env:
            - name: INDIBA_ROLE
              value: memory-gateway
            - name: PORT
              value: "8877"
            - name: CONTROL_PLANE_URL
              value: http://control-plane.indiba-system.svc.cluster.local:8081
            - name: HINDSIGHT_URL
              value: http://hs-indiba.tenant-indiba.svc.cluster.local:8888
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: indiba-runtime-capability
                  key: gateway-token
          ports:
            - name: http
              containerPort: 8877
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext: *restricted
---
apiVersion: v1
kind: Service
metadata:
  name: memory-gateway
  namespace: tenant-indiba
  labels:
    app.kubernetes.io/name: memory-gateway
    app.kubernetes.io/part-of: indiba-platform
spec:
  selector:
    app.kubernetes.io/name: memory-gateway
  ports:
    - name: http
      port: 8877
      targetPort: http
