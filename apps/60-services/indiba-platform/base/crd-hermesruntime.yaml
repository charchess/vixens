---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hermesruntimes.agents.indiba.io
  labels:
    app.kubernetes.io/part-of: indiba-platform
spec:
  group: agents.indiba.io
  scope: Namespaced
  names:
    plural: hermesruntimes
    singular: hermesruntime
    kind: HermesRuntime
    shortNames:
      - hrt
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Agent
          type: string
          jsonPath: .spec.agentRef
        - name: Revision
          type: string
          jsonPath: .spec.configurationRevision
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - tenantId
                - tenantRef
                - principalId
                - principalRef
                - agentIdentityId
                - agentRef
                - personaRef
                - hermesReleaseRef
                - llmProfileRef
                - memory
                - homeRef
                - configurationRevision
              properties:
                tenantId:
                  type: string
                  format: uuid
                tenantRef:
                  type: string
                  pattern: '^TEN[0-9]{5,}$'
                tenantSlug:
                  type: string
                  maxLength: 63
                principalId:
                  type: string
                  format: uuid
                principalRef:
                  type: string
                  pattern: '^USR[0-9]{5,}$'
                agentIdentityId:
                  type: string
                  format: uuid
                agentRef:
                  type: string
                  minLength: 8
                  maxLength: 160
                agentAlias:
                  type: string
                  maxLength: 253
                personaRef:
                  type: string
                  minLength: 3
                  maxLength: 128
                hermesReleaseRef:
                  type: string
                  minLength: 3
                  maxLength: 128
                llmProfileRef:
                  type: string
                  minLength: 3
                  maxLength: 128
                skills:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                capabilities:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required:
                      - ref
                    properties:
                      ref:
                        type: string
                        minLength: 1
                        maxLength: 128
                      executionEnvironmentRef:
                        type: string
                        maxLength: 128
                repositories:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required:
                      - ref
                      - access
                      - accessMode
                    properties:
                      ref:
                        type: string
                        minLength: 1
                        maxLength: 128
                      access:
                        type: string
                        enum:
                          - readOnly
                          - readWrite
                      accessMode:
                        type: string
                        enum:
                          - filesystem
                          - api
                          - object
                          - indexed
                memory:
                  type: object
                  required:
                    - serviceRef
                    - bankRef
                  properties:
                    serviceRef:
                      type: string
                      minLength: 1
                      maxLength: 128
                    bankRef:
                      type: string
                      minLength: 1
                      maxLength: 160
                    profileRef:
                      type: string
                      maxLength: 128
                homeRef:
                  type: string
                  minLength: 1
                  maxLength: 160
                configurationRevision:
                  type: string
                  pattern: '^sha256:[a-f0-9]{64}$'
                lifecycle:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - onDemand
                        - alwaysOn
                    idleTimeout:
                      type: string
                      pattern: '^[0-9]+(s|m|h)$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                phase:
                  type: string
                  enum:
                    - Pending
                    - Starting
                    - Ready
                    - Idle
                    - Failed
                    - Terminating
                runtimeId:
                  type: string
                  maxLength: 128
                endpoint:
                  type: string
                  maxLength: 512
                startedAt:
                  type: string
                  format: date-time
                lastActivityAt:
                  type: string
                  format: date-time
                configurationRevision:
                  type: string
                  pattern: '^sha256:[a-f0-9]{64}$'
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
