---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services

resources:
  - ../../base
  # #4185: this PVC already exists, is Bound to the named Retain PV and
  # contains the accepted recovery copy. Do not provision a fresh empty PV.
  - pvc-synelia-recovery.yaml

# UMI ONLY. Base Deployment and legacy Retain PVC remain unchanged.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: hermes
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes
        namespace: services
      spec:
        template:
          spec:
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: hermes-data-synelia-recovery

commonLabels:
  environment: dev
