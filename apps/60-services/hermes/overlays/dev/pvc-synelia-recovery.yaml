---
# Incident #4185: adopt only the ALREADY CREATED / physically recovered
# Synelia PV. volumeName deliberately pins the actual PV identity so this
# cannot accidentally dynamically provision an empty fallback 80Gi volume.
# Do not remove this PVC while Hermes consumes it. Legacy PVC remains retained.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data-synelia-recovery
  namespace: services
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synelia-iscsi-stateful-retain
  volumeName: pvc-66d68670-a146-4ae3-87f6-421860f4554e
  resources:
    requests:
      storage: 80Gi
