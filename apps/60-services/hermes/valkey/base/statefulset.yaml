---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-hermes
  namespace: services
  labels:
    app.kubernetes.io/name: valkey-hermes
    app.kubernetes.io/component: cache
spec:
  serviceName: valkey-hermes
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-hermes
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3-alpine
          imagePullPolicy: IfNotPresent
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          env:
            - name: VALKEY_HEALTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-hermes-auth
                  key: health_password
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  valkey-cli --user health --pass "$VALKEY_HEALTH_PASSWORD"
                  --no-auth-warning ping | grep -qx PONG
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  valkey-cli --user health --pass "$VALKEY_HEALTH_PASSWORD"
                  --no-auth-warning ping | grep -qx PONG
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  valkey-cli --user health --pass "$VALKEY_HEALTH_PASSWORD"
                  --no-auth-warning ping | grep -qx PONG
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: auth
              mountPath: /etc/valkey-auth
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: valkey-hermes-config
        - name: auth
          secret:
            secretName: valkey-hermes-auth
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-iscsi-retain
        resources:
          requests:
            storage: 5Gi
