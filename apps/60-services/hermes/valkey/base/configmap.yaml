---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-hermes-config
  labels:
    app.kubernetes.io/name: valkey-hermes
    app.kubernetes.io/component: cache
immutable: true
data:
  valkey.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    dir /data
    appendonly yes
    appendfsync everysec
    save ""
    aclfile /etc/valkey-auth/users.acl
    logfile ""
