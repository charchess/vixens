---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-hermes
  namespace: services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-hermes
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: services
          podSelector:
            matchLabels:
              app: hermes
      ports:
        - protocol: TCP
          port: 6379
  egress: []
