---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-hermes-auth
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-umi
    kind: ClusterSecretStore
  target:
    name: valkey-hermes-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: users.acl
      remoteRef:
        key: shared/electra/valkey
        property: users.acl
    - secretKey: health_password
      remoteRef:
        key: shared/electra/valkey
        property: health_password
