---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data-truenas
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-retain
  resources:
    requests:
      # Persona profiles, durable memories, and staged migrations share this RWO volume.
      # Keep headroom for copy-first migrations; legacy session databases stay outside it.
      storage: 40Gi
