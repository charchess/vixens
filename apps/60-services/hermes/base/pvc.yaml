---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data-synelia-recovery
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synelia-iscsi-stateful-retain
  resources:
    requests:
      # Existing stateful Hermes private data: 13 profile directories were
      # observed after recovery, not exhaustively byte-verified. Keep the
      # retained 80Gi RWO claim identity until a separate data-safe transition.
      storage: 80Gi
