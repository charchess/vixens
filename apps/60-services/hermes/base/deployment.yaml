---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: services
  labels:
    app: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        vixens.io/sizing.hermes: V-large
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.27
          imagePullPolicy: IfNotPresent

          # Phase bootstrap :
          # on garde le conteneur vivant, puis on lance `hermes setup`
          # manuellement. On remplacera ensuite par gateway/run.
          args:
            - sleep
            - infinity

          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: TERMINAL_ENV
              value: local

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi

          volumeMounts:
            - name: data
              mountPath: /opt/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
