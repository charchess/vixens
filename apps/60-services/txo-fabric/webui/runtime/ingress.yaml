---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: txo-fabric-webui-bff
  namespace: txo-fabric-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/public: "true"
    external-dns.alpha.kubernetes.io/target: truxonline.com
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fabric.truxonline.com
      secretName: txo-fabric-webui-bff-tls
  rules:
    - host: fabric.truxonline.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: txo-fabric-webui-bff
                port:
                  number: 3000