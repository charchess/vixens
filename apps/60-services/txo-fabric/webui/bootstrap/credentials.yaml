---
# STAGED ONLY: this file is NOT part of overlays/prod. The keys below are
# references to a future platform-only OpenBao record; neither remote record
# nor K8s Secret is created in this increment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-fabric-webui-migrator-postgresql
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-fabric-webui-migrator-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/webui-bff
        property: migration_username
    - secretKey: password
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/webui-bff
        property: migration_password
---
