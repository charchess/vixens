---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: txo-fabric-webui-schema-migration-egress
  namespace: txo-fabric-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: txo-fabric-webui-bff
      app.kubernetes.io/component: bff-migration
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql-shared
      ports:
        - {protocol: TCP, port: 5432}
