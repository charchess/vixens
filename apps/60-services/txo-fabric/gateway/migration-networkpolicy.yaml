---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: txo-ai-gateway-migration-egress
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: txo-ai-gateway-migration
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: ai-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: txo-ai-gateway-migration
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql-shared
      ports:
        - {protocol: TCP, port: 5432}
