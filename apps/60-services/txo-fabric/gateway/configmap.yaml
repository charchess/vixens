---
apiVersion: v1
kind: ConfigMap
metadata:
  name: txo-ai-gateway-config
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: txo-ai-gateway
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: ai-egress
data:
  config.yaml: |
    model_list:
      - model_name: txo-default
        litellm_params:
          model: openrouter/openai/gpt-5.6-luna
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: txo-embedding
        litellm_params:
          model: openrouter/openai/text-embedding-3-small
          api_key: os.environ/OPENROUTER_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
