---
apiVersion: v1
kind: Service
metadata:
  name: txo-ai-gateway
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: txo-ai-gateway
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: ai-egress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: txo-ai-gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
