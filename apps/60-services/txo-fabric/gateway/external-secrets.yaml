---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-ai-gateway-postgresql
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-ai-gateway-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: txo-fabric
        annotations:
          vixens.io/secret-source: openbao
  data:
    - secretKey: username
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: postgres_username
    - secretKey: password
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-ai-gateway-runtime
  namespace: txo-fabric-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-ai-gateway-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: txo-fabric
        annotations:
          vixens.io/secret-source: openbao
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: postgres_username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: postgres_password
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: litellm_master_key
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: litellm_salt_key
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: openrouter_api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-ai-gateway-admin
  namespace: txo-fabric-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-ai-gateway-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: txo-fabric
          app.kubernetes.io/component: operator
        annotations:
          vixens.io/secret-source: openbao
  data:
    - secretKey: admin-token
      remoteRef:
        key: vixens/prod/apps/60-services/txo-ai-gateway
        property: litellm_master_key
