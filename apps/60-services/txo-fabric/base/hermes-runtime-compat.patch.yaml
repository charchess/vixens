---
- op: add
  path: /spec/rules/1/generate/data/spec/template/metadata/annotations
  value:
    vixens.io/explicitly-allow-root: "true"
- op: replace
  path: /spec/rules/1/generate/data/spec/template/spec/initContainers/0/command/2
  value: >-
    if [ ! -d "/opt/data/profiles/${AGENT_NAME}" ]; then /opt/hermes/.venv/bin/hermes profile create "${AGENT_NAME}" --no-alias --no-skills --description "${AGENT_DISPLAY_NAME} - disposable TXO Fabric test agent"; fi
