---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantbundles.fabric.truxonline.io
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: management-plane
spec:
  group: fabric.truxonline.io
  scope: Cluster
  names:
    plural: tenantbundles
    singular: tenantbundle
    kind: TenantBundle
    shortNames:
      - tbundle
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef
        - name: Slug
          type: string
          jsonPath: .spec.slug
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - tenantRef
                - slug
                - displayName
              properties:
                tenantRef:
                  type: string
                  pattern: '^TEN[0-9]{5,}$'
                slug:
                  type: string
                  minLength: 2
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 253
                isolation:
                  type: object
                  properties:
                    profile:
                      type: string
                      enum:
                        - shared
                        - dedicated
                      default: shared
                persistence:
                  type: object
                  properties:
                    postgresql:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - shared
                            - dedicated
                          default: shared
                        profileRef:
                          type: string
                          maxLength: 128
                modules:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                      enabled:
                        type: boolean
                        default: true
                      profileRef:
                        type: string
                        maxLength: 128
                      configRef:
                        type: string
                        maxLength: 253
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Ready
                    - Degraded
                    - Failed
                    - Deleting
                namespace:
                  type: string
                  maxLength: 63
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
