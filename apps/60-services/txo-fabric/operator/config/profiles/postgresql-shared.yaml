---
apiVersion: fabric.truxonline.io/v1alpha1
kind: PostgreSQLProfile
metadata:
  name: postgresql-shared
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: persistence-profile
spec:
  provider: CloudNativePG
  topology: SharedCluster
  requiredExtensions:
    - vector
  shared:
    # Production canonical services resolve to the restored CNPG cluster;
    # keep the profile aligned with the recovery cluster without changing the
    # stable postgresql-shared-rw service contract used by consumers.
    clusterRef:
      name: postgresql-shared-recovery
      namespace: databases
    databaseNamePrefix: txo_
    roleNamePrefix: txo_
  databaseReclaimPolicy: Retain
  roleReclaimPolicy: Retain
