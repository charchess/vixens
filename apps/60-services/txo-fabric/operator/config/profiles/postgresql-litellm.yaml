---
apiVersion: fabric.truxonline.io/v1alpha1
kind: PostgreSQLProfile
metadata:
  name: postgresql-litellm
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: persistence-profile
    fabric.truxonline.io/purpose: ai-gateway
spec:
  provider: CloudNativePG
  topology: SharedCluster
  shared:
    clusterRef:
      # The canonical service name remains postgresql-shared-rw, but its
      # backing CNPG cluster is the recovered production primary.
      name: postgresql-shared-recovery
      namespace: databases
    databaseNamePrefix: txo_
    roleNamePrefix: txo_
  # Gateway virtual keys, metering and budget state are durable platform state.
  # Removing an opt-in capability must not silently destroy that ledger.
  databaseReclaimPolicy: Retain
  roleReclaimPolicy: Retain
