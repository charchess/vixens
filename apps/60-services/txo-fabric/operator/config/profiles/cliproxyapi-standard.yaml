---
apiVersion: fabric.truxonline.io/v1alpha1
kind: AICredentialBrokerProfile
metadata:
  name: cliproxyapi-standard
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: ai-credential-broker-profile
spec:
  topology: TenantScoped
  implementation: CLIProxyAPI
  image: eceasy/cli-proxy-api:v8.0.16
  apiPort: 8317
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  priorityClassName: vixens-medium
  sizingLabel: V-small
  authStorage:
    size: 1Gi
    storageClassName: truenas-iscsi-delete
  usageQueueRetentionSeconds: 900
