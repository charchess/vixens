---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: txo-fabric-operator-egress
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: txo-fabric-operator
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: txo-ai-gateway
      ports:
        - {protocol: TCP, port: 4000}
# kube-apiserver egress is provided cluster-wide by Vixens Cilium policy
# ccnp-allow-kube-apiserver; do not open generic Internet egress here.
