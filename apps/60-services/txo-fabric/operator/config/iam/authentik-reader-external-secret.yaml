---
# Platform-only Authentik service API reader. Bootstrap in OpenBao before
# promotion; this manifest intentionally contains no token or human data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-fabric-authentik-iam-reader
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: txo-fabric-operator
    app.kubernetes.io/component: tenant-iam-reader
    app.kubernetes.io/part-of: txo-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-authentik-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: txo-fabric
  data:
    - secretKey: token
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/authentik-iam-reader
        property: token
