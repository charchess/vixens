---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruntimeprofiles.fabric.truxonline.io
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: api
spec:
  group: fabric.truxonline.io
  scope: Cluster
  names:
    plural: agentruntimeprofiles
    singular: agentruntimeprofile
    kind: AgentRuntimeProfile
    shortNames: [arprofile]
    categories: [txo-fabric]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [image, storage, resources]
              properties:
                engine:
                  type: string
                  enum: [Hermes]
                  default: Hermes
                image:
                  type: string
                  minLength: 1
                storage:
                  type: object
                  required: [storageClassName]
                  properties:
                    size:
                      type: string
                      default: 2Gi
                      pattern: '^[0-9]+([EPTGMK]i?|[eEinumkKMGTP]*[-+]?[0-9]*)$'
                    storageClassName:
                      type: string
                      minLength: 1
                resources:
                  type: object
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: integer
                          - type: string
                        x-kubernetes-int-or-string: true
                    requests:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: integer
                          - type: string
                        x-kubernetes-int-or-string: true
                    claims:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                priorityClassName:
                  type: string
                  default: vixens-medium
                sizingLabel:
                  type: string
                  default: V-small
                compatibility:
                  type: object
                  properties:
                    s6Overlay:
                      type: boolean
                      default: false
