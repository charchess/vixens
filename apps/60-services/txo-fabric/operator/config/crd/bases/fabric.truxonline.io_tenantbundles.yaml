---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantbundles.fabric.truxonline.io
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: api
spec:
  group: fabric.truxonline.io
  scope: Cluster
  names:
    plural: tenantbundles
    singular: tenantbundle
    kind: TenantBundle
    shortNames: [tbundle]
    categories: [txo-fabric]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantId
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [tenantId, displayName]
              properties:
                tenantId:
                  type: string
                  pattern: '^TEN[0-9]{5,}$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: tenantId is immutable
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 253
                isolation:
                  type: object
                  properties:
                    profile:
                      type: string
                      enum: [Shared, Dedicated]
                      default: Shared
                persistence:
                  type: object
                  properties:
                    postgresql:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum: [Shared, Dedicated]
                          default: Shared
                        profileRef:
                          type: string
                          maxLength: 128
                memory:
                  type: object
                  properties:
                    hindsight:
                      type: object
                      properties:
                        profileRef:
                          type: string
                          maxLength: 128
                modules:
                  type: array
                  maxItems: 64
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                      enabled:
                        type: boolean
                        default: true
                      profileRef:
                        type: string
                        maxLength: 128
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Degraded, Failed, Deleting]
                namespace:
                  type: string
                  maxLength: 63
                persistence:
                  type: object
                  properties:
                    postgresql:
                      type: object
                      properties:
                        phase:
                          type: string
                        endpoint:
                          type: string
                        message:
                          type: string
                memory:
                  type: object
                  properties:
                    hindsight:
                      type: object
                      properties:
                        phase:
                          type: string
                        endpoint:
                          type: string
                        message:
                          type: string
                modules:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                      endpoint:
                        type: string
                      message:
                        type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
