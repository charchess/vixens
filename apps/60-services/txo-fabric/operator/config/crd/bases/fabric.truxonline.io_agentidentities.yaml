---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentidentities.fabric.truxonline.io
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: api
spec:
  group: fabric.truxonline.io
  scope: Cluster
  names:
    plural: agentidentities
    singular: agentidentity
    kind: AgentIdentity
    shortNames: [agentid]
    categories: [txo-fabric]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef.name
        - name: Key
          type: string
          jsonPath: .spec.agentKey
        - name: Agent
          type: string
          jsonPath: .spec.displayName
        - name: Bank
          type: string
          jsonPath: .status.memory.bankId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [tenantRef, agentKey, displayName]
              properties:
                tenantRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                  x-kubernetes-validations:
                    - rule: self.name == oldSelf.name
                      message: tenantRef.name is immutable
                agentKey:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: agentKey is immutable
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                runtime:
                  type: object
                  properties:
                    profileRef:
                      type: string
                      minLength: 1
                      maxLength: 128
                      default: hermes-default
                memory:
                  type: object
                  properties:
                    bankId:
                      type: string
                      minLength: 2
                      maxLength: 128
                      pattern: '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, AuthBlocked, Degraded, Failed, Deleting]
                namespace:
                  type: string
                  maxLength: 63
                runtime:
                  type: object
                  properties:
                    deploymentName:
                      type: string
                      maxLength: 253
                    pvcName:
                      type: string
                      maxLength: 253
                memory:
                  type: object
                  properties:
                    bankId:
                      type: string
                      maxLength: 128
                    phase:
                      type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
