---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: postgresqlprofiles.fabric.truxonline.io
spec:
  group: fabric.truxonline.io
  names:
    categories:
    - txo-fabric
    kind: PostgreSQLProfile
    listKind: PostgreSQLProfileList
    plural: postgresqlprofiles
    shortNames:
    - pgprofile
    singular: postgresqlprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.topology
      name: Topology
      type: string
    - jsonPath: .spec.databaseReclaimPolicy
      name: DB Reclaim
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              databaseReclaimPolicy:
                default: Retain
                description: DatabaseReclaimPolicy controls whether the tenant database
                  is retained when the TenantBundle stops requesting PostgreSQL.
                enum:
                - Retain
                - Delete
                type: string
              provider:
                default: CloudNativePG
                description: Provider identifies the PostgreSQL lifecycle implementation.
                enum:
                - CloudNativePG
                type: string
              requiredExtensions:
                description: |-
                  RequiredExtensions are PostgreSQL extensions that must be present in every tenant database created through this profile.
                  The controller maps them to CloudNativePG Database.spec.extensions; binaries must already be available in the target cluster image/runtime.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              roleReclaimPolicy:
                default: Retain
                description: RoleReclaimPolicy controls whether the tenant login role
                  is retained with its database.
                enum:
                - Retain
                - Delete
                type: string
              shared:
                description: Shared configures an existing shared CloudNativePG cluster.
                properties:
                  clusterRef:
                    description: |-
                      ClusterRef selects the existing CloudNativePG cluster used by this profile.
                      The Fabric operator does not own or mutate the Cluster resource itself.
                    properties:
                      name:
                        description: Name is the CloudNativePG Cluster resource name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the CloudNativePG
                          Cluster.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  databaseNamePrefix:
                    default: txo_
                    description: DatabaseNamePrefix is prepended to operator-generated
                      tenant database names.
                    maxLength: 32
                    pattern: ^[a-z][a-z0-9_]*$
                    type: string
                  roleNamePrefix:
                    default: txo_
                    description: RoleNamePrefix is prepended to operator-generated
                      tenant login roles.
                    maxLength: 32
                    pattern: ^[a-z][a-z0-9_]*$
                    type: string
                required:
                - clusterRef
                type: object
              topology:
                description: |-
                  Topology is SharedCluster in the initial Fabric contract. Dedicated tenant
                  clusters are intentionally deferred until the shared path is validated end-to-end.
                enum:
                - SharedCluster
                type: string
            required:
            - shared
            - topology
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
