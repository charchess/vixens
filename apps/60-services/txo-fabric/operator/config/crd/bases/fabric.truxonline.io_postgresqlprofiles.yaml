---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: postgresqlprofiles.fabric.truxonline.io
spec:
  group: fabric.truxonline.io
  names:
    categories:
    - txo-fabric
    kind: PostgreSQLProfile
    listKind: PostgreSQLProfileList
    plural: postgresqlprofiles
    shortNames:
    - pgprofile
    singular: postgresqlprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clusterRef:
                description: |-
                  ClusterRef identifies the existing CloudNativePG Cluster for Shared mode.
                  Dedicated profiles may omit it because the Fabric operator will own the tenant cluster lifecycle.
                properties:
                  name:
                    description: Name is the metadata.name of the referenced namespaced
                      object.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the namespace of the referenced object.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              credentials:
                description: Credentials defines where database credential material
                  is sourced.
                properties:
                  remoteKeyPrefix:
                    description: |-
                      RemoteKeyPrefix is the platform-owned prefix below which tenant credential records live.
                      The reconciler appends the canonical tenant name when materializing credentials.
                    maxLength: 512
                    minLength: 1
                    type: string
                  secretStoreRef:
                    description: SecretStoreRef identifies the platform secret store
                      used for tenant database credentials.
                    properties:
                      kind:
                        default: ClusterSecretStore
                        description: Kind selects a namespaced or cluster-scoped External
                          Secrets store.
                        enum:
                        - SecretStore
                        - ClusterSecretStore
                        type: string
                      name:
                        description: Name is the External Secrets store name.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - remoteKeyPrefix
                - secretStoreRef
                type: object
              databaseNamePrefix:
                default: txo_
                description: DatabaseNamePrefix is prepended to the canonical tenant
                  name when deriving the logical database/user name.
                maxLength: 32
                pattern: ^[a-z][a-z0-9_]*$
                type: string
              mode:
                default: Shared
                description: Mode must match the TenantBundle persistence request
                  that selects this profile.
                enum:
                - Shared
                - Dedicated
                type: string
              provider:
                default: CloudNativePG
                description: Provider identifies the database lifecycle implementation.
                enum:
                - CloudNativePG
                type: string
              requiredExtensions:
                description: RequiredExtensions are PostgreSQL extensions that must
                  exist in every tenant database created by this profile.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - credentials
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
