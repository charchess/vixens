---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: postgresqlprofiles.fabric.truxonline.io
spec:
  group: fabric.truxonline.io
  names:
    categories:
    - txo-fabric
    kind: PostgreSQLProfile
    listKind: PostgreSQLProfileList
    plural: postgresqlprofiles
    shortNames:
    - pgprofile
    singular: postgresqlprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.topology
      name: Topology
      type: string
    - jsonPath: .spec.databaseReclaimPolicy
      name: DB Reclaim
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              databaseReclaimPolicy:
                default: Retain
                description: DatabaseReclaimPolicy controls whether the tenant database
                  is retained when the TenantBundle stops requesting PostgreSQL.
                enum:
                - Retain
                - Delete
                type: string
              dedicated:
                description: Dedicated configures operator-created per-tenant CloudNativePG
                  clusters.
                properties:
                  instances:
                    default: 2
                    description: Instances is the number of CloudNativePG instances
                      for a dedicated tenant cluster.
                    format: int32
                    maximum: 5
                    minimum: 1
                    type: integer
                  storage:
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 8Gi
                        description: Size is the PVC request for each dedicated CloudNativePG
                          instance.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: StorageClassName is explicit because Vixens intentionally
                          has no default StorageClass.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - storageClassName
                    type: object
                required:
                - storage
                type: object
              provider:
                default: CloudNativePG
                description: Provider identifies the PostgreSQL lifecycle implementation.
                enum:
                - CloudNativePG
                type: string
              roleReclaimPolicy:
                default: Retain
                description: RoleReclaimPolicy controls whether the tenant login role
                  is retained with its database.
                enum:
                - Retain
                - Delete
                type: string
              shared:
                description: Shared configures an existing shared CloudNativePG cluster.
                properties:
                  clusterRef:
                    description: ClusterRef selects the existing platform-owned CloudNativePG
                      cluster.
                    properties:
                      name:
                        description: Name is the CloudNativePG Cluster resource name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the CloudNativePG
                          Cluster.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  databaseNamePrefix:
                    default: txo_
                    description: DatabaseNamePrefix is prepended to operator-generated
                      tenant database names.
                    maxLength: 32
                    type: string
                  roleNamePrefix:
                    default: txo_
                    description: RoleNamePrefix is prepended to operator-generated
                      tenant login roles.
                    maxLength: 32
                    type: string
                required:
                - clusterRef
                type: object
              topology:
                description: Topology defines whether tenants consume an existing
                  shared cluster or receive a dedicated cluster.
                enum:
                - SharedCluster
                - DedicatedCluster
                type: string
            required:
            - topology
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
