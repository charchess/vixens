---
# Migration is a separate, ordered gate before the serving Deployment.
# New upstream schema versions require a NEW named migration Job in Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: txo-openfga-migrate-v1-22-0
  namespace: txo-fabric-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: txo-fabric-openfga
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: txo-fabric
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: txo-fabric-openfga
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: txo-fabric
    spec:
      restartPolicy: Never
      priorityClassName: vixens-high
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: docker.io/openfga/openfga@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: postgres://postgresql-shared-rw.databases.svc.cluster.local:5432/txo_fabric_openfga?sslmode=require
            - name: OPENFGA_DATASTORE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: txo-openfga-runtime
                  key: username
            - name: OPENFGA_DATASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: txo-openfga-runtime
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
