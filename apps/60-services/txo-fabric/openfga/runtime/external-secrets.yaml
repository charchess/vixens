---
# Both targets read one explicit, operator-enrolled OpenBao record.
# Values in OpenBao: username=txo_fabric_openfga, password, presharedKeys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-openfga-postgresql-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-openfga-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/openfga
        property: username
    - secretKey: password
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/openfga
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-openfga-runtime-credentials
  namespace: txo-fabric-system
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-openfga-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/openfga
        property: username
    - secretKey: password
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/openfga
        property: password
    - secretKey: presharedKeys
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/openfga
        property: presharedKeys
