---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Phase 2a of the operator cutover deliberately removes the legacy hAIrem
# TenantBundle/AgentIdentity objects from the production desired state while
# keeping the legacy CRDs installed. Their previously generated downstream
# resources were already verified ownerless after the Kyverno lifecycle
# retirement, so Deployments, PVCs and NetworkPolicies remain in place.
#
# After promotion, the acceptance gate is:
#   - no legacy TenantBundle/AgentIdentity objects remain;
#   - tenant-hairem-sandbox and Tesla/Tina/Tiffa runtime resources remain healthy;
#   - ArgoCD returns Synced/Healthy.
#
# Only after that gate passes do we replace the CRD schema, reintroduce the
# sandbox with the new API contract and enable the authoritative operator.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-30"
