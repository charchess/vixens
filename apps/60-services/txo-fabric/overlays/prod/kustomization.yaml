---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../tenants/hairem-sandbox

# TXO Fabric is currently bootstrapped through Kyverno. Keep the CRD discovery,
# generate policies and trigger resources in distinct Argo CD sync waves so a
# fresh cluster does not try to reconcile TenantBundle/AgentIdentity before the
# API and policies exist. Reconciliation annotations on trigger resources are
# deliberately bumped when an already-created trigger needs a fresh admission
# UPDATE after a POC provisioning race.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-30"

  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: kyverno:txo-fabric-provisioner
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-20"

  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: kyverno:txo-fabric-provisioner
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-20"

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: txo-fabric-tenant-provisioning
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-20"
      - op: add
        path: /metadata/annotations/fabric.truxonline.io~1reconcile-revision
        value: "2"

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: txo-fabric-tenant-network-baseline
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-20"
          fabric.truxonline.io/reconcile-revision: "4"
      - op: replace
        path: /spec/rules/0/match/any/0/resources
        value:
          kinds: [fabric.truxonline.io/v1alpha1/TenantBundle]
      - op: replace
        path: /spec/rules/0/generate/namespace
        value: "tenant-{{ request.object.spec.slug }}"

  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: txo-fabric-agent-provisioning
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-20"
      - op: add
        path: /metadata/annotations/fabric.truxonline.io~1reconcile-revision
        value: "4"
      - op: add
        path: /spec/rules/0/generate/data/spec/storageClassName
        value: truenas-iscsi-delete

  - target:
      group: fabric.truxonline.io
      version: v1alpha1
      kind: TenantBundle
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-10"
          fabric.truxonline.io/reconcile-revision: "4"

  - target:
      group: fabric.truxonline.io
      version: v1alpha1
      kind: AgentIdentity
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "10"
          fabric.truxonline.io/reconcile-revision: "5"
