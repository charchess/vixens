---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../tenants/hairem-sandbox

# Phase 1 of the operator cutover deliberately removes the temporary Kyverno
# lifecycle engine while keeping the legacy CRDs and desired sandbox objects in
# place. Generated downstream resources are configured to be orphaned when the
# policies are removed; they are verified on-cluster before the authoritative
# operator/CRD migration is promoted.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-30"

  - target:
      group: fabric.truxonline.io
      version: v1alpha1
      kind: TenantBundle
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-10"

  - target:
      group: fabric.truxonline.io
      version: v1alpha1
      kind: AgentIdentity
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "10"
