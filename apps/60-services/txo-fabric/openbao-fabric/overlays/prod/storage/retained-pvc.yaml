---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-openbao-fabric-0-synelia
  namespace: txo-fabric-system
  annotations:
    # The retained StatefulSet volume is never a normal Argo prune/delete target.
    # Removing this manifest must be a reviewed recovery decision, not volume substitution.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/component: secret-plane
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/part-of: txo-fabric
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-rwo-retain
  resources:
    requests:
      storage: 5Gi
