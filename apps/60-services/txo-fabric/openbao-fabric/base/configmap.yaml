---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-fabric-config
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/component: secret-plane
    app.kubernetes.io/part-of: txo-fabric
data:
  server.hcl: |
    ui = false
    api_addr = "https://openbao-fabric.txo-fabric-system.svc:8200"
    cluster_addr = "https://127.0.0.1:8201"

    storage "raft" {
      path = "/openbao/data"
      node_id = "openbao-fabric-0"
    }

    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "127.0.0.1:8201"
      tls_cert_file = "/openbao/tls/tls.crt"
      tls_key_file = "/openbao/tls/tls.key"
    }
