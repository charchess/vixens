---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao-fabric
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/component: secret-plane
    app.kubernetes.io/part-of: txo-fabric
spec:
  serviceName: openbao-fabric
  replicas: 1
  revisionHistoryLimit: 2
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-fabric
      app.kubernetes.io/component: secret-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-fabric
        app.kubernetes.io/component: secret-plane
        app.kubernetes.io/part-of: txo-fabric
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Image 2.6.2: OCI User=openbao, actual UID=100 and GID=1000.
        # Kubelet requires a numeric identity to verify runAsNonRoot.
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.6.2
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/bao"]
          args: ["server", "-config=/openbao/config/server.hcl"]
          ports:
            - name: api
              containerPort: 8200
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: api
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /openbao/data
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: scratch
              mountPath: /tmp
            - name: tls
              mountPath: /openbao/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openbao-fabric-config
        - name: scratch
          emptyDir:
            sizeLimit: 32Mi
        - name: tls
          secret:
            secretName: openbao-fabric-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: openbao-fabric
          app.kubernetes.io/component: secret-plane
          app.kubernetes.io/part-of: txo-fabric
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: truenas-iscsi-retain
        resources:
          requests:
            storage: 5Gi
