---
apiVersion: fabric.truxonline.io/v1alpha1
kind: TenantBundle
metadata:
  name: hairem-sandbox
  labels:
    app.kubernetes.io/part-of: txo-fabric
    fabric.truxonline.io/purpose: test
spec:
  tenantId: TEN90001
  displayName: hAIrem Sandbox
  isolation:
    profile: Shared
  persistence:
    postgresql:
      mode: Shared
      profileRef: postgresql-shared
  memory:
    hindsight:
      profileRef: hindsight-gateway
  workspace:
    profileRef: shared-nfs
    retentionPolicy: Retain
    users:
      - name: client0
        collaborative: true
  humanAccess:
    web:
      domainSuffix: truxonline.com
      ingressClassName: traefik
      tlsClusterIssuer: letsencrypt-prod
      publicDNS: true
      dnsTarget: truxonline.com
      oidc:
        issuer: https://authentik.truxonline.com/application/o/txo-fabric-hairem/
        clientId: txo-fabric-hairem
        scopes: openid profile email
