---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fabric-smoke-http-canary-credential
  namespace: tenant-fabric-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fabric-smoke-http-canary-credential
  namespace: tenant-fabric-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: fabric-smoke-http-canary-credential
    creationPolicy: Owner
    immutable: true
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: txo-fabric
          fabric.truxonline.io/integration-credential: "true"
          fabric.truxonline.io/tenant-name: fabric-smoke
          fabric.truxonline.io/integration-connection: fabric-smoke-http-canary
        annotations:
          vixens.io/secret-source: eso-password-generator
      data:
        credential: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: fabric-smoke-http-canary-credential
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fabric-smoke-integration-canary
  namespace: tenant-fabric-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  server.py: |
    import hmac
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    token = os.environ["CANARY_TOKEN"]

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            expected = "Bearer " + token
            authorized = hmac.compare_digest(self.headers.get("Authorization", ""), expected)
            status = 200 if authorized else 401
            payload = json.dumps({"authorized": authorized}).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
            print(f"canary request method=GET status={status}", flush=True)

        def log_message(self, _format, *_args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-smoke-integration-canary
  namespace: tenant-fabric-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: fabric-smoke-integration-canary
    app.kubernetes.io/part-of: txo-fabric
    fabric.truxonline.io/purpose: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-smoke-integration-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-smoke-integration-canary
        app.kubernetes.io/part-of: txo-fabric
        fabric.truxonline.io/purpose: test
    spec:
      containers:
        - name: canary
          image: python:3.14-slim
          command: ["python3", "/opt/canary/server.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: CANARY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fabric-smoke-http-canary-credential
                  key: credential
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: server
              mountPath: /opt/canary
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: fabric-smoke-integration-canary
---
apiVersion: v1
kind: Service
metadata:
  name: fabric-smoke-integration-canary
  namespace: tenant-fabric-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: fabric-smoke-integration-canary
    app.kubernetes.io/part-of: txo-fabric
spec:
  selector:
    app.kubernetes.io/name: fabric-smoke-integration-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fabric-smoke-integration-canary
  namespace: tenant-fabric-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fabric-smoke-integration-canary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-agent
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: fabric.truxonline.io/v1alpha1
kind: IntegrationConnection
metadata:
  name: fabric-smoke-http-canary
  labels:
    app.kubernetes.io/part-of: txo-fabric
    fabric.truxonline.io/purpose: test
spec:
  tenantRef:
    name: fabric-smoke
  protocol: HTTP
  endpoint: http://fabric-smoke-integration-canary.tenant-fabric-smoke.svc:8080/
  authentication: BearerToken
  credentialRef:
    name: fabric-smoke-http-canary-credential
---
apiVersion: fabric.truxonline.io/v1alpha1
kind: IntegrationBinding
metadata:
  name: fabric-smoke-probe-http-canary
  labels:
    app.kubernetes.io/part-of: txo-fabric
    fabric.truxonline.io/purpose: test
spec:
  tenantRef:
    name: fabric-smoke
  agentRef:
    name: fabric-smoke-probe
  connectionRef:
    name: fabric-smoke-http-canary
  state: Revoked
  operations:
    - GET
  scopes:
    - canary.read
