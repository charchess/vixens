---
apiVersion: fabric.truxonline.io/v1alpha1
kind: TenantBundle
metadata:
  name: fabric-smoke
  labels:
    app.kubernetes.io/part-of: txo-fabric
    fabric.truxonline.io/purpose: test
spec:
  tenantId: TEN90002
  displayName: Fabric Smoke
  lifecycle:
    mode: Parked
  isolation:
    profile: Shared
  # Native private agent storage policy, even while this tenant is Parked.
  agentStorage:
    retainedStorageClassName: storage-rwo-retain
    disposableStorageClassName: storage-rwo-delete
  persistence:
    postgresql:
      mode: Shared
      profileRef: postgresql-shared
