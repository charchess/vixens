---
apiVersion: fabric.truxonline.io/v1alpha1
kind: TenantBundle
metadata:
  name: indiba
  labels:
    app.kubernetes.io/part-of: txo-fabric
spec:
  tenantId: TEN00002
  displayName: Indiba
  isolation:
    profile: Shared
  # Private Hermes agent storage is tenant-owned, not release-channel-owned.
  # Existing PVCs are not recreated when this policy is introduced.
  agentStorage:
    retainedStorageClassName: truenas-iscsi-retain
    disposableStorageClassName: truenas-iscsi-delete
  persistence:
    postgresql:
      mode: Shared
      profileRef: postgresql-shared
  memory:
    hindsight:
      profileRef: hindsight-gateway
  workspace:
    profileRef: shared-nfs
    retentionPolicy: Retain
    groups:
      - name: sales
        collaborative: true
        skillsCollaborative: true
    users:
      - name: edfoley
        collaborative: true
        skillsCollaborative: true
  humanAccess:
    web:
      iamGroups:
        - sales
      domainSuffix: truxonline.com
      ingressClassName: traefik
      tlsClusterIssuer: letsencrypt-prod
      publicDNS: true
      dnsTarget: truxonline.com
      oidc:
        issuer: https://authentik.truxonline.com/application/o/txo-fabric-indiba/
        clientId: txo-fabric-indiba
        scopes: openid profile email
