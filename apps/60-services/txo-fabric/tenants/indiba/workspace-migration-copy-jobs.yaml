---
apiVersion: batch/v1
kind: Job
metadata:
  name: indiba-rwx-copy-ws-group-sales-rw
  namespace: tenant-indiba
  labels:
    app.kubernetes.io/part-of: txo-fabric
    app.kubernetes.io/component: storage-migration
    fabric.truxonline.io/storage-migration-source-uid: "7a7af1a5-8bde-4283-b4e1-24a5b88a8bb8"
    fabric.truxonline.io/storage-migration-target-uid: "02d05352-006a-4db5-a053-d3c64d8a18c0"
  annotations:
    vixens.io/activation-gate: explicit-snapshot-and-unsuspend-required
spec:
  suspend: false
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: txo-fabric
        app.kubernetes.io/component: storage-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rsync
          image: instrumentisto/rsync-ssh@sha256:ee4e9665a70742d526cea53d5d5b012990a39fbb4f87b7f094250e44ab93db5f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          command: [sh, -ec]
          args:
            - |
              rsync -aHAX --numeric-ids --one-file-system --info=stats2 /source/ /target/
              test -z "$(rsync -aHAXn --numeric-ids --one-file-system --itemize-changes /source/ /target/)"
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          nfs:
            server: nas.truxonline.com
            path: /mnt/tank/k8s/vixens/nfs/vols/pvc-7a7af1a5-8bde-4283-b4e1-24a5b88a8bb8
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: ws-group-sales-rw-synelia

