# Canonical POC owner identity: usr000001 = edfoley.
# access.userRef deliberately remains the existing workspace scope key until #3802/#3852 define IAM/user-ID mapping.
# Human display names stay mutable; machine identity and Hindsight bank IDs stay stable.
---
apiVersion: fabric.truxonline.io/v1alpha1
kind: AgentIdentity
metadata:
  name: ten00002-usr000001-agt00001
  labels:
    app.kubernetes.io/part-of: txo-fabric
spec:
  tenantRef:
    name: indiba
  agentKey: usr000001-agt00001
  displayName: Sam
  runtime:
    profileRef: hermes-default
    storage:
      retentionPolicy: Retain
  access:
    userRef: edfoley
    groups:
      - sales
  humanAccess:
    enabled: true
  memory:
    bankId: ten00002-usr000001-agt00001
