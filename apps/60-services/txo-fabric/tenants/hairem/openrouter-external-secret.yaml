---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-ai-provider-hairem
  namespace: txo-fabric-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: txo-ai-provider-hairem
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: txo-fabric
          app.kubernetes.io/component: tenant-ai-provider-credentials
        annotations:
          vixens.io/secret-source: openbao
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/tenants/hairem
        property: openrouter_api_key
