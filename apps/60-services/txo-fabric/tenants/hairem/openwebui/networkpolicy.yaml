---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hairem-openwebui
  namespace: tenant-hairem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hairem-openwebui
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              hermes-agent: usr000001-agt00002
      ports:
        - { protocol: TCP, port: 8642 }
