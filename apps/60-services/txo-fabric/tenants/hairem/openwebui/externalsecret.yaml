---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hairem-openwebui-runtime
  namespace: tenant-hairem
  labels:
    app.kubernetes.io/name: hairem-openwebui
    app.kubernetes.io/part-of: txo-fabric
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hairem-openwebui-runtime
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: webui-secret-key
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/hairem-openwebui
        property: webui-secret-key
