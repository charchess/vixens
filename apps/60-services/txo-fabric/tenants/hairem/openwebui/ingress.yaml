---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hairem-openwebui
  namespace: tenant-hairem
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/public: "true"
    external-dns.alpha.kubernetes.io/target: truxonline.com
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,auth-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [chat.hairem.truxonline.com]
      secretName: hairem-openwebui-tls
  rules:
    - host: chat.hairem.truxonline.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hairem-openwebui
                port:
                  name: http
