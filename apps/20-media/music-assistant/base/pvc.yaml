---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-config
  annotations:
    # Share the Deployment's Argo wave: this storage class uses
    # WaitForFirstConsumer, so an earlier wave would deadlock provisioning.
    argocd.argoproj.io/sync-wave: "11"
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-xfs-retain
  resources:
    requests:
      storage: 10Gi
