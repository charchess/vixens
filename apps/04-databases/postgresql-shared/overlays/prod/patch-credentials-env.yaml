---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-admin-credentials
  namespace: databases
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-umi
    kind: ClusterSecretStore
  target:
    name: postgresql-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          vixens.io/secret-source: openbao
  dataFrom:
  - extract:
      key: vixens/prod/apps/04-databases/postgresql-shared/admin
