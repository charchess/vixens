---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-postgresql-cnpg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
        annotations:
          vixens.io/secret-source: openbao
      data:
        username: authentik
        password: '{{ index . "postgresql-password" }}'
  dataFrom:
    - extract:
        key: vixens/dev/apps/03-security/authentik
