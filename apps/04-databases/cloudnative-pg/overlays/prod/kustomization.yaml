---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
resources:
  - servicemonitor.yaml
  - pdb.yaml
  - cilium-networkpolicy.yaml
  - cilium-networkpolicy-barman-plugin.yaml

components:
  - ../../../../_shared/components/poddisruptionbudget/1
  - ../../../../_shared/components/priority/medium

# The CloudNativePG Deployment is rendered by the separate Helm source in the
# ArgoCD Application. Deployment metadata/pod annotations therefore belong in
# that Helm source's values; Kustomize cannot patch resources from another
# Argo multi-source renderer.
