---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: truenas-scratch-downloads
  labels:
    app.kubernetes.io/name: nfs-storage
    vixens.io/storage-source: truenas-static-nfs
    vixens.io/storage-tree: scratch
spec:
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 192.168.200.244
    path: /mnt/tank/scratch/downloads
