# Create as Secret key `driver-config-file.yaml` in namespace `truenas-csi`.

driver: freenas-nfs
instance_id: umi-truenas-nfs
httpConnection:
  protocol: https
  host: 192.168.200.244
  port: 443
  apiKey: REPLACE_WITH_TRUENAS_API_KEY
  allowInsecure: true
  apiVersion: 2
sshConnection:
  host: 192.168.200.244
  port: 22
  username: root
  privateKey: |
    REPLACE_WITH_PRIVATE_KEY_IF_SSH_IS_USED
zfs:
  datasetParentName: tank/k8s/vixens/nfs/vols
  detachedSnapshotsDatasetParentName: tank/k8s/vixens/nfs/snaps
  datasetEnableQuotas: true
  datasetEnableReservation: false
  datasetPermissionsMode: "0777"
  datasetPermissionsUser: 0
  datasetPermissionsGroup: 0
nfs:
  shareHost: 192.168.200.244
  shareAlldirs: false
  shareAllowedHosts: []
  shareAllowedNetworks:
    - 172.30.208.64/32
    - 10.42.0.0/16
    # UMI/WSL2 NFS requests are observed by TrueNAS as the Windows host/NAT source.
    - 192.168.199.119/32
  shareMaprootUser: root
  shareMaprootGroup: root
  shareMapallUser: ""
  shareMapallGroup: ""
