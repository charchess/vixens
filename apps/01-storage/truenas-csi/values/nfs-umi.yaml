---
# democratic-csi / TrueNAS SCALE NFS for UMI laboratory k3s.
# Secret expected: truenas-csi/truenas-csi-nfs-driver-config
# key: driver-config-file.yaml

fullnameOverride: truenas-csi-nfs

csiDriver:
  name: org.democratic-csi.truenas-nfs
  attachRequired: false
  podInfoOnMount: true

controller:
  replicaCount: 1
  strategy: deployment
  priorityClassName: system-cluster-critical
  externalAttacher:
    enabled: false
  externalSnapshotter:
    enabled: false
  externalHealthMonitorController:
    enabled: false
  podLabels:
    vixens.io/backup-profile: relaxed
    vixens.io/single-replica: "true"
  podAnnotations:
    vixens.io/explicitly-allow-root: "true"
    vixens.io/no-long-connections: "true"
    vixens.io/nometrics: "true"
    vixens.io/service-binding: "false"
    vixens.io/sizing-rationale: "G-nano: democratic-csi NFS controller for lab storage"
  driver:
    logLevel: info
    env:
      - name: PATH
        value: /bin:/usr/bin:/sbin:/usr/sbin:/usr/local/sbin:/usr/local/bin
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi

node:
  enabled: true
  hostNetwork: true
  priorityClassName: system-node-critical
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  podLabels:
    vixens.io/single-replica: "true"
  podAnnotations:
    vixens.io/explicitly-allow-root: "true"
    vixens.io/no-long-connections: "true"
    vixens.io/nometrics: "true"
    vixens.io/service-binding: "false"
    vixens.io/sizing-rationale: "G-nano: CSI NFS node plugin on single-node UMI lab"
  driver:
    logLevel: info
    env:
      - name: PATH
        value: /bin:/usr/bin:/sbin:/usr/sbin:/usr/local/sbin:/usr/local/bin
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi
  driverRegistrar:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

csiProxy:
  enabled: true

driver:
  existingConfigSecret: truenas-csi-nfs-driver-config
  config:
    driver: freenas-nfs

storageClasses:
  - name: truenas-nfs-retain
    defaultClass: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
    mountOptions:
      - nfsvers=4.1
  - name: truenas-nfs-delete
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
    mountOptions:
      - nfsvers=4.1

volumeSnapshotClasses: []
