---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: truenas-csi
resources:
  - ../../base
patches:
  # The base already selects the canonical ClusterSecretStore/openbao.
  # Do not override it to the retired openbao-umi store: UMI has no such store.
  # Only the provider paths differ between dev and prod.
  - target:
      kind: ExternalSecret
      name: truenas-csi-iscsi-driver-config
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: vixens/dev/apps/01-storage/truenas-csi/iscsi
  - target:
      kind: ExternalSecret
      name: truenas-csi-nfs-driver-config
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: vixens/dev/apps/01-storage/truenas-csi/nfs
