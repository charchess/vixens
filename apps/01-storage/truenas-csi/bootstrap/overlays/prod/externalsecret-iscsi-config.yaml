---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi-iscsi-driver-config-sync
  namespace: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: truenas-csi-iscsi-driver-config
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: driver-config-file.yaml
      remoteRef:
        key: vixens/prod/apps/01-storage/truenas-csi/iscsi
        property: driver-config-file.yaml
