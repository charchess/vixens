---
# Pod egress for official TrueNAS CSI; UMI-only verified .111 storage interface.
# Controller sidecars also require Kubernetes API access, and DNS for the FQDN.
# hostNetwork node pods + host iscsiadm are NOT isolated by this pod policy:
# node firewall/routing are separate mandatory physical rollout checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: synelia-csi-egress
  namespace: synelia-csi
spec:
  endpointSelector:
    matchLabels:
      app: synelia-csi-controller
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 192.168.111.69/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Defense-in-depth for Cilium-managed endpoints only. The privileged CSI
# hostNetwork node DaemonSet and host iSCSI/NFS paths require host-level rules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: synelia-csi-node-egress
  namespace: synelia-csi
spec:
  endpointSelector:
    matchLabels:
      app: synelia-csi-node
  egress:
    - toEntities:
        - kube-apiserver
    - toCIDR:
        - 192.168.111.69/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "2049"
              protocol: TCP
            - port: "3260"
              protocol: TCP
