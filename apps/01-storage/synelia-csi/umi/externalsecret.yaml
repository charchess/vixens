---
# Create the scoped key in OpenBao Infra BEFORE the gated UMI Argo sync.
# Never copy TrueNAS credentials into Git, helm values or CLI arguments.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synelia-csi-credentials
  namespace: synelia-csi
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: synelia-csi-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          vixens.io/secret-source: openbao
  data:
    - secretKey: api-key
      remoteRef:
        key: vixens/dev/apps/01-storage/synelia-csi/api
        property: api-key
