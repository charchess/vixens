---
# The credential is infrastructure authority. This references OpenBao only;
# neither a key nor a placeholder Secret is committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synelia-prod-csi-credentials
  namespace: synelia-prod-csi
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: synelia-prod-csi-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          vixens.io/secret-source: openbao
  data:
    - secretKey: api-key
      remoteRef:
        key: vixens/prod/apps/01-storage/synelia-csi/api
        property: api-key
