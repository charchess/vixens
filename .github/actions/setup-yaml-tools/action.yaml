---
name: Setup YAML Tools
description: Install pinned yamllint and yq versions
author: charchess

inputs:
  install-yamllint:
    required: false
    default: 'true'
  install-yq:
    required: false
    default: 'true'
  yamllint-version:
    required: false
    default: '1.35.1'
  yq-version:
    required: false
    default: '4.44.1'

runs:
  using: composite
  steps:
    - name: Install pinned yamllint
      if: inputs.install-yamllint == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet "yamllint==${{ inputs.yamllint-version }}"
        yamllint --version

    - name: Install pinned yq
      if: inputs.install-yq == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo curl -fsSL           "https://github.com/mikefarah/yq/releases/download/v${{ inputs.yq-version }}/yq_linux_amd64"           -o /usr/local/bin/yq
        sudo chmod 0755 /usr/local/bin/yq
        yq --version
