---
name: 'Setup Kubernetes Tools'
description: 'Install pinned Kustomize, Helm, and Kubeconform versions'
author: 'charchess'

inputs:
  kustomize-version:
    required: false
    default: '5.5.0'
  helm-version:
    required: false
    default: '3.16.0'
  kubeconform-version:
    required: false
    default: '0.6.7'

runs:
  using: 'composite'
  steps:
    - name: Cache K8s tools
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          /usr/local/bin/kustomize
          /usr/local/bin/kubeconform
          /usr/local/bin/helm
        key: ${{ runner.os }}-k8s-tools-kustomize-${{ inputs.kustomize-version }}-helm-${{ inputs.helm-version }}-kubeconform-${{ inputs.kubeconform-version }}

    - name: Install pinned tools
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "Installing Kustomize ${{ inputs.kustomize-version }}"
        curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${{ inputs.kustomize-version }}/kustomize_v${{ inputs.kustomize-version }}_linux_amd64.tar.gz" |
          tar -xz -C /tmp
        sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize

        echo "Installing Helm ${{ inputs.helm-version }}"
        curl -fsSL "https://get.helm.sh/helm-v${{ inputs.helm-version }}-linux-amd64.tar.gz" |
          tar -xz -C /tmp
        sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

        echo "Installing Kubeconform ${{ inputs.kubeconform-version }}"
        curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${{ inputs.kubeconform-version }}/kubeconform-linux-amd64.tar.gz" |
          tar -xz -C /tmp
        sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

    - name: Verify pinned tool versions
      shell: bash
      run: |
        set -euo pipefail
        kustomize version
        helm version --short
        kubeconform -v
