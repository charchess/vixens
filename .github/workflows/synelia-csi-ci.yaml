---
name: Synelia CSI Upstream Helm Contract

on:
  pull_request:
    paths:
      - 'apps/01-storage/synelia-csi/**'
      - 'argocd/overlays/dev/apps/synelia-csi-umi.yaml'
      - 'argocd/overlays/prod/apps/synelia-prod-csi.yaml'
      - 'argocd/overlays/prod/kustomization.yaml'
      - '.github/workflows/synelia-csi-ci.yaml'

permissions:
  contents: read

jobs:
  helm-render:
    name: Pinned Helm Template & Safety Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kubernetes render tools
        uses: ./.github/actions/setup-k8s-tools

      - name: Verify immutable upstream chart and render
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/truenas/truenas-csi/master/charts/truenas-csi-1.4.0.tgz \
            -o /tmp/synelia-csi-1.4.0.tgz
          echo '3a1b9f326447d54beb3fec20e3b026a4a07f68cb7f3685c7a71f7e9d70589367  /tmp/synelia-csi-1.4.0.tgz' | sha256sum -c -
          helm template synelia-csi /tmp/synelia-csi-1.4.0.tgz \
            --namespace synelia-csi \
            -f apps/01-storage/synelia-csi/umi/values.yaml \
            > /tmp/synelia-csi-render.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/synelia-csi-render.yaml

      - name: Assert rendered CSI/SC isolation and no credential Secret
        run: |
          python3 - <<'PY'
          import yaml

          with open("/tmp/synelia-csi-render.yaml", encoding="utf-8") as stream:
              docs = [doc for doc in yaml.safe_load_all(stream) if doc]
          classes = [doc for doc in docs if doc["kind"] == "StorageClass"]
          drivers = [doc for doc in docs if doc["kind"] == "CSIDriver"]
          assert len(drivers) == 1
          assert drivers[0]["metadata"]["name"] == "synelia.csi.truenas.io"
          assert {x["metadata"]["name"] for x in classes} == {
              "storage-rwx-retain", "storage-rwx-delete",
              "storage-rwo-retain", "storage-rwo-delete",
          }
          for sc in classes:
              name = sc["metadata"]["name"]
              assert name.startswith("storage-rw"), name
              assert "umi" not in sc["parameters"]["datasetPath"].lower(), name
              assert sc["provisioner"] == "synelia.csi.truenas.io", name
              assert sc["metadata"]["annotations"][
                  "storageclass.kubernetes.io/is-default-class"
              ] == "false", name
              assert sc["reclaimPolicy"] == name.rsplit("-", 1)[-1].capitalize()
              parent = sc["parameters"]["datasetPath"]
              if name.startswith("storage-rwo-"):
                  assert parent == "k8s/vixens/synelia-test/iscsi", name
                  assert sc["parameters"]["protocol"] == "iscsi", name
                  assert sc["parameters"]["fsType"] == "ext4", name
                  assert sc["volumeBindingMode"] == "WaitForFirstConsumer", name
              else:
                  assert parent == "k8s/vixens/synelia-test/nfs", name
                  assert sc["parameters"]["protocol"] == "nfs", name
                  assert "nfsvers=4.1" in sc["mountOptions"], name
                  assert sc["volumeBindingMode"] == "Immediate", name
          assert not [x for x in docs if x["kind"] == "Secret"], (
              "the chart must not materialize a plaintext credential Secret"
          )
          deployments = [x for x in docs if x["kind"] == "Deployment"]
          nodes = [x for x in docs if x["kind"] == "DaemonSet"]
          assert len(deployments) == len(nodes) == 1
          assert nodes[0]["spec"]["template"]["spec"]["hostNetwork"] is True
          for workload in deployments + nodes:
              containers = workload["spec"]["template"]["spec"]["containers"]
              assert any(
                  c["image"] == "ghcr.io/truenas/truenas-csi:v1.4.0"
                  for c in containers
              )
          print("PASS: pinned Helm render, non-default Synelia SC, CSI identity, no credential Secret")
          PY

      - name: Render companion ESO and native NetworkPolicies
        run: |
          kustomize build apps/01-storage/synelia-csi/overlays/dev \
            > /tmp/synelia-csi-policy.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/synelia-csi-policy.yaml

      - name: Assert activated production Synelia CSI invariants
        run: |
          helm template synelia-prod-csi /tmp/synelia-csi-1.4.0.tgz \
            --namespace synelia-prod-csi \
            -f apps/01-storage/synelia-csi/prod/values.yaml \
            > /tmp/synelia-prod-csi-render.yaml
          kustomize build apps/01-storage/synelia-csi/prod \
            > /tmp/synelia-prod-csi-companion.yaml
          kubeconform -strict -ignore-missing-schemas -summary \
            /tmp/synelia-prod-csi-render.yaml /tmp/synelia-prod-csi-companion.yaml
          python3 - <<'PY'
          from pathlib import Path

          rendered = Path("/tmp/synelia-prod-csi-render.yaml").read_text(encoding="utf-8")
          companion = Path("/tmp/synelia-prod-csi-companion.yaml").read_text(encoding="utf-8")
          root = Path("argocd/overlays/prod/kustomization.yaml").read_text(encoding="utf-8")
          app = Path("argocd/overlays/prod/apps/synelia-prod-csi.yaml").read_text(encoding="utf-8")

          assert "  - apps/synelia-prod-csi.yaml" in root
          assert "# Disabled by owner: apps/synelia-prod-csi.yaml" not in root
          assert "automated:" in app
          assert "prune: false" in app
          assert "synelia.prod.csi.truenas.io" in rendered
          assert "ghcr.io/truenas/truenas-csi:v1.4.0" in rendered
          assert "org.democratic-csi" not in rendered + companion + app
          assert "192.168.200.244" not in rendered + companion + app
          assert "kind: Secret" not in rendered + companion + app
          for storage_class in (
              "storage-rwx-retain",
              "storage-rwx-delete",
              "storage-rwo-retain",
              "storage-rwo-delete",
          ):
              assert storage_class in rendered
          assert "storageclass.kubernetes.io/is-default-class: \"false\"" in rendered
          for parent in (
              "k8s/vixens/synelia-test/nfs",
              "k8s/vixens/synelia-test/iscsi",
          ):
              assert parent in rendered
          assert "app: synelia-prod-csi-controller" in companion
          assert "app: synelia-prod-csi-node" in companion
          print("PASS: active production Synelia CSI follows the canonical contract and remains isolated from legacy CSI")
          PY
