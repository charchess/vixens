---
name: TXO Fabric OpenBao Source Contract CI

on:
  pull_request:
    paths:
      - 'docs/adr/041-separate-openbao-fabric-secret-plane.md'
      - 'docs/adr/000-index.md'
      - 'docs/adr/README.md'
      - 'docs/troubleshooting/txo-fabric-openbao-bootstrap-and-restore.md'
      - 'apps/60-services/txo-fabric/openbao-fabric/**'
      - 'scripts/validation/validate-openbao-fabric-source.py'
      - 'scripts/validation/test_openbao_fabric_source.py'
      - '.github/workflows/txo-fabric-openbao-source-ci.yaml'

permissions:
  contents: read

jobs:
  source-only:
    name: Source contract / no-production-activation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh origin/main for authoritative diff
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: git diff --check origin/main...HEAD
        run: git diff --check origin/main...HEAD
      - name: Pure standard-library policy/secret validation unit tests
        run: python3 -m unittest discover -s scripts/validation -p test_openbao_fabric_source.py -v
      - name: Setup Kustomize tools
        uses: ./.github/actions/setup-k8s-tools
      - name: Render old Infra store and unchanged Fabric prod overlay
        run: |
          kustomize build apps/00-infra/openbao/overlays/dev > /tmp/openbao-infra-dev.yaml
          kustomize build apps/00-infra/openbao/overlays/prod > /tmp/openbao-infra-prod.yaml
          kustomize build apps/60-services/txo-fabric/overlays/prod > /tmp/txo-fabric-prod.yaml
          grep -q 'name: openbao' /tmp/openbao-infra-prod.yaml
          ! grep -q 'openbao-fabric' /tmp/txo-fabric-prod.yaml
      - name: Assert changed source contains no values, runtime objects or new Infra ESO consumers
        run: |
          python3 scripts/validation/validate-openbao-fabric-source.py \
            --base origin/main --head HEAD --prod-render /tmp/txo-fabric-prod.yaml
