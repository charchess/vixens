---
name: TXO Fabric OpenBao Private POC Contract CI

on:
  pull_request:
    paths:
      - 'docs/adr/041-separate-openbao-fabric-secret-plane.md'
      - 'docs/troubleshooting/txo-fabric-openbao-bootstrap-and-restore.md'
      - 'apps/60-services/txo-fabric/openbao-fabric/**'
      - 'apps/60-services/txo-fabric/overlays/dev/kustomization.yaml'
      - 'apps/60-services/txo-fabric/overlays/prod/kustomization.yaml'
      - 'scripts/validation/validate-openbao-fabric-source.py'
      - 'scripts/validation/validate-openbao-fabric-poc.py'
      - 'scripts/validation/test_openbao_fabric_source.py'
      - '.github/workflows/txo-fabric-openbao-source-ci.yaml'

permissions:
  contents: read

jobs:
  private-poc:
    name: Private empty substrate / no-consumer evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh origin/main for authoritative diff
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: git diff --check origin/main...HEAD
        run: git diff --check origin/main...HEAD
      - name: Setup manifest parser
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Policy and POC regression unit tests
        run: python3 -m unittest discover -s scripts/validation -p test_openbao_fabric_source.py -v
      - name: Setup Kustomize
        uses: ./.github/actions/setup-k8s-tools
      - name: Render five POC and selected TXO compositions
        run: |
          kustomize build apps/60-services/txo-fabric/openbao-fabric/base > /tmp/bao-base.yaml
          kustomize build apps/60-services/txo-fabric/openbao-fabric/overlays/dev > /tmp/bao-dev.yaml
          kustomize build apps/60-services/txo-fabric/openbao-fabric/overlays/prod > /tmp/bao-prod.yaml
          kustomize build apps/60-services/txo-fabric/overlays/dev > /tmp/txo-dev.yaml
          kustomize build apps/60-services/txo-fabric/overlays/prod > /tmp/txo-prod.yaml
      - name: Render unselected Transit preflight SA only
        run: |
          kustomize build apps/60-services/txo-fabric/openbao-fabric/transit-staged > /tmp/bao-seal-staged.yaml
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import yaml
          path = Path("scripts/validation/validate-openbao-fabric-source.py")
          spec = importlib.util.spec_from_file_location("seal_guard", path)
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          docs = list(yaml.safe_load_all(Path("/tmp/bao-seal-staged.yaml").read_text()))
          if guard.validate_staged_seal_identity(docs):
              raise SystemExit("FAIL: unsafe staged seal identity")
          print("PASS: exact unselected SA; NO Transit Pod/egress/config/role")
          PY
      - name: Source/Infra reference and changed-file guard
        run: |
          python3 scripts/validation/validate-openbao-fabric-source.py \
            --base origin/main --head HEAD --prod-render /tmp/txo-prod.yaml
      - name: Assert scoped objects, private network, Retain and inactive gates
        run: |
          python3 scripts/validation/validate-openbao-fabric-poc.py \
            --base /tmp/bao-base.yaml --dev /tmp/bao-dev.yaml \
            --prod /tmp/bao-prod.yaml --txo-dev /tmp/txo-dev.yaml \
            --txo-prod /tmp/txo-prod.yaml
