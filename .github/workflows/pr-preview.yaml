---
name: PR Preview

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'argocd/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  kustomize-diff:
    name: Kustomize Diff Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-k8s-tools

      - name: Prepare base tree
        run: |
          git fetch origin "${{ github.base_ref }}"
          git worktree add --detach /tmp/vixens-base "origin/${{ github.base_ref }}"

      - name: Detect affected overlays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files.[].path')"
          : > /tmp/overlays.txt

          if echo "$changed" | grep -q '^apps/_shared/'; then
            find apps -type f \( -path '*/overlays/dev/kustomization.yaml' -o -path '*/overlays/prod/kustomization.yaml' \) |
              sed 's|/kustomization.yaml$||' >> /tmp/overlays.txt
          else
            echo "$changed" |
              awk -F/ '/^apps\/[^/]+\/[^/]+\// {print $1"/"$2"/"$3}' |
              sort -u |
              while IFS= read -r app; do
                for env in dev prod; do
                  [ -f "$app/overlays/$env/kustomization.yaml" ] &&
                    echo "$app/overlays/$env" >> /tmp/overlays.txt
                done
              done
          fi

          if echo "$changed" | grep -q '^argocd/'; then
            printf '%s\n' argocd/overlays/dev argocd/overlays/prod >> /tmp/overlays.txt
          fi

          sort -u -o /tmp/overlays.txt /tmp/overlays.txt
          cat /tmp/overlays.txt

      - name: Build and diff
        run: |
          set -euo pipefail
          {
            echo '## Kustomize preview'
            echo
          } > /tmp/preview.md

          while IFS= read -r overlay; do
            [ -z "$overlay" ] && continue
            echo "Building $overlay"
            kustomize build --enable-helm "$overlay" > /tmp/new.yaml

            {
              echo "### `$overlay`"
              echo
            } >> /tmp/preview.md

            if [ -f "/tmp/vixens-base/$overlay/kustomization.yaml" ]; then
              (
                cd /tmp/vixens-base
                kustomize build --enable-helm "$overlay"
              ) > /tmp/old.yaml
              if diff -u /tmp/old.yaml /tmp/new.yaml > /tmp/change.diff; then
                echo 'No rendered change.' >> /tmp/preview.md
              else
                {
                  echo '<details><summary>Rendered diff</summary>'
                  echo
                  echo '```diff'
                  head -n 800 /tmp/change.diff
                  echo '```'
                  echo '</details>'
                } >> /tmp/preview.md
              fi
            else
              echo 'New overlay.' >> /tmp/preview.md
            fi
            echo >> /tmp/preview.md
          done < /tmp/overlays.txt

      - name: Post preview
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vixens-kustomize-preview -->';
            const body = marker + '\n' + fs.readFileSync('/tmp/preview.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
