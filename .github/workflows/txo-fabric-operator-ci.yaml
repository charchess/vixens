---
name: TXO Fabric Operator CI

on:
  pull_request:
    paths:
      - apps/60-services/txo-fabric/operator/**
      - .github/workflows/txo-fabric-operator-ci.yaml
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/operator/**/*.go
      - apps/60-services/txo-fabric/operator/go.mod
      - apps/60-services/txo-fabric/operator/go.sum
      - apps/60-services/txo-fabric/operator/Dockerfile
      - .github/workflows/txo-fabric-operator-ci.yaml

permissions:
  contents: write

jobs:
  test:
    name: Go test, generated API and image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Verify module lock files
        working-directory: apps/60-services/txo-fabric/operator
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        working-directory: apps/60-services/txo-fabric/operator
        run: go test ./...

      - name: Vet
        working-directory: apps/60-services/txo-fabric/operator
        run: go vet ./...

      - name: Generate API and RBAC
        working-directory: apps/60-services/txo-fabric/operator
        run: make generate manifests

      - name: Materialize generated API on maintenance branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/txo-fabric-generated-api'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go \
            apps/60-services/txo-fabric/operator/config/crd/bases \
            apps/60-services/txo-fabric/operator/config/rbac/role.yaml
          if git diff --cached --quiet; then
            echo "Generated API is already materialized"
          else
            git commit -m "chore(txo-fabric): regenerate API and RBAC"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload generated API and RBAC
        uses: actions/upload-artifact@v4
        with:
          name: txo-fabric-generated-api
          if-no-files-found: error
          path: |
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go
            apps/60-services/txo-fabric/operator/config/crd/bases
            apps/60-services/txo-fabric/operator/config/rbac/role.yaml

      - name: Verify generated API and RBAC drift
        run: |
          git diff --exit-code -- \
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go \
            apps/60-services/txo-fabric/operator/config/crd/bases \
            apps/60-services/txo-fabric/operator/config/rbac/role.yaml

      - name: Build operator image
        run: docker build -t txo-fabric-operator:ci apps/60-services/txo-fabric/operator
