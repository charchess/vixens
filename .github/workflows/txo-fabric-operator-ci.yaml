---
name: TXO Fabric Operator CI

on:
  workflow_call:

jobs:
  sync-generated:
    name: Sync generated API on same-repo PR
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Generate TXO release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TXO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TXO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Configure TXO release bot Git identity
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Generate and sync API/RBAC artifacts
        id: sync
        working-directory: apps/60-services/txo-fabric/operator
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          make generate manifests
          cd "${GITHUB_WORKSPACE}"

          git add \
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go \
            apps/60-services/txo-fabric/operator/config/crd/bases \
            apps/60-services/txo-fabric/operator/config/rbac/role.yaml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(txo-fabric): sync generated operator API"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    name: Go test, generated API and image build
    needs: [sync-generated]
    if: ${{ always() && (needs.sync-generated.result == 'skipped' || needs.sync-generated.outputs.changed != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Verify module lock files
        working-directory: apps/60-services/txo-fabric/operator
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify gofmt for Hermes private API contract and regression tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/60-services/txo-fabric/operator/api/v1alpha1/agentidentity_types.go
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go
            apps/60-services/txo-fabric/operator/internal/controller/agentidentity_private_api.go
            apps/60-services/txo-fabric/operator/internal/controller/agentidentity_private_api_test.go
            apps/60-services/txo-fabric/operator/internal/controller/agentidentity_controller.go
          )
          if [ -n "$(gofmt -l "${files[@]}")" ]; then
            gofmt -d "${files[@]}"
            exit 1
          fi

      - name: Require regression tests for operator behavior changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_SHA"

          SOURCE_CHANGES="$(
            git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)apps/60-services/txo-fabric/operator/**/*.go' |
              awk '!/_test\.go$/ && !/\/zz_generated\.deepcopy\.go$/'
          )"
          TEST_CHANGES="$(
            git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)apps/60-services/txo-fabric/operator/**/*_test.go'
          )"

          if [ -n "$SOURCE_CHANGES" ] && [ -z "$TEST_CHANGES" ]; then
            echo "::error::TXO Fabric operator behavior changed without corresponding unit/regression test changes."
            echo "Operator Go source changes:"
            printf '%s\n' "$SOURCE_CHANGES" | sed 's/^/  - /'
            echo "Add or update *_test.go coverage in the same PR."
            exit 1
          fi

          if [ -n "$SOURCE_CHANGES" ]; then
            echo "✅ Operator behavior changes include unit/regression test changes"
          else
            echo "ℹ️ No operator Go behavior changes require new unit tests"
          fi

      - name: Test with race detector and coverage
        working-directory: apps/60-services/txo-fabric/operator
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: txo-fabric-operator-coverage
          if-no-files-found: error
          path: |
            apps/60-services/txo-fabric/operator/coverage.out
            apps/60-services/txo-fabric/operator/coverage.txt

      - name: Vet
        working-directory: apps/60-services/txo-fabric/operator
        run: go vet ./...

      - name: Generate API and RBAC
        working-directory: apps/60-services/txo-fabric/operator
        run: make generate manifests

      - name: Upload generated API and RBAC
        uses: actions/upload-artifact@v4
        with:
          name: txo-fabric-generated-api
          if-no-files-found: error
          path: |
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go
            apps/60-services/txo-fabric/operator/config/crd/bases
            apps/60-services/txo-fabric/operator/config/rbac/role.yaml

      - name: Verify generated API and RBAC drift
        run: |
          git diff --exit-code -- \
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go \
            apps/60-services/txo-fabric/operator/config/crd/bases \
            apps/60-services/txo-fabric/operator/config/rbac/role.yaml

      - name: Verify generated CRDs are wired into Kustomize
        run: |
          set -euo pipefail

          CRD_DIR="apps/60-services/txo-fabric/operator/config/crd/bases"
          KUSTOMIZATION="apps/60-services/txo-fabric/operator/config/crd/kustomization.yaml"
          MISSING=0

          for crd in "$CRD_DIR"/*.yaml; do
            resource="bases/$(basename "$crd")"
            if ! grep -Fxq "  - $resource" "$KUSTOMIZATION"; then
              echo "::error file=$KUSTOMIZATION::Generated CRD $resource is not referenced by Kustomize"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "✅ All generated CRDs are referenced by Kustomize"

      - name: Assert Hermes private API stays absent from selected production render
        # The opt-in contract is source-only; never select any API process,
        # private/public API Service, credential dependency or listener.
        uses: ./.github/actions/setup-k8s-tools

      - name: Verify selected production has only the approved internal Hermes API canary
        shell: bash
        run: |
          set -euo pipefail
          kustomize build apps/60-services/txo-fabric/overlays/prod > /tmp/txo-fabric-prod-hermes-private-api.yaml
          # CRDs describe opt-in schema. Inspect only selected workload objects.
          awk 'BEGIN { RS = "---"; ORS = "\n---\n" } !/kind: CustomResourceDefinition/ { print }' \
            /tmp/txo-fabric-prod-hermes-private-api.yaml > /tmp/txo-fabric-prod-hermes-selected.yaml
          python3 - /tmp/txo-fabric-prod-hermes-selected.yaml <<'PY'
          from pathlib import Path
          import re
          import sys

          documents = [d for d in Path(sys.argv[1]).read_text().split("\n---\n") if d.strip()]
          sensitive = re.compile(r"privateAPI:|API_SERVER_(?:ENABLED|KEY)|hermes-api-|(?<![0-9])8642(?![0-9])")
          hits = [d for d in documents if sensitive.search(d)]
          if len(hits) != 3:
              raise SystemExit(f"expected exactly three canary API documents, found {len(hits)}")

          def one(kind, name):
              found = [d for d in hits if f"kind: {kind}" in d and f"  name: {name}\n" in d]
              if len(found) != 1:
                  raise SystemExit(f"expected exactly one {kind}/{name} API canary document")
              return found[0]

          identity = one("AgentIdentity", "ten00001-usr000001-agt00002")
          required_identity = ("    privateAPI:\n      enabled: true\n      tenantId: TEN00001",)
          webui = one("Deployment", "hairem-openwebui")
          required_webui = (
              "value: http://hermes-usr000001-agt00002:8642/v1",
              "name: hermes-api-usr000001-agt00002",
              "fabric.truxonline.io/private-hermes-client: \"true\"",
          )
          policy = one("NetworkPolicy", "hairem-openwebui")
          required_policy = ("port: 8642", "hermes-agent: usr000001-agt00002")
          for document, required in ((identity, required_identity), (webui, required_webui), (policy, required_policy)):
              for needle in required:
                  if needle not in document:
                      raise SystemExit(f"approved canary contract missing: {needle}")
          selected = "\n---\n".join(hits)
          if re.search(r"API_SERVER_(?:ENABLED|KEY)|hermes-private-api|hermes-api-server|hermes-api-credential", selected):
              raise SystemExit("unexpected API process, public service, or credential artifact")
          print("PASS: only the explicitly pinned internal Open WebUI → Electra API canary is selected")
          PY

      - name: Build operator image
        run: docker build -t txo-fabric-operator:ci apps/60-services/txo-fabric/operator
