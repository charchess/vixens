---
name: Build TrueNAS Legacy Migration Bridge

on:
  pull_request:
    paths:
      - 'apps/01-storage/synelia-csi/legacy-migrator/**'
      - '.github/workflows/truenas-legacy-migrator-image-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/01-storage/synelia-csi/legacy-migrator/**'
      - '.github/workflows/truenas-legacy-migrator-image-ci.yaml'

permissions:
  contents: read

jobs:
  image:
    name: Validate and publish immutable legacy migration bridge
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Unit and formatting checks
        working-directory: apps/01-storage/synelia-csi/legacy-migrator
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          gofmt -d main.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go test ./...
      - name: Compute exact source tag
        id: source
        shell: bash
        run: |
          source_sha="$(git log -1 --format=%H -- apps/01-storage/synelia-csi/legacy-migrator .github/workflows/truenas-legacy-migrator-image-ci.yaml)"
          test -n "$source_sha"
          echo "tag=src-${source_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: apps/01-storage/synelia-csi/legacy-migrator
          platforms: linux/amd64
          push: true
          tags: ghcr.io/charchess/truenas-legacy-migrator:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
      - name: Publish digest for a separately reviewed GitOps pin
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          echo "Image: ghcr.io/charchess/truenas-legacy-migrator@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source tag: ${SOURCE_TAG}" >> "$GITHUB_STEP_SUMMARY"
