---
name: Build INDIBA Platform MVP

on:
  push:
    branches: [main]
    paths:
      - docker/indiba-platform/**
  workflow_dispatch:

concurrency:
  group: build-indiba-platform
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/indiba-platform
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/indiba-platform:mvp
            ghcr.io/${{ github.repository_owner }}/indiba-platform:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
