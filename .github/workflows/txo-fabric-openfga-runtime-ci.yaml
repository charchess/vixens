---
name: TXO Fabric OpenFGA Runtime CI

on:
  pull_request:
    paths:
      - 'apps/60-services/txo-fabric/openfga/runtime/**'
      - '.github/workflows/txo-fabric-openfga-runtime-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/60-services/txo-fabric/openfga/runtime/**'
      - '.github/workflows/txo-fabric-openfga-runtime-ci.yaml'

permissions:
  contents: read

jobs:
  openfga-runtime:
    name: Fabric OpenFGA private GitOps render
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.5.0'
      - name: Render and enforce isolation invariants
        shell: bash
        run: |
          set -euo pipefail
          kustomize build apps/60-services/txo-fabric/openfga/runtime > /tmp/fabric-openfga.yaml
          test -s /tmp/fabric-openfga.yaml
          grep -q '^kind: DatabaseRole$' /tmp/fabric-openfga.yaml
          grep -q '^kind: Database$' /tmp/fabric-openfga.yaml
          grep -q '^kind: ExternalSecret$' /tmp/fabric-openfga.yaml
          grep -q '^kind: NetworkPolicy$' /tmp/fabric-openfga.yaml
          grep -q '^kind: Job$' /tmp/fabric-openfga.yaml
          grep -q '^kind: Deployment$' /tmp/fabric-openfga.yaml
          grep -q '^kind: Service$' /tmp/fabric-openfga.yaml
          if grep -Eq '^kind: (Ingress|LoadBalancer|NodePort)$' /tmp/fabric-openfga.yaml; then
            echo "OpenFGA must be private" >&2
            exit 1
          fi
          if grep -Eq 'OPENFGA_DATASTORE_ENGINE[^a-zA-Z]|^[[:space:]]+value: memory$' /tmp/fabric-openfga.yaml; then
            # Explicitly verify PostgreSQL; the presence of the engine env key alone
            # is expected and therefore only the memory fallback is forbidden.
            if grep -Eq '^[[:space:]]+value: memory$' /tmp/fabric-openfga.yaml; then exit 1; fi
          fi
          grep -q 'value: postgres' /tmp/fabric-openfga.yaml
          grep -q 'value: preshared' /tmp/fabric-openfga.yaml
          grep -Eq 'docker.io/openfga/openfga@sha256:[0-9a-f]{64}' /tmp/fabric-openfga.yaml
          echo "Standalone private OpenFGA runtime manifests render successfully"
