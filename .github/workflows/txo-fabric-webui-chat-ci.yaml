---
name: TXO Fabric WebUI Chat Transport CI

on:
  pull_request:
    paths:
      - 'apps/60-services/txo-fabric/webui/**'
      - 'apps/60-services/txo-fabric/tenants/**'
      - 'apps/60-services/txo-fabric/overlays/prod/**'
      - 'scripts/validation/check_fabric_private_api_render.py'
      - 'scripts/validation/tests/test_fabric_private_api_render.py'
      - '.github/workflows/txo-fabric-webui-chat-ci.yaml'
  push:
    branches:
      - main
    paths:
      - 'apps/60-services/txo-fabric/webui/**'
      - 'apps/60-services/txo-fabric/tenants/**'
      - 'apps/60-services/txo-fabric/overlays/prod/**'
      - 'scripts/validation/check_fabric_private_api_render.py'
      - 'scripts/validation/tests/test_fabric_private_api_render.py'
      - '.github/workflows/txo-fabric-webui-chat-ci.yaml'

permissions:
  contents: read

jobs:
  test:
    name: WebUI transport unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - name: Test Hermes transport and authorization boundaries
        working-directory: apps/60-services/txo-fabric/webui
        run: node --test
      - name: Install pinned offline manifest parser
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Test generic multi-tenant private API source contract
        run: python3 -m unittest discover -s scripts/validation/tests -p test_fabric_private_api_render.py -v
      - name: Setup tools for source-only private API and WebUI checks
        uses: ./.github/actions/setup-k8s-tools
      - name: Assert canonical private API intent for any tenant; BFF/chat remain inactive
        shell: bash
        run: |
          set -euo pipefail
          kustomize build apps/60-services/txo-fabric/overlays/prod > /tmp/txo-responses-prod.yaml
          # A selected AgentIdentity can cause the operator to create a real
          # Secret, listener, Service and NetworkPolicy. Validate all enabled
          # agents against their canonical tenant without an identity allowlist.
          # Remaining selected workloads, Secrets, Services and chat schema
          # are checked independently for unintended API/DB activation.
          python3 scripts/validation/check_fabric_private_api_render.py /tmp/txo-responses-prod.yaml
          grep -A2 'name: TXO_WEBUI_BFF_BROWSER_ENABLED' apps/60-services/txo-fabric/webui/runtime/deployment.yaml | grep -q 'false'
          grep -A2 'name: TXO_FABRIC_PRIVATE_BRIDGE_ENABLED' apps/60-services/txo-fabric/operator/config/manager/manager.yaml | grep -q 'false'
          ! grep -q '003_fabric_chat_threads' apps/60-services/txo-fabric/webui/bootstrap/migrate-job.yaml
          echo 'PASS: BFF gates OFF and all private API bindings tenant-canonical'
