---
name: Merge Queue Validation

on:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  validate-merge:
    name: Validate Merge Queue Entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.head_sha }}

      - uses: ./.github/actions/setup-k8s-tools
      - uses: ./.github/actions/setup-yaml-tools

      - name: YAML and Kustomize validation
        run: |
          set -euo pipefail

          find apps argocd \( -name '*.yaml' -o -name '*.yml' \)             ! -path '*/charts/*'             ! -path '*/crds/*'             ! -name 'argocd-crds.yaml'             ! -name 'argocd-install.yaml'             ! -name 'manifests.yaml'             ! -name 'servicemonitors.yaml'             ! -name 'upstream.yaml'             ! -name 'poolers.yaml'             -print0 | xargs -0 -r yamllint -c yamllint-config.yml

          while IFS= read -r kustomization; do
            overlay="$(dirname "$kustomization")"
            echo "Building $overlay"
            kustomize build --enable-helm "$overlay" >/dev/null
          done < <(
            find apps -type f -path '*/overlays/dev/kustomization.yaml' -o                       -type f -path '*/overlays/prod/kustomization.yaml'
          )

          for overlay in argocd/overlays/dev argocd/overlays/prod; do
            kustomize build --enable-helm "$overlay" >/dev/null
          done

          bash scripts/validation/validate-kustomization-refs.sh
          python3 scripts/validation/validate-repository.py

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.head_sha }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  summary:
    name: Merge Queue Summary
    runs-on: ubuntu-latest
    needs: [validate-merge, security-check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate-merge.result }}" != success ] ||
             [ "${{ needs.security-check.result }}" != success ]; then
            echo "Merge queue validation failed"
            exit 1
          fi
          echo "Merge queue validation passed"
