---
name: Validate & Security

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # DETECT CHANGES (détermine quels jobs exécuter)
  # ══════════════════════════════════════════════════════════════
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
      security: ${{ steps.filter.outputs.security }}
      txo_operator: ${{ steps.filter.outputs.txo_operator }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            k8s:
              - 'apps/**'
              - 'argocd/**'
              - '.github/workflows/**'
              - 'yamllint-config.yml'
              - '**/kustomization.yaml'
            security:
              - '**'
            txo_operator:
              - 'apps/60-services/txo-fabric/operator/**'
              - '.github/workflows/txo-fabric-operator-ci.yaml'

  # 1️⃣ Validation YAML robuste
  yaml-lint:
    name: YAML Syntax & Style
    needs: [detect-changes]
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup YAML tools
        uses: ./.github/actions/setup-yaml-tools
        with:
          install-yq: 'false'

      - name: Validate YAML syntax
        run: |
          echo "🔍 Validation YAML syntax"
          echo "📋 Using repo yamllint-config.yml (strict style enforcement)"

          # PR: valider uniquement les fichiers changés
          # Push: valider tous les fichiers
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "📋 PR Mode: Validating only changed files"
            gh pr view ${{ github.event.pull_request.number }} \
              --json files --jq '.files.[].path' | \
              grep -E '\.(yaml|yml)$' | \
              grep -E '^(apps|argocd)/' | \
              grep -v -E '(crds/|charts/|upstream\.yaml|poolers\.yaml)' | \
              xargs -r yamllint -c yamllint-config.yml
          else
            echo "📋 Push Mode: Validating all files"
            find apps argocd \( -name "*.yaml" -o -name "*.yml" \) \
              ! -path "*/crds/*" \
              ! -path "*/charts/*" \
              ! -name "upstream.yaml" \
              ! -name "poolers.yaml" \
              ! -name "argocd-crds.yaml" \
              ! -name "argocd-install.yaml" \
              ! -name "manifests.yaml" \
              ! -name "servicemonitors.yaml" | \
              xargs yamllint -c yamllint-config.yml
          fi

  # 2️⃣ Validation spécifique ArgoCD
  argocd-validate:
    name: ArgoCD Structure
    needs: [detect-changes, yaml-lint, secret-scan]
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup YAML tools
        uses: ./.github/actions/setup-yaml-tools
        with:
          install-yamllint: 'false'

      - name: Validate ArgoCD applications
        run: |
          echo "🔍 Validation Applications ArgoCD"

          # Validation complète des Applications
          find argocd -name "*.yaml" -type f | while read file; do
            if [ "$(yq eval '.kind' "$file" 2>/dev/null)" = "Application" ]; then
              echo "📋 Validation: $(basename "$file")"

              # Vérification détaillée
              yq eval '
                .apiVersion == "argoproj.io/v1alpha1" and
                .kind == "Application" and
                .metadata.name != null and
                .metadata.name != "" and
                .spec.project != null and
                .spec.project != "" and
                .spec.destination.server != null and
                .spec.destination.server != "" and
                .spec.destination.namespace != null and
                .spec.destination.namespace != ""
              ' "$file" || {
                echo "❌ Structure ArgoCD invalide: $file"
                yq eval '.' "$file"
                exit 1
              }
            fi
          done

      - name: Validate inline Helm values YAML
        run: |
          echo "🔍 Validation blocs Helm values inline (ArgoCD Applications)"
          python3 scripts/validation/validate-helm-values.py argocd/

  # 3️⃣ Kustomize Build + Kubeconform (valide la sortie buildée, pas les fichiers individuels)
  kustomize-validate:
    name: Kustomize Build & K8s Validation
    needs: [detect-changes, yaml-lint, secret-scan]
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup K8s tools
        uses: ./.github/actions/setup-k8s-tools
      - name: Detect changed overlays (PR fast mode)
        id: detect-overlays
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILES=$(gh pr view ${{ github.event.pull_request.number }} \
            --json files --jq '.files.[].path')

          CHANGED=$(printf '%s\n' "$FILES" | \
            sed -nE 's~^(apps/[^/]+/[^/]+/overlays/(dev|prod))(/.*)?$~\1~p; s~^(argocd/overlays/(dev|prod))(/.*)?$~\1~p' | \
            sort -u)

          # Fast mode is safe only when every changed GitOps file maps directly
          # to an overlay. Base/shared/workflow changes can affect several overlays.
          UNMAPPED=$(printf '%s\n' "$FILES" | \
            grep -E '^(apps|argocd)/' | \
            grep -v -E '^(apps/[^/]+/[^/]+/overlays/(dev|prod)(/|$)|argocd/overlays/(dev|prod)(/|$))' || true)

          if [ -n "$UNMAPPED" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "ℹ️ Non-overlay GitOps changes detected; running full validation"
            printf '%s\n' "$UNMAPPED"
          elif [ -n "$CHANGED" ]; then
            echo "mode=fast" >> $GITHUB_OUTPUT
            echo "overlays<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "🚀 Fast mode: validating changed overlays only"
            echo "$CHANGED"
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "ℹ️ No overlay changes detected, running full validation"
          fi

      - name: Build and validate all overlays
        run: |
          echo "🔍 Kustomize Build + Kubeconform Validation"
          echo "   (valide les ressources APRÈS merge des patches)"
          echo ""

          FAILED=0
          WARNED=0
          SKIP_KINDS="Application,AppProject,CustomResourceDefinition,Middleware,HelmRelease,HelmRepository,Kustomization,Cluster,PostgresCluster,Pooler,ScheduledBackup,VolumeSnapshotClass,VolumeSnapshot,CiliumL2AnnouncementPolicy,CiliumLoadBalancerIPPool"

          # Fonction de validation
          validate_overlay() {
            local overlay="$1"
            echo "📋 Building: $overlay"

            # Détecter si l'overlay a une base vide (Helm-only apps)
            local base_dir
            base_dir=$(grep -oP '\.\./.*/base' "$overlay/kustomization.yaml" 2>/dev/null | head -1)
            if [ -n "$base_dir" ]; then
              local full_base="$overlay/$base_dir"
              if [ -f "$full_base/kustomization.yaml" ]; then
                local base_resources
                base_resources=$(grep -cE '^(resources:|helmCharts:)' "$full_base/kustomization.yaml" 2>/dev/null || true)
                base_resources=${base_resources:-0}
                if [ "$base_resources" -eq 0 ]; then
                  echo "⏭️ SKIP: $overlay (base vide - app Helm-only via ArgoCD)"
                  return 0
                fi
              fi
            fi

            # Build kustomize avec support Helm
            if ! kustomize build --enable-helm "$overlay" > /tmp/built.yaml 2>&1; then
              echo "❌ KUSTOMIZE FAILED: $overlay"
              head -20 /tmp/built.yaml
              return 1
            fi

            # Compter les ressources. grep -c prints 0 even when it exits 1,
            # so do not append a second fallback zero.
            COUNT=$(grep -c '^kind:' /tmp/built.yaml 2>/dev/null || true)
            COUNT=${COUNT:-0}
            if [ "$COUNT" -eq 0 ]; then
              echo "⚠️ WARNING: $overlay produces 0 resources"
              WARNED=$((WARNED+1))
              return 0
            fi

            # ArgoCD supports deliberately partial ServerSideApply manifests when
            # they explicitly opt out of kubectl schema validation with
            # argocd.argoproj.io/sync-options: Validate=false. Preserve the raw
            # YAML while excluding only those explicitly marked documents from
            # kubeconform; Kustomize itself has already rendered the full stream.
            python3 - /tmp/built.yaml /tmp/kubeconform.yaml <<'PY'
          import re
          import sys
          import yaml

          source, target = sys.argv[1:3]
          text = open(source, encoding="utf-8").read()
          parts = re.split(r"(?m)^---\s*$", text)

          with open(target, "w", encoding="utf-8") as out:
              for raw in parts:
                  if not raw.strip():
                      continue
                  doc = yaml.safe_load(raw)
                  if not isinstance(doc, dict):
                      continue
                  meta = doc.get("metadata") or {}
                  annotations = meta.get("annotations") or {}
                  options = annotations.get("argocd.argoproj.io/sync-options", "")
                  option_set = {item.strip().lower() for item in options.split(",")}
                  if "validate=false" in option_set:
                      print(
                          "⏭️ KUBECONFORM SKIP: "
                          f"{doc.get('kind', '<unknown>')}/{meta.get('name', '<unnamed>')} "
                          "(ArgoCD Validate=false)"
                      )
                      continue
                  out.write("---\n")
                  out.write(raw.lstrip("\n"))
                  if not raw.endswith("\n"):
                      out.write("\n")
          PY

            # Valider avec kubeconform (sur le YAML buildé, hors SSA partiels explicitement marqués)
            if ! kubeconform -ignore-missing-schemas -kubernetes-version 1.34.0 -strict -skip "$SKIP_KINDS" /tmp/kubeconform.yaml 2>&1; then
              echo "❌ KUBECONFORM FAILED: $overlay"
              return 1
            fi

            # Valider cohérence sélecteurs PDB vs labels pods (sur le YAML buildé)
            if ! python3 scripts/validation/validate-pdb-selectors.py /tmp/built.yaml 2>&1; then
              echo "❌ PDB SELECTOR MISMATCH: $overlay"
              return 1
            fi

            echo "✅ OK: $overlay ($COUNT resources)"
            return 0
          }

          # Déterminer les overlays à valider (fast mode si PR)
          if [ "${{ steps.detect-overlays.outputs.mode }}" = "fast" ] && [ -n "${{ steps.detect-overlays.outputs.overlays }}" ]; then
            echo "🚀 Fast mode: validating changed overlays only"
            OVERLAYS="${{ steps.detect-overlays.outputs.overlays }}"
          else
            echo "🔍 Full mode: validating ALL overlays"
            OVERLAYS=$(find apps -type d \( -name "dev" -o -name "prod" \) | grep overlays)
          fi

          # Keep FAILED in the current shell so any overlay failure makes the job fail.
          while IFS= read -r overlay; do
            if [ -f "$overlay/kustomization.yaml" ]; then
              if ! validate_overlay "$overlay"; then
                FAILED=1
              fi
            fi
          done <<< "$OVERLAYS"

          # Valider les overlays ArgoCD
          for overlay in argocd/overlays/dev argocd/overlays/prod; do
            if [ -d "$overlay" ] && [ -f "$overlay/kustomization.yaml" ]; then
              if ! validate_overlay "$overlay"; then
                FAILED=1
              fi
            fi
          done

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Some validations failed"
            exit 1
          fi

          echo "✅ All kustomize builds and K8s validations passed"

  # 4️⃣ Secret Scanning (gitleaks)
  secret-scan:
    name: Secret Scanning
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # 5️⃣ Vérification du flux de branches (pure trunk-based: feature → main)
  branch-flow:
    name: Branch Flow Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce pure trunk-based flow (feature → main directly)
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "🔀 PR from '$SOURCE' into '$TARGET'"

          case "$TARGET" in
            main)
              if [[ "$SOURCE" =~ ^(dev|test|staging)$ ]]; then
                echo "❌ Protected branch '$SOURCE' cannot merge to 'main'"
                echo "   Only feature branches can merge to main"
                echo "   Note: dev/test/staging branches are archived (ADR-017)"
                exit 1
              fi
              echo "✅ Feature branch '$SOURCE' allowed to merge into 'main'"
              exit 0 ;;
            dev|test|staging)
              echo "❌ Branch '$TARGET' is archived (ADR-017)"
              echo "   Use pure trunk-based workflow: feature → main"
              exit 1 ;;
            *)
              echo "❌ Unknown target branch '$TARGET'"
              exit 1 ;;
          esac

  # 6️⃣ Validation de sécurité
  security-scan:
    name: Security Best Practices
    needs: [detect-changes, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python security tools
        uses: ./.github/actions/setup-python-security

      - name: Security checks
        run: |
          echo "🔍 Vérification sécurité"
          checkov --directory . \
            --framework kubernetes \
            --compact --quiet || true

      - name: Check security patterns
        run: |
          echo "🔍 Recherche de patterns de sécurité"
          WARNINGS=0

          find apps argocd -name "*.yaml" -type f | while read file; do
            if grep -q "privileged: true" "$file"; then
              echo "⚠️ Privilèges élevés: $file"
              WARNINGS=$((WARNINGS+1))
            fi
            if grep -q "runAsUser: 0" "$file"; then
              echo "⚠️ Exécution en root: $file"
              WARNINGS=$((WARNINGS+1))
            fi
            if grep -q "allowPrivilegeEscalation: true" "$file"; then
              echo "⚠️ Élévation de privilèges: $file"
              WARNINGS=$((WARNINGS+1))
            fi
          done

  # ══════════════════════════════════════════════════════════════
  # CONTAINER IMAGE SCANNING (warning only)
  # ══════════════════════════════════════════════════════════════
  image-scan:
    name: Container Image Security
    needs: [detect-changes, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract container images
        id: extract
        run: |
          echo "📦 Extracting container images from manifests"

          # Extract images from all YAML files
          find apps argocd -name "*.yaml" -type f \
            -exec grep -h "image:" {} \; | \
            sed 's/.*image:\s*//' | \
            sed "s/[\"']//g" | \
            grep -v '^#' | \
            grep -v '^$' | \
            sort -u > /tmp/images.txt

          echo "📊 Found $(wc -l < /tmp/images.txt) unique images"
          head -20 /tmp/images.txt

          echo "count=$(wc -l < /tmp/images.txt)" >> $GITHUB_OUTPUT

      - name: Scan sample images with Trivy
        if: steps.extract.outputs.count > 0
        run: |
          echo "🔍 Scanning first 5 images as samples (warning only)"

          head -5 /tmp/images.txt | while read image; do
            echo ""
            echo "════════════════════════════════════════"
            echo "🐳 Scanning: $image"
            echo "════════════════════════════════════════"

            # Scan with trivy (exit 0 = warning only)
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity CRITICAL,HIGH,MEDIUM \
              --no-progress \
              --timeout 5m \
              "$image" || echo "⚠️ Scan failed for $image (might not be pullable)"
          done

          echo ""
          echo "ℹ️ This is informational only - workflow continues regardless of findings"

  # 7️⃣ Reusable validation families orchestrated by the required gate
  retired-patterns:
    name: Retired Pattern Guard
    uses: ./.github/workflows/retired-patterns.yaml

  txo-fabric-operator:
    name: TXO Fabric Operator CI
    needs: [detect-changes]
    if: needs.detect-changes.outputs.txo_operator == 'true'
    uses: ./.github/workflows/txo-fabric-operator-ci.yaml
    secrets: inherit

  # 8️⃣ Vérification de la configuration production (trunk-based)
  prod-config-check:
    name: Production Configuration
    needs: [detect-changes, yaml-lint, secret-scan]
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify trunk-based workflow compliance
        run: |
          echo "🔍 Vérification configuration production"

          if grep -rE "targetRevision:\s+main\s*$" argocd/overlays/prod 2>/dev/null; then
            echo "::error::Found 'targetRevision: main' in prod. Use 'prod-stable' tag."
            exit 1
          fi

          if grep -rE "targetRevision:\s+[\"']?prod[\"']?\s*$" argocd/overlays/prod 2>/dev/null; then
            echo "::error::Found 'targetRevision: prod' in prod. Use 'prod-stable' tag."
            exit 1
          fi

          if grep -r "envSlug: dev" apps/*/*/overlays/prod 2>/dev/null; then
            echo "::error::Found 'envSlug: dev' in prod overlay."
            exit 1
          fi

          if grep -r "vixens-new.git" argocd 2>/dev/null; then
            echo "::error::Found deprecated 'vixens-new.git' reference."
            exit 1
          fi

          echo "✅ Production configuration OK"

  # 9️⃣ Authoritative required gate
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - yaml-lint
      - argocd-validate
      - kustomize-validate
      - secret-scan
      - security-scan
      - image-scan
      - branch-flow
      - retired-patterns
      - txo-fabric-operator
      - prod-config-check
    if: always()
    steps:
      - name: Evaluate authoritative gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          K8S_APPLICABLE: ${{ needs.detect-changes.outputs.k8s == 'true' }}
          OPERATOR_APPLICABLE: ${{ needs.detect-changes.outputs.txo_operator == 'true' }}
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          YAML_RESULT: ${{ needs.yaml-lint.result }}
          ARGOCD_RESULT: ${{ needs.argocd-validate.result }}
          KUSTOMIZE_RESULT: ${{ needs.kustomize-validate.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          IMAGE_RESULT: ${{ needs.image-scan.result }}
          BRANCH_RESULT: ${{ needs.branch-flow.result }}
          RETIRED_RESULT: ${{ needs.retired-patterns.result }}
          OPERATOR_RESULT: ${{ needs.txo-fabric-operator.result }}
          PROD_RESULT: ${{ needs.prod-config-check.result }}
        run: |
          set -euo pipefail

          BLOCKING=0
          SUMMARY="$GITHUB_STEP_SUMMARY"

          {
            echo "## Validation Report"
            echo ""
            echo "| Validation family | Applicability | Result |"
            echo "|---|---|---|"
          } >> "$SUMMARY"

          record() {
            local label="$1"
            local applicability="$2"
            local result="$3"
            printf '| %s | %s | %s |\n' "$label" "$applicability" "$result" >> "$SUMMARY"
          }

          require_success() {
            local label="$1"
            local result="$2"
            if [ "$result" = "success" ]; then
              record "$label" "applicable" "✅ success"
            else
              record "$label" "applicable" "❌ $result"
              BLOCKING=1
            fi
          }

          require_conditional() {
            local label="$1"
            local result="$2"
            local applicable="$3"
            if [ "$applicable" = "true" ]; then
              require_success "$label" "$result"
            elif [ "$result" = "skipped" ]; then
              record "$label" "not applicable" "⏭️ skipped"
            else
              record "$label" "not applicable" "❌ expected skipped, got $result"
              BLOCKING=1
            fi
          }

          require_success "Change detection" "$DETECT_RESULT"
          require_success "Secret scanning" "$SECRET_RESULT"
          require_success "Security best practices" "$SECURITY_RESULT"
          require_success "Container image security" "$IMAGE_RESULT"
          require_success "Retired pattern guard" "$RETIRED_RESULT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_conditional "Branch flow" "$BRANCH_RESULT" "true"
          else
            require_conditional "Branch flow" "$BRANCH_RESULT" "false"
          fi

          require_conditional "YAML syntax & style" "$YAML_RESULT" "$K8S_APPLICABLE"
          require_conditional "ArgoCD structure" "$ARGOCD_RESULT" "$K8S_APPLICABLE"
          require_conditional "Kustomize + Kubeconform" "$KUSTOMIZE_RESULT" "$K8S_APPLICABLE"
          require_conditional "Production configuration" "$PROD_RESULT" "$K8S_APPLICABLE"
          require_conditional "TXO Fabric operator CI" "$OPERATOR_RESULT" "$OPERATOR_APPLICABLE"

          echo "" >> "$SUMMARY"
          if [ "$BLOCKING" -ne 0 ]; then
            echo "❌ One or more applicable validation families did not complete successfully." >> "$SUMMARY"
            exit 1
          fi

          echo "✅ All applicable validation families completed successfully; non-applicable families were intentionally skipped." >> "$SUMMARY"
