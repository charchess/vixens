---
name: Validate & Security

on:
  push:
    branches:
      - main
      - refactor/gitops-cleanroom
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML Syntax & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yaml-tools
        with:
          install-yq: 'false'
      - name: Lint maintained YAML
        run: |
          set -euo pipefail
          find apps argocd \( -name '*.yaml' -o -name '*.yml' \)             ! -path '*/charts/*'             ! -path '*/crds/*'             ! -name 'argocd-crds.yaml'             ! -name 'argocd-install.yaml'             ! -name 'manifests.yaml'             ! -name 'servicemonitors.yaml'             ! -name 'upstream.yaml'             ! -name 'poolers.yaml'             -print0 | xargs -0 -r yamllint -c yamllint-config.yml

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current repository tree
        run: |
          set -euo pipefail
          report="$PWD/gitleaks-report.json"
          rm -f "$report"

          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --no-git --config /repo/.gitleaks.toml --redact --exit-code 1 --report-format json --report-path /repo/gitleaks-report.json
          rc=$?
          set -e

          if [ -s "$report" ]; then
            echo "Gitleaks findings (safe metadata only):"
            jq -r '.[] | " - \(.RuleID) \(.File):\(.StartLine)"' "$report"
          fi

          rm -f "$report"
          exit "$rc"

  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository invariants
        run: python3 scripts/validation/validate-repository.py

  argocd-validate:
    name: ArgoCD Structure
    runs-on: ubuntu-latest
    needs: [yaml-lint, secret-scan, repository-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yaml-tools
        with:
          install-yamllint: 'false'
      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Validate ArgoCD Applications
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if [ "$(yq eval '.kind' "$file" 2>/dev/null)" = Application ]; then
              yq eval '
                .apiVersion == "argoproj.io/v1alpha1" and
                .kind == "Application" and
                .metadata.name != null and
                .spec.project != null and
                .spec.destination.server != null and
                .spec.destination.namespace != null
              ' "$file" >/dev/null
            fi
          done < <(find argocd -name '*.yaml' -type f -print0)
          python3 scripts/validation/validate-helm-values.py argocd/

  kustomize-validate:
    name: Kustomize Build & K8s Validation
    runs-on: ubuntu-latest
    needs: [yaml-lint, secret-scan, repository-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-k8s-tools
      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Validate Kustomize references
        uses: ./.github/actions/setup-yaml-tools
        with:
          install-yamllint: 'false'
      - run: bash scripts/validation/validate-kustomization-refs.sh
      - name: Build application overlays
        run: |
          set -euo pipefail
          skip_kinds='Application,AppProject,CustomResourceDefinition,Middleware,HelmRelease,HelmRepository,Kustomization,Cluster,PostgresCluster,Pooler,ScheduledBackup,VolumeSnapshotClass,VolumeSnapshot,CiliumL2AnnouncementPolicy,CiliumLoadBalancerIPPool'

          while IFS= read -r kustomization; do
            overlay="$(dirname "$kustomization")"
            echo "Building $overlay"
            kustomize build --enable-helm "$overlay" > /tmp/built.yaml
            kubeconform -ignore-missing-schemas               -kubernetes-version 1.34.0               -strict -skip "$skip_kinds" /tmp/built.yaml
            python3 scripts/validation/validate-pdb-selectors.py /tmp/built.yaml
          done < <(
            find apps -type f \(               -path '*/overlays/dev/kustomization.yaml' -o               -path '*/overlays/prod/kustomization.yaml'             \) | sort
          )

          for overlay in argocd/overlays/dev argocd/overlays/prod; do
            echo "Building $overlay"
            kustomize build --enable-helm "$overlay" > /tmp/built.yaml
            kubeconform -ignore-missing-schemas               -kubernetes-version 1.34.0               -strict -skip "$skip_kinds" /tmp/built.yaml
          done

  prod-config-check:
    name: Production Configuration
    runs-on: ubuntu-latest
    needs: [repository-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Enforce production revision contract
        run: |
          set -euo pipefail
          if grep -rE "targetRevision:\s+['\"]?(main|dev|test|staging|prod)['\"]?\s*$"             argocd/overlays/prod; then
            echo "Production Vixens Git sources must track prod-stable"
            exit 1
          fi
          echo "Production revision contract OK"

  security-advisory:
    name: Security Advisory
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-security
      - name: Advisory Checkov scan
        run: |
          checkov --directory . --framework kubernetes --compact --quiet || true

  branch-flow:
    name: Branch Flow Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce feature to main flow
        run: |
          set -euo pipefail
          source_branch="${{ github.head_ref }}"
          target_branch="${{ github.base_ref }}"
          [ "$target_branch" = main ] || {
            echo "Pull requests must target main"
            exit 1
          }
          case "$source_branch" in
            dev|test|staging)
              echo "Retired environment branch cannot be a PR source"
              exit 1
              ;;
          esac

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - yaml-lint
      - secret-scan
      - repository-contract
      - argocd-validate
      - kustomize-validate
      - prod-config-check
      - security-advisory
      - branch-flow
    steps:
      - name: Enforce required results
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != success ]; then
              echo "::error::$name finished with $result"
              failed=1
            fi
          }

          require_success_or_skipped() {
            name="$1"
            result="$2"
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::$name finished with $result"
              failed=1
            fi
          }

          require_success yaml-lint "${{ needs.yaml-lint.result }}"
          require_success secret-scan "${{ needs.secret-scan.result }}"
          require_success repository-contract "${{ needs.repository-contract.result }}"
          require_success argocd-validate "${{ needs.argocd-validate.result }}"
          require_success kustomize-validate "${{ needs.kustomize-validate.result }}"
          require_success prod-config-check "${{ needs.prod-config-check.result }}"
          require_success security-advisory "${{ needs.security-advisory.result }}"
          require_success_or_skipped branch-flow "${{ needs.branch-flow.result }}"

          {
            echo '## Validation results'
            echo
            echo '| Job | Result |'
            echo '|---|---|'
            echo '| YAML | ${{ needs.yaml-lint.result }} |'
            echo '| Secrets | ${{ needs.secret-scan.result }} |'
            echo '| Repository contract | ${{ needs.repository-contract.result }} |'
            echo '| ArgoCD | ${{ needs.argocd-validate.result }} |'
            echo '| Kustomize | ${{ needs.kustomize-validate.result }} |'
            echo '| Production revision | ${{ needs.prod-config-check.result }} |'
            echo '| Security advisory | ${{ needs.security-advisory.result }} |'
            echo '| Branch flow | ${{ needs.branch-flow.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ]
