---
name: Renovate Discord Notifications

on:
  pull_request:
    types: [opened, closed]
    branches: [main]

jobs:
  notify-discord:
    name: Notify Discord on Renovate PR
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'renovate')
    steps:
      - name: Notify on open
        if: github.event.action == 'opened'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RENOVATE }}
        run: |
          curl --fail-with-body -X POST "$DISCORD_WEBHOOK"             -H 'Content-Type: application/json'             -d @- <<'JSON'
          {
            "embeds": [{
              "title": "Renovate update opened",
              "description": "${{ github.event.pull_request.title }}",
              "url": "${{ github.event.pull_request.html_url }}",
              "color": 16776960,
              "fields": [{
                "name": "Merge policy",
                "value": "Auto-merge after required checks pass.",
                "inline": false
              }],
              "footer": {"text": "Vixens GitOps - Renovate"}
            }]
          }
          JSON

      - name: Notify on merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RENOVATE }}
        run: |
          curl --fail-with-body -X POST "$DISCORD_WEBHOOK"             -H 'Content-Type: application/json'             -d @- <<'JSON'
          {
            "embeds": [{
              "title": "Renovate update merged",
              "description": "${{ github.event.pull_request.title }}",
              "url": "${{ github.event.pull_request.html_url }}",
              "color": 3066993,
              "fields": [{
                "name": "Environment",
                "value": "Merged to main; ArgoCD development reconciliation follows.",
                "inline": false
              }],
              "footer": {"text": "Vixens GitOps - Renovate"}
            }]
          }
          JSON

      - name: Notify on close without merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == false
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RENOVATE }}
        run: |
          curl --fail-with-body -X POST "$DISCORD_WEBHOOK"             -H 'Content-Type: application/json'             -d @- <<'JSON'
          {
            "embeds": [{
              "title": "Renovate update closed",
              "description": "${{ github.event.pull_request.title }}",
              "url": "${{ github.event.pull_request.html_url }}",
              "color": 10038562,
              "footer": {"text": "Vixens GitOps - Renovate"}
            }]
          }
          JSON
