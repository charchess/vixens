---
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Dev version to promote (e.g. v2026.09.3512 from dev-v2026.09.3512)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev to prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable promotion target
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid version '${INPUT_VERSION}'. Expected vYYYY.MM.<PR-or-short-sha>."
            exit 1
          fi

          DEV_TAG="dev-v${VERSION}"
          PROD_TAG="prod-v${VERSION}"
          git fetch --force --tags origin main

          if ! git rev-parse "${DEV_TAG}^{commit}" >/dev/null 2>&1; then
            echo "::error::Tag ${DEV_TAG} does not exist"
            echo "Available dev tags:"
            git tag -l 'dev-v*' --sort=-version:refname | head -n 10
            exit 1
          fi

          COMMIT_SHA=$(git rev-parse "${DEV_TAG}^{commit}")
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::${DEV_TAG} points to ${COMMIT_SHA}, which is not an ancestor of main"
            exit 1
          fi

          PROD_EXISTS=false
          if git rev-parse "${PROD_TAG}^{commit}" >/dev/null 2>&1; then
            EXISTING_PROD_COMMIT=$(git rev-parse "${PROD_TAG}^{commit}")
            if [[ "$EXISTING_PROD_COMMIT" != "$COMMIT_SHA" ]]; then
              echo "::error::${PROD_TAG} already exists on ${EXISTING_PROD_COMMIT}, expected ${COMMIT_SHA}"
              exit 1
            fi
            PROD_EXISTS=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
          echo "prod_tag=$PROD_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "prod_exists=$PROD_EXISTS" >> "$GITHUB_OUTPUT"
          echo "✅ Resolved ${DEV_TAG} -> ${COMMIT_SHA}"

      - name: Checkout exact promoted commit
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$COMMIT_SHA"
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          if [[ "$ACTUAL_COMMIT" != "$COMMIT_SHA" ]]; then
            echo "::error::Checked out ${ACTUAL_COMMIT}, expected ${COMMIT_SHA}"
            exit 1
          fi
          echo "✅ Release workspace pinned to ${COMMIT_SHA}"

      - name: Create promotion metadata
        id: metadata
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          DEV_TAG: ${{ steps.resolve.outputs.dev_tag }}
          PROD_TAG: ${{ steps.resolve.outputs.prod_tag }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          PROMOTED_BY: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          METADATA_FILE="promotion-prod-${VERSION}.json"
          PROMOTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg version "$VERSION" \
            --arg dev_tag "$DEV_TAG" \
            --arg prod_tag "$PROD_TAG" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg promoted_by "$PROMOTED_BY" \
            --arg promoted_at "$PROMOTED_AT" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            --arg workflow_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_url "$WORKFLOW_URL" \
            '{
              version: $version,
              dev_tag: $dev_tag,
              prod_tag: $prod_tag,
              commit_sha: $commit_sha,
              promoted_by: $promoted_by,
              promoted_at: $promoted_at,
              workflow_run: $workflow_run,
              workflow_attempt: $workflow_attempt,
              workflow_url: $workflow_url
            }' > "$METADATA_FILE"

          echo "metadata_file=$METADATA_FILE" >> "$GITHUB_OUTPUT"
          echo "✅ Created ${METADATA_FILE}"

      - name: Generate SBOM from promoted commit
        uses: anchore/sbom-action@v0
        with:
          path: ./apps
          format: spdx-json
          output-file: sbom-prod-${{ steps.resolve.outputs.version }}.spdx.json

      - name: Create or verify immutable prod tag
        env:
          PROD_TAG: ${{ steps.resolve.outputs.prod_tag }}
          DEV_TAG: ${{ steps.resolve.outputs.dev_tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          PROD_EXISTS: ${{ steps.resolve.outputs.prod_exists }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [[ "$PROD_EXISTS" == "true" ]]; then
            echo "✅ ${PROD_TAG} already exists on the expected commit"
          else
            git tag -a "$PROD_TAG" "$COMMIT_SHA" \
              -m "Production release ${VERSION}" \
              -m "Promoted from: ${DEV_TAG}" \
              -m "Commit: ${COMMIT_SHA}" \
              -m "Promoted by: ${{ github.actor }}"
            git push origin "refs/tags/${PROD_TAG}"
            echo "✅ Created immutable tag: ${PROD_TAG}"
          fi

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.prod_tag }}
          fail_on_unmatched_files: true
          files: |
            sbom-prod-${{ steps.resolve.outputs.version }}.spdx.json
            ${{ steps.metadata.outputs.metadata_file }}
          body: |
            ## Production Release ${{ steps.resolve.outputs.version }}

            Promoted from: `${{ steps.resolve.outputs.dev_tag }}`
            Commit: `${{ steps.resolve.outputs.commit_sha }}`

            Release assets contain the SBOM and promotion metadata generated from this exact commit.

      - name: Move prod-stable atomically
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PROD_TAG: ${{ steps.resolve.outputs.prod_tag }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -fa prod-stable "$COMMIT_SHA" \
            -m "Production stable: ${VERSION}" \
            -m "Points to: ${PROD_TAG}" \
            -m "Promoted by: ${{ github.actor }}"
          git push --force origin refs/tags/prod-stable
          echo "✅ Updated prod-stable to ${VERSION}"

      - name: Verify production pointer
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          ACTUAL_COMMIT=$(git rev-parse 'prod-stable^{commit}')
          if [[ "$ACTUAL_COMMIT" != "$COMMIT_SHA" ]]; then
            echo "::error::prod-stable resolves to ${ACTUAL_COMMIT}, expected ${COMMIT_SHA}"
            exit 1
          fi
          echo "✅ prod-stable resolves to ${COMMIT_SHA}"

      - name: Summary
        run: |
          echo "## 🚀 Production Promotion Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Promoted version: \`${{ steps.resolve.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source:** \`${{ steps.resolve.outputs.dev_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Immutable release:** \`${{ steps.resolve.outputs.prod_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployment pointer:** \`prod-stable\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ steps.resolve.outputs.commit_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Promoted by:** @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD can now reconcile production from this exact release." >> "$GITHUB_STEP_SUMMARY"
