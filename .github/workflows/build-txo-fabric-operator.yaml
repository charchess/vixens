---
name: Build TXO Fabric Operator

on:
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/operator/**/*.go
      - apps/60-services/txo-fabric/operator/go.mod
      - apps/60-services/txo-fabric/operator/Dockerfile
      - .github/workflows/build-txo-fabric-operator.yaml
  workflow_dispatch:

concurrency:
  group: build-txo-fabric-operator
  cancel-in-progress: true

jobs:
  build:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(txo-fabric): pin operator image') }}"
    name: Build, push and pin image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          TAG="main-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/txo-fabric-operator:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/operator
          push: true
          tags: ${{ steps.tag.outputs.image }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image and dependency lock in GitOps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BRANCH="chore/txo-fabric-operator-image-${TAG}"
          MANAGER="apps/60-services/txo-fabric/operator/config/manager/manager.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          sed -i "s|image: ghcr.io/charchess/txo-fabric-operator:.*|image: ${NEW_IMAGE}|" "$MANAGER"

          # First build also materializes go.sum and the pruned module graph.
          (cd apps/60-services/txo-fabric/operator && go mod tidy)

          git add "$MANAGER" apps/60-services/txo-fabric/operator/go.mod apps/60-services/txo-fabric/operator/go.sum
          if git diff --cached --quiet; then
            echo "Nothing to pin"
            exit 0
          fi

          git commit -m "chore(txo-fabric): pin operator image ${TAG}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore(txo-fabric): pin operator image ${TAG}" \
            --body "$(cat <<EOF_BODY
          Auto-generated after a successful TXO Fabric operator build.

          **Image:** \`${NEW_IMAGE}\`
          **Source commit:** \`${{ github.sha }}\`

          This PR pins the immutable operator image and commits the Go module lock files. It does **not** enable the operator or remove the Kyverno POC provisioner; that cutover remains an explicit GitOps migration.
          EOF_BODY
          )" \
            --base main \
            --head "$BRANCH"
