---
name: Build TXO Fabric Operator

on:
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/operator/**/*.go
      - '!apps/60-services/txo-fabric/operator/**/*_test.go'
      - apps/60-services/txo-fabric/operator/go.mod
      - apps/60-services/txo-fabric/operator/Dockerfile
      - .github/workflows/build-txo-fabric-operator.yaml
  workflow_dispatch:

concurrency:
  group: build-txo-fabric-operator
  cancel-in-progress: true

jobs:
  build:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(txo-fabric): pin operator image') }}"
    name: Build, push and pin image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate TXO release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TXO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TXO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: false

      - name: Configure TXO release bot Git identity
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          TAG="main-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/txo-fabric-operator:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GitHub-hosted runner already supplies Buildx (single-platform).
      # docker-container would pull moby/buildkit from anonymous Docker Hub,
      # which exhausted/throttled on #4009. Use the runner's native daemon.
      - name: Verify runner-native Docker Buildx
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx inspect default --bootstrap

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/operator
          push: true
          tags: ${{ steps.tag.outputs.image }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Pin image and dependency lock in GitOps
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          NEW_IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BRANCH="chore/txo-fabric-operator-image-${TAG}"
          MANAGER="apps/60-services/txo-fabric/operator/config/manager/manager.yaml"

          git checkout -b "$BRANCH"

          sed -i "s|image: ghcr.io/charchess/txo-fabric-operator:.*|image: ${NEW_IMAGE}|" "$MANAGER"

          # First build also materializes go.sum and the pruned module graph.
          (cd apps/60-services/txo-fabric/operator && go mod tidy)

          git add "$MANAGER" apps/60-services/txo-fabric/operator/go.mod apps/60-services/txo-fabric/operator/go.sum
          if git diff --cached --quiet; then
            echo "Nothing to pin"
            exit 0
          fi

          git commit -m "chore(txo-fabric): pin operator image ${TAG}"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(txo-fabric): pin operator image ${TAG}" \
            --body "$(cat <<EOF_BODY
          Auto-generated after a successful TXO Fabric operator build.

          **Image:** \`${NEW_IMAGE}\`
          **Source commit:** \`${{ github.sha }}\`

          This PR pins the immutable operator image and commits the Go module lock files. It does **not** enable the operator or remove the Kyverno POC provisioner; that cutover remains an explicit GitOps migration.
          EOF_BODY
          )" \
            --base main \
            --head "$BRANCH")

          gh pr merge "$PR_URL" --squash --auto --delete-branch
