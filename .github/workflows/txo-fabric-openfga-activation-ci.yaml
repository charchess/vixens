---
name: TXO Fabric OpenFGA Activation CI

on:
  pull_request:
    paths:
      - 'apps/60-services/txo-fabric/openfga/runtime/**'
      - 'apps/60-services/txo-fabric/overlays/prod/kustomization.yaml'
      - '.github/workflows/txo-fabric-openfga-activation-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/60-services/txo-fabric/openfga/runtime/**'
      - 'apps/60-services/txo-fabric/overlays/prod/kustomization.yaml'
      - '.github/workflows/txo-fabric-openfga-activation-ci.yaml'

permissions:
  contents: read

jobs:
  activate-openfga:
    name: Verify centralized OpenFGA activation and OCI pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.5.0'
      - name: Resolve upstream release digest for supply-chain review
        run: |
          set -euo pipefail
          echo "Official upstream OpenFGA v1.22.0 manifest:"
          docker buildx imagetools inspect docker.io/openfga/openfga:v1.22.0 | grep -E '^(Name|MediaType|Digest):'
      - name: Check immutable release pin, private-only service, and production render
        run: |
          set -euo pipefail
          RUNTIME=apps/60-services/txo-fabric/openfga/runtime
          PROD=apps/60-services/txo-fabric/overlays/prod
          grep -q '^  - ../../openfga/runtime$' "$PROD/kustomization.yaml"
          mapfile -t imgs < <(grep 'image: docker.io/openfga/openfga@sha256:' "$RUNTIME"/{deployment,migration-job}.yaml | sed -E 's/^[[:space:]]+image: //')
          if [ "${#imgs[@]}" -ne 2 ] || [ "${imgs[0]}" != "${imgs[1]}" ]; then
            echo "Migration and serving image must share the same immutable OCI digest" >&2
            exit 1
          fi
          if ! printf '%s\n' "${imgs[0]}" | grep -Eq '^docker.io/openfga/openfga@sha256:[0-9a-f]{64}$'; then
            echo "Invalid OpenFGA image digest" >&2
            exit 1
          fi
          echo "Checking that pinned OCI digest exists in upstream registry:"
          docker buildx imagetools inspect "${imgs[0]}" >/dev/null
          kustomize build "$RUNTIME" > /tmp/openfga-runtime.yaml
          kustomize build "$PROD" > /tmp/openfga-prod.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/openfga-runtime.yaml)" -eq 1
          test "$(grep -c '^kind: Service$' /tmp/openfga-runtime.yaml)" -eq 1
          if grep -Eq '^kind: (Ingress|IngressRoute|Gateway)$' /tmp/openfga-runtime.yaml; then
            echo "OpenFGA runtime must remain private" >&2
            exit 1
          fi
          grep -q 'name: txo-fabric-openfga' /tmp/openfga-prod.yaml
          grep -q 'name: txo-openfga-runtime-credentials' /tmp/openfga-prod.yaml
          grep -q 'name: txo-openfga-postgresql-credentials' /tmp/openfga-prod.yaml
          grep -q 'name: txo-openfga-migrate-v1-22-0' /tmp/openfga-prod.yaml
          echo "OpenFGA central runtime included, immutable and private."
