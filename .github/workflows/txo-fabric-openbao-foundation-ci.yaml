---
name: TXO Fabric OpenBao Foundation CI

on:
  pull_request:
    paths:
      - 'apps/60-services/txo-fabric/openbao-fabric/**'
      - 'docs/adr/041-separate-openbao-fabric-secret-plane.md'
      - 'docs/adr/000-index.md'
      - 'docs/adr/README.md'
      - 'docs/troubleshooting/txo-fabric-openbao-bootstrap-and-restore.md'
      - 'scripts/validation/validate_openbao_fabric_source.py'
      - '.github/workflows/txo-fabric-openbao-foundation-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/60-services/txo-fabric/openbao-fabric/**'
      - 'docs/adr/041-separate-openbao-fabric-secret-plane.md'
      - 'docs/adr/000-index.md'
      - 'docs/adr/README.md'
      - 'docs/troubleshooting/txo-fabric-openbao-bootstrap-and-restore.md'
      - 'scripts/validation/validate_openbao_fabric_source.py'
      - '.github/workflows/txo-fabric-openbao-foundation-ci.yaml'

permissions:
  contents: read

jobs:
  source-only:
    name: Prove Fabric OpenBao remains source-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Python source syntax
        run: python3 -m py_compile scripts/validation/validate_openbao_fabric_source.py
      - name: Verify source-only secret boundary and changed scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
            python3 scripts/validation/validate_openbao_fabric_source.py --base "$BASE_SHA"
          else
            python3 scripts/validation/validate_openbao_fabric_source.py
          fi
      - name: Setup validated Kustomize tooling
        uses: ./.github/actions/setup-k8s-tools
      - name: Render current Infra and TXO production overlays; assert Fabric not activated
        shell: bash
        run: |
          kustomize build apps/00-infra/openbao/overlays/dev > /tmp/openbao-infra-dev.yaml
          kustomize build apps/00-infra/openbao/overlays/prod > /tmp/openbao-infra-prod.yaml
          kustomize build apps/60-services/txo-fabric/overlays/prod > /tmp/txo-fabric-prod.yaml
          grep -Eq '^  name: openbao$' /tmp/openbao-infra-prod.yaml
          if grep -Eq '(openbao-fabric-store|name: openbao-fabric([[:space:]]|$)|app.kubernetes.io/name: openbao-fabric)' /tmp/txo-fabric-prod.yaml; then
            echo 'FAIL: Fabric OpenBao unexpectedly present in production rendered resources'
            exit 1
          fi
          if grep -Eq '(openbao-fabric-store|name: openbao-fabric([[:space:]]|$))' /tmp/openbao-infra-prod.yaml; then
            echo 'FAIL: Fabric OpenBao leaked into infra production'
            exit 1
          fi
          echo 'PASS: Infra and TXO prod render; no OpenBao Fabric resource or store'
