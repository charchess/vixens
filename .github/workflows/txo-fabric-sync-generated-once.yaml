---
name: TXO Fabric Sync Generated API Once

on:
  push:
    branches:
      - feat/txo-fabric-capability-profiles
    paths:
      - .github/workflows/txo-fabric-sync-generated-once.yaml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TXO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TXO_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/txo-fabric-capability-profiles
          token: ${{ steps.release-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Generate authoritative API artifacts without bootstrap shim
        working-directory: apps/60-services/txo-fabric/operator
        run: make generate manifests

      - name: Self-remove helper
        run: rm .github/workflows/txo-fabric-sync-generated-once.yaml

      - name: Commit generated API artifacts
        env:
          BRANCH: feat/txo-fabric-capability-profiles
        run: |
          git config user.name 'txo-fabric-release-bot[bot]'
          git config user.email '334517181+txo-fabric-release-bot[bot]@users.noreply.github.com'
          git add -A \
            apps/60-services/txo-fabric/operator/api/v1alpha1/zz_generated.deepcopy.go \
            apps/60-services/txo-fabric/operator/config/crd \
            apps/60-services/txo-fabric/operator/config/rbac \
            .github/workflows/txo-fabric-sync-generated-once.yaml
          git diff --cached --check
          git commit -m 'chore(txo-fabric): regenerate profile deepcopy artifacts'
          git push origin "HEAD:${BRANCH}"
