---
name: Build TXO Hermes Hindsight Plugin Bundle

on:
  pull_request:
    paths:
      - apps/60-services/txo-fabric/hermes-hindsight-plugin/**
      - .github/workflows/build-txo-hermes-hindsight-plugin.yaml
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/hermes-hindsight-plugin/**
      - .github/workflows/build-txo-hermes-hindsight-plugin.yaml
  workflow_dispatch:
    inputs:
      hermes_tag:
        description: 'Versioned official upstream Hermes tag to pin on edge (never :latest)'
        required: true
        type: string
        default: 'v0.21.6'

concurrency:
  group: txo-hermes-hindsight-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify pinned plugin bundle
    runs-on: ubuntu-latest
    outputs:
      hermes_image: ${{ steps.official.outputs.image }}
      hermes_tag: ${{ steps.official.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve official upstream Hermes OCI manifest by versioned tag
        id: official
        env:
          HERMES_TAG: ${{ inputs.hermes_tag || 'v0.21.6' }}
        run: |
          set -euo pipefail
          if [[ ! "$HERMES_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Hermes must use a versioned upstream tag, not :latest or :main"
            exit 1
          fi
          TAG_REF="$RUNNER_TEMP/official-hermes-tag-ref.json"
          TAG_OBJECT="$RUNNER_TEMP/official-hermes-annotated-tag.json"
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/NousResearch/hermes-agent/git/ref/tags/$HERMES_TAG" -o "$TAG_REF"
          TAG_SHA="$(python3 - "$TAG_REF" <<'PY'
          import json, sys
          ref = json.load(open(sys.argv[1], encoding="utf-8"))
          if ref.get("object", {}).get("type") != "tag":
              raise SystemExit("Hermes release needs an annotated Git receipt tag")
          print(ref["object"]["sha"])
          PY
          )"
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/NousResearch/hermes-agent/git/tags/$TAG_SHA" -o "$TAG_OBJECT"
          DIGEST="$(python3 apps/60-services/txo-fabric/hermes-hindsight-plugin/verify_release_receipt.py \
            "$HERMES_TAG" "$TAG_REF" "$TAG_OBJECT")"
          docker buildx imagetools inspect "nousresearch/hermes-agent@$DIGEST" > /dev/null
          LIVE_DIGEST="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "nousresearch/hermes-agent:$HERMES_TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin))')"
          if [[ "$LIVE_DIGEST" != "$DIGEST" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning::Hermes version tag differs from its annotated release receipt; PR smoke uses immutable release digest, publication remains blocked"
            else
              echo "::error::Hermes tag currently resolves to $LIVE_DIGEST but official release receipt is $DIGEST; refuse edge nomination"
              exit 1
            fi
          fi
          echo "Verified upstream release $HERMES_TAG OCI index $DIGEST"
          echo "image=nousresearch/hermes-agent@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=$HERMES_TAG" >> "$GITHUB_OUTPUT"
      - name: Check immutable release nomination algorithm
        run: python3 -m unittest discover -s apps/60-services/txo-fabric/hermes-hindsight-plugin/tests -p 'test_*.py'
      - name: Build plugin payload
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-hindsight-plugin
          push: false
          load: true
          tags: txo-hindsight-payload:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test official Hermes plugin discovery and wheel isolation
        env:
          HERMES_IMAGE: ${{ steps.official.outputs.image }}
        run: |
          set -e
          PAYLOAD_DIR="$(mktemp -d)"
          id="$(docker create txo-hindsight-payload:ci)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true; rm -rf "$PAYLOAD_DIR"' EXIT
          docker cp "$id:/bundle/hindsight" "$PAYLOAD_DIR/hindsight"
          docker cp "$id:/bundle/python" "$PAYLOAD_DIR/python"
          docker run --rm \
            -e HERMES_HOME=/opt/data \
            -e PYTHONPATH=/opt/txo-hindsight/python \
            -e HERMES_DISABLE_LAZY_INSTALLS=1 \
            -v "$PAYLOAD_DIR/hindsight:/opt/data/plugins/hindsight:ro" \
            -v "$PAYLOAD_DIR/python:/opt/txo-hindsight/python:ro" \
            --entrypoint /opt/hermes/.venv/bin/python \
            "$HERMES_IMAGE" \
            -c 'from plugins.memory import find_provider_dir; from pathlib import Path; import hindsight_client, aiohttp_retry; p=find_provider_dir("hindsight"); assert p is not None and str(p)=="/opt/data/plugins/hindsight",p; assert Path(p,"plugin.yaml").is_file(); print("OFFICIAL_HERMES_HINDSIGHT_DISCOVERY_OK")'

  publish:
    name: Publish payload and propose Hermes edge candidate
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TXO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TXO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: false
      - name: Release bot identity
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push OCI payload
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-hindsight-plugin
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/txo-hermes-hindsight-plugin:main-${{ github.sha }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create review-only Hermes edge pin PR
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          BUNDLE_DIGEST: ${{ steps.push.outputs.digest }}
          HERMES_IMAGE: ${{ needs.verify.outputs.hermes_image }}
          HERMES_TAG: ${{ needs.verify.outputs.hermes_tag }}
        run: |
          set -e
          PLUGIN_IMAGE="ghcr.io/${{ github.repository_owner }}/txo-hermes-hindsight-plugin@${BUNDLE_DIGEST}"
          # The verify job tested the exact manifest resolved from this versioned tag.
          test -n "$HERMES_IMAGE"
          test -n "$HERMES_TAG"
          BRANCH="chore/txo-hermes-edge-release-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH}"
          RELEASE_NAME="$(python3 apps/60-services/txo-fabric/hermes-hindsight-plugin/nominate_edge.py "${HERMES_IMAGE}" "${PLUGIN_IMAGE}" "${HERMES_TAG}")"
          echo "Official Hermes edge release candidate: ${RELEASE_NAME}"
          git add apps/60-services/txo-fabric/operator/config/profiles
          if git diff --cached --quiet; then
            echo "Candidate release and pointer already declared"
            exit 0
          fi
          git commit -m "chore(txo-fabric): nominate immutable Hermes runtime release ${RELEASE_NAME}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --title "chore(txo-fabric): Hermes edge pointer to immutable release ${RELEASE_NAME}" \
            --body "Candidate for #3947 and #3944. Official Hermes release tag ${HERMES_TAG}, resolved to the exact OCI digest and tested in CI with the pinned plugin bundle. Moves ONLY hermes-edge.releaseRef; does not advance hermes-canary or hermes-stable or modify any AgentIdentity. CI is not real-cluster acceptance. Promotion to canary/stable is independently reviewed and stable requires physical evidence under #3688. No auto-merge or prod promotion." \
            --base main --head "${BRANCH}"
