---
name: Build TXO Hermes Hindsight Plugin Bundle

on:
  pull_request:
    paths:
      - apps/60-services/txo-fabric/hermes-hindsight-plugin/**
      - .github/workflows/build-txo-hermes-hindsight-plugin.yaml
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/hermes-hindsight-plugin/**
      - .github/workflows/build-txo-hermes-hindsight-plugin.yaml
  workflow_dispatch:

concurrency:
  group: txo-hermes-hindsight-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify pinned plugin bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check immutable release nomination algorithm
        run: python3 -m unittest discover -s apps/60-services/txo-fabric/hermes-hindsight-plugin/tests -p 'test_*.py'
      - name: Build plugin payload
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-hindsight-plugin
          push: false
          load: true
          tags: txo-hindsight-payload:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test official Hermes plugin discovery and wheel isolation
        run: |
          set -e
          PAYLOAD_DIR="$(mktemp -d)"
          id="$(docker create txo-hindsight-payload:ci)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true; rm -rf "$PAYLOAD_DIR"' EXIT
          docker cp "$id:/bundle/hindsight" "$PAYLOAD_DIR/hindsight"
          docker cp "$id:/bundle/python" "$PAYLOAD_DIR/python"
          docker run --rm \
            -e HERMES_HOME=/opt/data \
            -e PYTHONPATH=/opt/txo-hindsight/python \
            -e HERMES_DISABLE_LAZY_INSTALLS=1 \
            -v "$PAYLOAD_DIR/hindsight:/opt/data/plugins/hindsight:ro" \
            -v "$PAYLOAD_DIR/python:/opt/txo-hindsight/python:ro" \
            --entrypoint /opt/hermes/.venv/bin/python \
            nousresearch/hermes-agent:v2026.9.24 \
            -c 'from plugins.memory import find_provider_dir; from pathlib import Path; import hindsight_client, aiohttp_retry; p=find_provider_dir("hindsight"); assert p is not None and str(p)=="/opt/data/plugins/hindsight",p; assert Path(p,"plugin.yaml").is_file(); print("OFFICIAL_HERMES_HINDSIGHT_DISCOVERY_OK")'

  publish:
    name: Publish payload and nominate official Hermes canary
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TXO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TXO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: false
      - name: Release bot identity
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push OCI payload
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-hindsight-plugin
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/txo-hermes-hindsight-plugin:main-${{ github.sha }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create review-only canary pin PR
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          BUNDLE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -e
          PLUGIN_IMAGE="ghcr.io/${{ github.repository_owner }}/txo-hermes-hindsight-plugin@${BUNDLE_DIGEST}"
          # Resolve the *registry-provided* manifest digest of the official
          # upstream tag. Never hash formatted CLI output (which may add a newline).
          HERMES_MANIFEST_SHA="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' nousresearch/hermes-agent:v2026.9.24 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.startswith("sha256:"); print(d[7:])')"
          test "${#HERMES_MANIFEST_SHA}" -eq 64
          HERMES_IMAGE="nousresearch/hermes-agent@sha256:${HERMES_MANIFEST_SHA}"
          BRANCH="chore/txo-hermes-runtime-release-$(git rev-parse --short=12 HEAD)"
          git checkout -b "${BRANCH}"
          RELEASE_NAME="$(python3 apps/60-services/txo-fabric/hermes-hindsight-plugin/nominate_canary.py "${HERMES_IMAGE}" "${PLUGIN_IMAGE}")"
          echo "Canary release candidate: ${RELEASE_NAME}"
          git add apps/60-services/txo-fabric/operator/config/profiles
          if git diff --cached --quiet; then
            echo "Candidate release and pointer already declared"
            exit 0
          fi
          git commit -m "chore(txo-fabric): nominate immutable Hermes runtime release ${RELEASE_NAME}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --title "chore(txo-fabric): canary pointer to immutable Hermes release ${RELEASE_NAME}" \
            --body "Candidate for #3944, #3939, #3688. Creates a new immutable HermesRuntimeRelease from upstream engine OCI digest plus pinned Hindsight bundle, and moves ONLY hermes-upgrade-canary.releaseRef. No change to hermes-default, no automatic merge or production promotion. Requires real isolated canary Pod and retained-state/s6/Hindsight/rollback acceptance before approving." \
            --base main --head "${BRANCH}"
