---
name: Build TXO Fabric Hermes Runtime

on:
  pull_request:
    paths:
      - apps/60-services/txo-fabric/hermes-runtime/**
      - .github/workflows/build-txo-fabric-hermes.yaml
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/hermes-runtime/**
      - .github/workflows/build-txo-fabric-hermes.yaml
  workflow_dispatch:

concurrency:
  group: build-txo-fabric-hermes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke-test runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-runtime
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Historical Hermes-derived runtime source is deliberately verify-only. Never
# publish or pin new derived runtime images: #3939 provisions plugins offline
# alongside the official image instead. Delete this workflow with the retired
# hermes-runtime source once #3938 has been rebased and accepted.
