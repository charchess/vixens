---
name: Build TXO Fabric Hermes Runtime

on:
  pull_request:
    paths:
      - apps/60-services/txo-fabric/hermes-runtime/**
      - .github/workflows/build-txo-fabric-hermes.yaml
  push:
    branches: [main]
    paths:
      - apps/60-services/txo-fabric/hermes-runtime/**
      - .github/workflows/build-txo-fabric-hermes.yaml
  workflow_dispatch:

concurrency:
  group: build-txo-fabric-hermes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke-test runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-runtime
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    name: Push image and open pin PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate TXO release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TXO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TXO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: false

      - name: Configure TXO release bot Git identity
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          TAG="main-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/txo-fabric-hermes:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/60-services/txo-fabric/hermes-runtime
          push: true
          tags: ${{ steps.tag.outputs.image }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=nousresearch/hermes-agent:v2026.9.24
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open generated runtime pin PR
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          NEW_IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BRANCH="chore/txo-fabric-hermes-image-${TAG}"
          # Only nominate candidate images for isolated canary testing.
          PROFILE="apps/60-services/txo-fabric/operator/config/profiles/hermes-upgrade-canary.yaml"

          git checkout -b "$BRANCH"

          sed -i "s|^  image: .*|  image: ${NEW_IMAGE}|" "$PROFILE"

          git add "$PROFILE"
          if git diff --cached --quiet; then
            echo "Nothing to pin"
            exit 0
          fi

          git commit -m "chore(txo-fabric): pin Hermes runtime ${TAG}"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(txo-fabric): pin Hermes upgrade canary ${TAG}" \
            --body "$(cat <<EOF_BODY
          Auto-generated canary-only after a successful TXO Fabric Hermes runtime build.

          **Image:** \`${NEW_IMAGE}\`
          **Source commit:** \`${{ github.sha }}\`

          This materializes a candidate image for #3688 canary acceptance; it does not update the shared hermes-default runtime.

          It does **not** enable \`memory.provider: hindsight\`, inject Hindsight credentials, touch #3697, or promote production. #3696 remains open until the generated pin is merged and the physical dev smoke is accepted.
          EOF_BODY
          )" \
            --base main \
            --head "$BRANCH")

          echo "Canary pin PR requires review and retained-state acceptance; auto-merge disabled."
